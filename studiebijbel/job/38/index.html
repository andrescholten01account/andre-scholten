 het te kennen, indien u kloek van verstand bent.","5":"Wie heeft haar maten gezet, want u weet het; of wie heeft over haar een richtsnoer getrokken?","6":"Waarop zijn haar grondvesten neergezonken, of wie heeft haar hoeksteen gelegd?","7":"Toen de morgensterren samen vrolijk zongen, en al de kinderen van God juichten.","8":"Of *wie* heeft de zee met deuren toegesloten, toen zij uitbrak, *en* uit de baarmoeder voortkwam?","9":"Toen Ik de wolk *tot* haar kleding stelde, en de donkerheid *tot* haar windeldoek;","10":"Toen Ik voor haar *met* Mijn besluit *de* *aarde* doorbrak, en grendel en deuren zette;","11":"En zei: Tot hiertoe zult u komen, en niet verder, en hier zal hij zich stellen tegen de hoogmoed van uw golven.","12":"Hebt u van uw dagen de morgenstond geboden? Hebt u de dageraad zijn plaats gewezen;","13":"Opdat hij de einden van de aarde vatten zou; en de goddelozen uit haar uitgeschud zouden worden?","14":"Dat zij veranderd zou worden gelijk zegelleem, en zij gesteld worden als een kleed?","15":"En dat van de goddelozen hun licht geweerd wordt, en de hoge arm gebroken wordt?","16":"Bent u gekomen tot aan de oorsprongen van de zee, en hebt u in het onderste van het afgrond gewandeld?","17":"Zijn u de poorten van de dood ontdekt, en hebt u gezien de poorten van de schaduw van de dood?","18":"Bent u met uw verstand gekomen tot aan de breedte van de aarde? Geef het te kennen, indien u dit alles weet.","19":"Waar is de weg, *daar* het licht woont? En de duisternis, waar is haar plaats?","20":"Dat u dat brengen zou tot zijn grens, en dat u de paden van zijn huis merken zou?","21":"U weet het, want u was toen geboren, en uw dagen zijn veel in getal.","22":"Bent u gekomen tot de schatkamers van de sneeuw, en hebt u de schatkamers van de hagel gezien?","23":"Die Ik ophoud tot de tijd van de benauwdheid, tot de dag van de strijd en van de oorlog!","24":"Waar is de weg, *daar* het licht verdeeld wordt, *en* de oostenwind zich verstrooit op de aarde?","25":"Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen?","26":"Om te regenen op het land, *waar* niemand is, *op* de woestijn, waarin geen mens is;","27":"Om het woeste en het verwoeste te verzadigen, en om het uitspruitsel van de grasscheutjes te doen meer worden.","28":"Heeft de regen een vader, of wie baart de druppels van de dauw?","29":"Uit wiens buik komt het ijs voort, en wie baart de rijm van de hemel?","30":"Als met een steen verbergen zich de wateren, en het vlakke van het afgrond wordt omvat.","31":"Kunt u de liefelijkheden van het Zevengesternte binden, of de strengen van de Orion losmaken?","32":"Kunt u de Mazzaroth voortbrengen op haar tijd, en de Wagen met zijn kinderen leiden?","33":"Weet u de verordeningen van de hemel, of kunt u zijn heerschappij op de aarde bestellen?","34":"Kunt u uw stem tot de wolken opheffen, opdat een overvloed van water u bedekt?","35":"Kunt u de bliksemen uitlaten, dat zij heengaan, en tot u zeggen: Zie, *hier* zijn wij?","36":"Wie heeft de wijsheid in het binnenste gezet? Of wie heeft de zin het verstand gegeven?","37":"Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?","38":"Als het stof doorgoten is tot vastigheid, en de kluiten samenkleven?"},"SV":{"1":"Daarna antwoordde de HEERE Job uit een onweder, en zeide:","2":"Wie is hij, die den raad verduistert met woorden zonder wetenschap?","3":"Gord nu, als een man, uw lenden, zo zal Ik u vragen, en onderricht Mij.","4":"Waar waart gij, toen Ik de aarde grondde? Geef het te kennen, indien gij kloek van verstand zijt.","5":"Wie heeft haar maten gezet, want gij weet het; of wie heeft over haar een richtsnoer getrokken?","6":"Waarop zijn haar grondvesten nedergezonken, of wie heeft haar hoeksteen gelegd?","7":"Toen de morgensterren te zamen vrolijk zongen, en al de kinderen Gods juichten.","8":"Of *wie* heeft de zee met deuren toegesloten, toen zij uitbrak, *en* uit de baarmoeder voortkwam?","9":"Toen Ik de wolk *tot* haar kleding stelde, en de donkerheid *tot* haar windeldoek;","10":"Toen Ik voor haar *met* Mijn besluit *de* *aarde* doorbrak, en zette grendel en deuren;","11":"En zeide: Tot hiertoe zult gij komen, en niet verder, en hier zal hij zich stellen tegen den hoogmoed uwer golven.","12":"Hebt gij van uw dagen den morgenstond geboden? Hebt gij den dageraad zijn plaats gewezen;","13":"Opdat hij de einden der aarde vatten zou; en de goddelozen uit haar uitgeschud zouden worden?","14":"Dat zij veranderd zou worden gelijk zegelleem, en zij gesteld worden als een kleed?","15":"En dat van de goddelozen hun licht geweerd worde, en de hoge arm worde gebroken?","16":"Zijt gij gekomen tot aan de oorsprongen der zee, en hebt gij in het onderste des afgronds gewandeld?","17":"Zijn u de poorten des doods ontdekt, en hebt gij gezien de poorten van de schaduw des doods?","18":"Zijt gij met uw verstand gekomen tot aan de breedte der aarde? Geef het te kennen, indien gij dit alles weet.","19":"Waar is de weg, *daar* het licht woont? En de duisternis, waar is haar plaats?","20":"Dat gij dat brengen zoudt tot zijn pale, en dat gij merken zoudt de paden zijns huizes?","21":"Gij weet het, want gij waart toen geboren, en uw dagen zijn veel in getal.","22":"Zijt gij gekomen tot de schatkameren der sneeuw, en hebt gij de schatkameren des hagels gezien?","23":"Dien Ik ophoude tot den tijd der benauwdheid, tot den dag des strijds en des oorlogs!","24":"Waar is de weg, *daar* het licht verdeeld wordt, *en* de oostenwind zich verstrooit op de aarde?","25":"Wie deelt voor den stortregen een waterloop uit, en een weg voor het weerlicht der donderen?","26":"Om te regenen op het land, *waar* niemand is, *op* de woestijn, waarin geen mens is;","27":"Om het woeste en het verwoeste te verzadigen, en om het uitspruitsel der grasscheutjes te doen wassen.","28":"Heeft de regen een vader, of wie baart de druppelen des dauws?","29":"Uit wiens buik komt het ijs voort, en wie baart den rijm des hemels?","30":"Als met een steen verbergen zich de wateren, en het vlakke des afgrond wordt omvat.","31":"Kunt gij de liefelijkheden van het Zevengesternte binden, of de strengen des Orions losmaken?","32":"Kunt gij de Mazzaroth voortbrengen op haar tijd, en den Wagen met zijn kinderen leiden?","33":"Weet gij de verordeningen des hemels, of kunt gij deszelfs heerschappij op de aarde bestellen?","34":"Kunt gij uw stem tot de wolken opheffen, opdat een overvloed van water u bedekke?","35":"Kunt gij de bliksemen uitlaten, dat zij henenvaren, en tot u zeggen: Zie, *hier* zijn wij?","36":"Wie heeft de wijsheid in het binnenste gezet? Of wie heeft den zin het verstand gegeven?","37":"Wie kan de wolken met wijsheid tellen, en wie kan de flessen des hemels nederleggen?","38":"Als het stof doorgoten is tot vastigheid, en de kluiten samenkleven?"},"KJV":{"1":"Then the LORD answered Job out of the whirlwind, and said,","2":"Who *is* this that darkeneth counsel by words without knowledge?","3":"Gird up now thy loins like a man; for I will demand of thee, and answer","4":"Where wast thou when I laid the foundations of the earth? declare, if thou hast understanding.","5":"Who hath laid the measures thereof, if thou knowest? or who hath stretched the line","6":"Whereupon are the foundations thereof fastened? or who laid the corner stone","7":"When the morning stars sang together, and all the sons of God shouted","8":"Or *who* shut up the sea with doors, when it brake forth, *as if* it had issued out of the womb?","9":"When I made the cloud the garment thereof, and thick darkness a swaddlingband","10":"And brake up for it my decreed *place*, and set bars and doors,","11":"And said, Hitherto shalt thou come, but no further: and here shall thy proud waves be stayed?","12":"Hast thou commanded the morning since thy days; *and* caused the dayspring to know his place;","13":"That it might take hold of the ends of the earth, that the wicked might be shaken out","14":"It is turned as clay *to* the seal; and they stand as a garment.","15":"And from the wicked their light is withholden, and the high arm shall be broken.","16":"Hast thou entered into the springs of the sea? or hast thou walked in the search of the depth?","17":"Have the gates of death been opened unto thee? or hast thou seen the doors of the shadow of death?","18":"Hast thou perceived the breadth of the earth? declare if thou knowest","19":"Where *is* the way *where* light dwelleth? and *as for* darkness, where *is* the place","20":"That thou shouldest take it to the bound thereof, and that thou shouldest know the paths *to* the house","21":"Knowest thou *it*, because thou wast then born? or *because* the number of thy days *is* great?","22":"Hast thou entered into the treasures of the snow? or hast thou seen the treasures of the hail,","23":"Which I have reserved against the time of trouble, against the day of battle and war?","24":"By what way is the light parted, *which* scattereth the east wind upon the earth?","25":"Who hath divided a watercourse for the overflowing of waters, or a way for the lightning of thunder;","26":"To cause it to rain on the earth, *where* no man *is; on* the wilderness, wherein *there is* no man;","27":"To satisfy the desolate and waste *ground*; and to cause the bud of the tender herb to spring forth?","28":"Hath the rain a father? or who hath begotten the drops of dew?","29":"Out of whose womb came the ice? and the hoary frost of heaven, who hath gendered","30":"The waters are hid as *with* a stone, and the face of the deep is frozen.","31":"Canst thou bind the sweet influences of Pleiades, or loose the bands of Orion?","32":"Canst thou bring forth Mazzaroth in his season? or canst thou guide Arcturus with his sons?","33":"Knowest thou the ordinances of heaven? canst thou set the dominion thereof in the earth?","34":"Canst thou lift up thy voice to the clouds, that abundance of waters may cover","35":"Canst thou send lightnings, that they may go, and say","36":"Who hath put wisdom in the inward parts? or who hath given understanding to the heart?","37":"Who can number the clouds in wisdom? or who can stay the bottles of heaven,","38":"When the dust groweth into hardness, and the clods cleave fast together?","39":"Wilt thou hunt the prey for the lion? or fill the appetite of the young lions,"}},"tsk":{"3":[{"kopje":"Gord","refs":["Job 40:2","Ex 12:11","1 Kon 18:46","Jer 1:17","1 Petr 1:13"]},{"kopje":"zo zal","refs":["Job 13:15","Job 13:22","Job 23:3-7","Job 31:35-37"]}],"4":[{"kopje":"Waar","refs":["Spr 8:22","Spr 8:29","Spr 8:30","Spr 30:4"]},{"kopje":"Ik","refs":["Gen 1:1","Ps 102:26","Ps 104:5","Hebr 1:2","Hebr 1:10"]}],"5":[{"kopje":"gezet","refs":["Job 11:9","Job 28:25","Spr 8:27","Jes 40:12","Jes 40:22"]},{"kopje":"getrokken","refs":["Ps 19:5","Ps 78:55","Jes 34:11","Zach 2:1","Zach 2:2","2 Kor 10:16"]}],"6":[{"kopje":"Waarop","refs":["Job 26:7","1 Sam 2:8","Ps 24:2","Ps 93:1","Ps 104:5","Zach 12:1","2 Petr 3:5"]},{"kopje":"grondvesten","refs":["Ex 26:18-25"]},{"kopje":"gelegd","refs":["Ps 118:22","Ps 144:12","Jes 28:16","Ef 2:20","Ef 2:21"]}],"7":[{"kopje":"morgensterren","refs":["Openb 2:28","Openb 22:16"]},{"kopje":"kinderen","refs":["Job 1:6","Job 2:1","Ps 104:4","Openb 5:11"]},{"kopje":"juichten","refs":["Ezra 3:11","Ezra 3:12","Zach 4:7"]}],"8":[{"kopje":"wie","refs":["Job 38:10","Gen 1:9","Ps 33:7","Ps 104:9","Spr 8:29","Jer 5:22"]},{"kopje":"voortkwam","refs":["Job 38:29"]}],"9":[{"kopje":"wolk","refs":["Gen 1:2"]}],"10":[{"kopje":"brak, en grendel en deuren zette","refs":["Job 26:10","Gen 1:9","Gen 1:10","Gen 9:15","Ps 104:9","Jer 5:22"]}],"11":[{"kopje":"Tot hiertoe","refs":["Ps 65:7","Ps 65:8","Ps 93:3","Ps 93:4","Spr 8:29","Mark 4:39-41"]},{"kopje":"en niet","refs":["Job 1:22","Job 2:6","Ps 76:11","Ps 89:10","Jes 27:8","Luk 8:32","Luk 8:33","Openb 20:2","Openb 20:3","Openb 20:7","Openb 20:8"]}],"12":[{"kopje":"geboden","refs":["Gen 1:5","Ps 74:16","Ps 136:7","Ps 136:8","Ps 148:3-5"]},{"kopje":"dagen","refs":[" tegenwoordigheid te kennen gaf, hem aandachtig maakte en vernederende voor zijn majesteit. Zie gelijke voorbeelden Exo 19:16 , Exo 19:18 , Exo 19:22 , enz.; Deu 4:11 ; 1Ki 19:11-12 ; Eze 1:4 ; Nah 1:3 ."}],"2":[{"catchword":"den raad","tekst":"Versta, Gods besluiten en oordelen. Alzo Psa 33:11 ; Pro 19:21 ; Isa 28:29 ; Act 2:23 ."},{"catchword":"verduistert","tekst":"Te weten, mits denzelven van enige gebreken ten onrechte en dwaselijk te beschuldigen."}],"3":[{"catchword":"Gord nu,","tekst":"Dat is, maak u vaardig om met mij in samenspreking te treden, gelijk gij begeerd hebt. Het is een manier van spreken, genomen van degenen, die, lange klederen dragende, dezelve opschorten als zij zich vaardig maken tot enig werk. Vergelijk de aantekening 1Ki 18:46 ."},{"catchword":"onderricht Mij","tekst":"God spreekt Job spottenderwijze toe, om hem te vernederen door de overlegging der menselijke nietigheid, vergeleken met de goddelijke majesteit, waarmede hij geschenen had in twisting te willen treden. Zie 1Ki 22:15 ."}],"4":[{"catchword":"grondde?","tekst":"Dat is, maakte en haar grond legde. Zie boven, Job 26:7 , en de aantekening. Hij wil zeggen, nergens. Dit en het volgende zijn manieren van spreken, genomen bij gelijkenis van het bouwen van enige timmering."},{"catchword":"indien gij","tekst":"Hebreeuws, indien gij verstand weet, dat is, kloek en verstand, zeer ervaren en verstandig zijt. Vergelijk 1Ch 12:32 ; 2Ch 2:12 ; Isa 29:24 ."}],"5":[{"catchword":"haar","tekst":"Te weten, de maten der aarde."},{"catchword":"maten","tekst":"Dat is, omloop, of breedte en diepte."},{"catchword":"want gij","tekst":"God spreekt hem weder spottenderwijze toe, gelijk boven, vs.3. Anders, indien gij het weet."},{"catchword":"richtsnoer","tekst":"Te weten, opdat zij haar rechte verhouding, gestalte en schoonheid zou hebben. Vergelijk Psa 19:5 ."}],"6":[{"catchword":"hoeksteen","tekst":"Hebreeuws, de steen haars hoeks; dat is, die het werk samenhecht en vastmaakt. Vergelijk Psa 118:22 ; Mat 21:42 ."},{"catchword":"gelegd?","tekst":"Hebreeuws, geworpen."}],"7":[{"catchword":"morgensterren","tekst":"Sommigen verstaan door deze de allerklaarste sterren; vergelijk Psa 148:3 . Anderen nemen uit het volgende af, dat hiermede moeten verstaan worden de heilige engelen. Van de sterren eigenlijk genomen, zie onder vs.31,32."},{"catchword":"de kinderen","tekst":"Dat is, de heilige engelen; zie boven, Job 1:6 , en Job 2:1 ."}],"8":[{"catchword":"wie","tekst":"Dit woord is hier ingevoegd uit vs.5."},{"catchword":"toegesloten,","tekst":"Hebreeuws, bedekt; dat is, ingehouden, of afgetuind; opdat zij niet buiten haar gestelde palen zou uitvloeien."},{"catchword":"baarmoeder","tekst":"Dat is, uit de ordinantie en het bevel Gods in een ogenblik, gelijk een kind ter wereld uit zijns moeders lichaam voortkomt. Anderen verstaan door der moeders lijf den afgrond, waarmede de aarde in het eerst bedekt was; Gen 1:2 ."}],"9":[{"catchword":"Toen Ik","tekst":"God, om zijn grote macht te tonen, vergelijkt de zee bij een jong kind, hetwelk moet gekleed en nog ingewonden worden. De klederen nu der zee zijn de wolken, die haar bedekken, de windeldoek zijn alle donkerheden, dampen, nevelen en schaduwen."}],"10":[{"catchword":"voor haar","tekst":"Dat is, voor de zeer; te weten, om die in het land te laten invloeien."},{"catchword":"de aarde","tekst":"Dat is, holligheden daarin maakte, door welke een deel van haar water daarin vloeien zou; waaruit dan vele rivieren en binnenwateren ontstaan zijn. Anders, toen Ik over haar mijn ordinantie besloot; te weten, welke in het volgende verhaald wordt. Of, aldus: Zou Ik dan mijn besluit over haar breken? Ik heb grendel en deuren gezet, en gezegd, enz."},{"catchword":"grendel","tekst":"Versta, de duinen en oevers der zee, die het water inhouden, dat het niet verder over den aardbodem uitvallen kan; Jer 5:22 ."}],"11":[{"catchword":"zeide","tekst":"Van Gods zeggen, zie Gen 1:3 ."},{"catchword":"hij zich","tekst":"Te weten, de grendel, waarvan in vs.10, dat is, zand, klippen, oever der zee."},{"catchword":"golven","tekst":"Het Hebreeuwse woord is ook alzo genomen Psa 89:10 ; Isa 48:18 ; Zec 10:11 ."}],"12":[{"catchword":"van uw dagen","tekst":"Dat is, van het beginsel uws levens af. Vergelijk boven, Job 27:6 ."},{"catchword":"geboden?","tekst":"Te weten, dat hij voortkomen zou door het oprijzen der zon, naar de orde, die men nu in de natuur kan aanschouwen."},{"catchword":"zijn plaats","tekst":"Dat is, het oord des hemels, waar hij op elken dag des jaars voortkomt, nadat de zon op en ondergaat."}],"13":[{"catchword":"hij de","tekst":"Te weten, de dageraad."},{"catchword":"einden","tekst":"Hebreeuws, vleugelen. Alzo boven, Job 37:3 . Zie de aantekening. Versta, de uiterste delen en hoeken der aarde, tot welke het schijnsel der zon zich uitbreidt."},{"catchword":"uitgeschud","tekst":"Dat is, uitgeroeid, als stof dat men uitschudt, Neh 5:13 , of, als iets anders, dat uit zijn plaats uitgeschud wordt; Exo 14:27 . Of, uitgeschud worden; te weten, omdat zij het licht des daags schuwen, bedrijvende hun boosheden meest in den nacht, en die daarmede bedekkende, boven, Job 24:13-14 ; Joh 3:20 ; idem, omdat zij bij klaren dag van de overheid plegen met den dood gestraft en zo uit de wereld weggeruimd te worden."}],"14":[{"catchword":"zegelleem,","tekst":"Hebreeuws, het leem des zegels; dat is, waar het zegel ingedrukt wordt. De zin is, gelijk het leem van zichzelven geen bijzonderen vorm of gedaante heeft, maar wel als een zegel daarin gedrukt is; alzo is de aarde des nachts zonder gedaante en vorm door de duisternis, maar des daags door het licht der zon verandert zij, tonende verscheidene gestaltenissen van de dingen, die daarop zijn."},{"catchword":"zij gesteld","tekst":"Te weten, de schepselen, die op de aarde zijn en dezelve als een kleed bedekken en versieren. Anders, en zij gesteld worden als met een kleed [bedekt]; verstaande dit van de goddelozen, van welken in vs.13 gesproken is, die voor het gericht gesteld worden, waar hun hun proces gemaakt wordt. De misdadigers plachten hier vroeger met een kleed overdekt te worden; Est 7:8 . Anders, gesteld worden; dat is, verhinderd in hun boosheid voort te varen, alsof hun handen en voeten in een kleed gewonden waren."}],"15":[{"catchword":"licht","tekst":"Dat is, welvaren, rijkdom, eer; zie boven, Job 18:5 ."},{"catchword":"hoge arm","tekst":"Dat is, hun geweld, hoogmoed en tirannie, waardoor zij in staat verheven zijn en groten overlast bedrijven. Alzo een man des arms, voor degenen, die geweld pleegt, boven, Job 22:8 ; zie aldaar de aantekening."},{"catchword":"gebroken?","tekst":"Dat is, vermorzeld, vernietigd. Alzo Psa 10:15 ; Eze 30:22 ."}],"16":[{"catchword":"oorsprongen","tekst":"Hebreeuws, tranen, of traningen. Versta, de allerdiepste gronden, springaders en opwellingen, uit welke de meeste en sterkste vloeden voortbreken."},{"catchword":"in het onderste","tekst":"Hebreeuws, in de onderzoeking, dat is, in de plaats der zee, die de allerdiepste is, en wel met het dieplood doorzocht, maar niet gevonden kan worden."},{"catchword":"des afgronds","tekst":"Vergelijk Gen 1:2 , en boven, Job 28:14 ."}],"17":[{"catchword":"poorten des doods","tekst":"Versta, de onderste plaatsen der aarde, en de gangen daarheen leidende, welke alzo genaamd worden, omdat de doden onder de aarde schuilen. Hetzelfde is te verstaan door de poorten van de schaduw des doods. Vergelijk boven, Job 3:5 , en Job 10:21 ."}],"18":[{"catchword":"tot","tekst":"Te weten, om te begrijpen en te bemerken wat in de wijde wereld omgaat aan alle oorden en plaatsen; of ook, waarom de wereld niet breder of enger is."},{"catchword":"Geef","tekst":"Vergelijk boven, vs.4."},{"catchword":"alles weet","tekst":"Te weten, dat Ik tot nu toe u gevraagd en voorgesteld heb."}],"19":[{"catchword":"daar","tekst":"Dat is, om te komen tot de plaats, waar het licht woont; te weten, om dat licht en de duisternis orde en bepaling te stellen, en hetzelve daarin te onderhouden en te regeren. Want versta dit, en het volgende, niet alleen van de kennis, die de mens van deze dingen heeft, maar van de ordinantie en het beleid en de regering, die God alleen daarover heeft."},{"catchword":"het licht","tekst":"Versta, de zon. Alzo boven, Job 25:3 . Zie de aantekening."},{"catchword":"duisternis,","tekst":"Te weten, die veroorzaakt wordt door het afwezen en den ondergang der zon."}],"20":[{"catchword":"dat","tekst":"Te weten, licht, of ook de duisternis, van welke in vs.19 gesproken is."},{"catchword":"brengen","tekst":"Hebreeuws, nemen zoudt; dat is, nemen en brengen, of nemende brengen. Zie Gen 12:15 ."},{"catchword":"pale,","tekst":"Waarmede de loop der zon bepaald is, te weten, in een natuurlijken dag, bestaande uit vier en twintig uren, of in een jaar door beide de solstitia, wanneer in den winter de korste en in den zomer de langste dag is."},{"catchword":"merken zoudt","tekst":"Versta een bemerking, die met de bestiering en regering des lichts verenigd is."},{"catchword":"paden","tekst":"Versta den weg, dien de zon doorloopt om een natuurlijken dag en het jaar te maken."},{"catchword":"zijns huizes?","tekst":"Versta, de plaats waar zij op en ondergaat, alsmede waar zij het jaar begint en eindigt."}],"21":[{"catchword":"Gij weet het,","tekst":"Dit is van God spottenderwijze tot Job gesproken . Alzo boven, vs.3, 5; zie de aantekening. Anders, wist gij dat gij toen geboren zoudt worden? en uw dagen vele zouden zijn in getal?"}],"22":[{"catchword":"schatkameren der sneeuw,","tekst":"God spreekt bij gelijkenis, om zijn grote macht te tonen, waardoor Hij, als het Hem belieft, groten overvloed van sneeuw en hagel kan voortbrengen, alsof Hij grote schatkamers gereed had, waarin Hij de sneeuw en den hagel, tegen dat Hij die gebruiken wilde, weggesloten had."}],"23":[{"catchword":"den tijd","tekst":"Te weten, om daarmede mijn rechtvaardige oordelen uit te voeren. Zie exempelen hiervan Exo 9:18 ; Jos 10:11 ; 1Sa 7:10 ."}],"24":[{"catchword":"weg,","tekst":"Versta door den weg alle redenen, middelen, toevallen, wijzen, werkingen en eindelijke oorzaken van hetgeen in de lucht geschiedt, en dat niet alleen in het algemeen, maar voornamelijk in het bijzonder."},{"catchword":"licht","tekst":"Dat is, dat bliksem, weerlicht, verschieting van aangestoken dampen, enz. in de lucht beginnen, ophouden, verschillen in plaatsen, stonden, hoedanigheden, uitkomsten, enz."},{"catchword":"oostenwind","tekst":"Versta onder een soort van wind al de andere; want hoe zij zo verscheidenlijk nu en dan komen te waaien, is niemand ten volle bekend dan God. Van den oostenwind in het bijzonder, zie Gen 41:6 , en Exo 10:13 . Vergelijk Joh 3:8 ."}],"25":[{"catchword":"stortregen","tekst":"Of, den plasregen. Hebreeuws, overvloeiing."},{"catchword":"waterloop","tekst":"Te weten, waardoor de wateren, uit de lucht vallende, hun loop hebben op de aarde, om het een of het ander land te bevochtigen."},{"catchword":"een weg","tekst":"Vergelijk boven, Job 28:26 ."},{"catchword":"voor het weerlicht","tekst":"Anders, voor de ruisende vlaag. Hebreeuws, weerlicht, of vlaag der stemmen."}],"26":[{"catchword":"niemand is,","tekst":"Te weten, om het land door arbeid van werklieden te bevochtigen."}],"27":[{"catchword":"het woeste","tekst":"Dat is, dat zeer woest is, zijnde dor en onvruchtbaar in zichzelven, en daartoe door oorlog en roverij onbewoond en verlaten van de mensen. Vergelijk boven, Job 30:3 , en de aantekening."}],"28":[{"catchword":"Heeft de regen","tekst":"Hij wil zeggen: Neen hij; maar ik alleen breng hem voort. Alzo in het volgende."}],"29":[{"catchword":"rijm des hemels?","tekst":"Het Hebreeuwse woord is ook in deze betekenis genomen Exo 16:14 ; Psa 147:16 ."}],"30":[{"catchword":"verbergen","tekst":"Te weten, door de vorst, welke maakt dat er geen water meer schijnt te wezen, maar enkel steen, waaronder het onbevroren water schuilende is."},{"catchword":"vlakke","tekst":"Dat is, het opperste, of bovenste der zee, of der diepe wateren."},{"catchword":"wordt","tekst":"Dat is, door de vorst omgrepen en vastgehouden alsof het gevangen ware, overmits het door de koude gestremd zijnde, niet wegvloeien kan."}],"31":[{"catchword":"binden,","tekst":"Binden is hier verhinderen, of vasthouden, dat het Zevengesternte niet rijze en medebrenge de zoetigheid der lente. Zie van dit gesternte boven, Job 9:9 ."},{"catchword":"strengen des Orions","tekst":"Versta, door deze strengen de trekkende krachten, waardoor Orion in November medebrengt wolken, regen, onweder, koude. Deze op te lossen is hun werking te verhinderen en te doen ophouden."}],"32":[{"catchword":"Mazzaròth","tekst":"Wat dit voor een gesternte of teken is, daarvan is zeer verscheiden gevoelen. Eenigen verstaan de gesternte, die omtrent den zuidpool zijn, boven, Job 9:9 , Binnenkamers genaamd; maar hier Mazzaroth van Nazar, scheiden, omdat zij zeer ver zijn van Europa en de plaats waar Job woonde . Sommigen daarentegen nemen deze Mazzaroth voor noordelijke sterren, bewogen zijnde door de gelijkenis van het woord Mezarim, boven, Job 37:9 , hetwelk betekent verstrooiende, te weten winden, die uit het noorden komen. Anderen menen dat zij zijn de Mazzaloth, dat is, de planeten, of de twaalf tekenen Zodiaci, waarvan te zien is 2Ki 23:5 ; ook zijn er die ze houden voor het hemelse teken, genaamd de Kronen."},{"catchword":"den Wagen","tekst":"Zie van dit gesternte boven, Job 9:9 ."},{"catchword":"zijn kinderen","tekst":"Versta, enige mindere sterren, die rondom den Wagen staan, als de kinderen rondom hun moeder."}],"33":[{"catchword":"de verordeningen","tekst":"Dat is, de orde, die God in de hemelse lichten en tekenen en omlopen houdt, om daardoor uit te voeren hetgeen Hem behaagt."},{"catchword":"of kunt gij","tekst":"Dat is, kunt gij den loop en de werkingen des hemels daar op de aarde regeren?"},{"catchword":"heerschappij","tekst":"Of, regering."}],"34":[{"catchword":"opheffen,","tekst":"Te weten, om haar te bevelen hoeveel water zij uitgieten zullen, en wanneer en waar."}],"35":[{"catchword":"Zie,","tekst":"Te weten, bereid, om uw bevelen uit te voeren. Zie Gen 22:1 ."}],"36":[{"catchword":"binnenste","tekst":"Het Hebreeuwse woord is genomen voor de nieren. Door de nieren nu wordt verstaan het inwendigste en innerste van den geest des mensen. Vergelijk boven, Job 19:27 . Het Hebreeuwse woord is ook Psa 51:8 ; zie aldaar de aantekening."},{"catchword":"zin","tekst":"Anders, het hart."}],"37":[{"catchword":"de wolken","tekst":"Dat is, haar bewegingen, krachten, werken en ganse natuur ten volle verklaren. Voor tellen is het Hebreeuwse woord genomen Psa 22:18 . Anders, wie kan den hemel als een saffier maken; dat is, geheel klaar en helder."},{"catchword":"flessen","tekst":"Versta, de wolken, omdat in dezelve, als in flessen, het water bewaard wordt, hetwelk zij door een regen uitgieten, als het den Heere belieft."},{"catchword":"nederleggen?","tekst":"Dat is, doen ophouden, dat zij geen water meer uitgieten; dat is, wie kan den regen doen ophouden dan God alleen? Het is een gelijkenis, genomen van de vaten, waaruit men enige vochtigheid giet, die men opheft als men daaruit gieten wil, maar nederzet als men ophoudt te gieten. Anders, doen slapen."}],"38":[{"catchword":"doorgoten is","tekst":"Dat is, de aarde, die door langdurige droogte in stof veranderd is."},{"catchword":"tot vastigheid,","tekst":"Dat is, door overvloedigen regen zo bevochtigd is geweest, dat het stof weder samenloopt en in kluiten verandert, die aan elkander hangen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then the LORD answered Job, out of a tempest. [whereby God convinced him of his presence and made him attentive and humble before his Majesty. See the like examples, Exo 19:16,18,22. Etc. Deut.4.11.1. Kin.19.11,12. Eze 1:4. Nah.1.3.] and said."}],"2":[{"catchword":null,"tekst":"Who is he, that obscurreth the counsel, [i.e. the decrees and judgments of God. So Psa 33:11. Pro 19:21. Isa 28:29. Act 2:23.] by words without knowledge? [viz. By arguing and charging the same with any defect, most wrongfully and foolishly.]"}],"3":[{"catchword":null,"tekst":"Gird now thy loves as a man; [i.e. make thy self ready, to enter into debate with me, according as thou hast desired. A manner of speaking, taken from those, that used to wear long garments, which they must gird and truss up, when they would make themselves ready to go about any work. Compare 1 Kings 18.on v.46.] then shall I ask thee and instruct thou me [God speaketh to Job here ironically, to humble him through the consideration of human frailty and nothingness, compared with the divine Majesty, wherewith it seemed he would have entered the lifts of contesting. See 1 Kings 22.on v.15.]"}],"4":[{"catchword":null,"tekst":"Whence wast thou. When I founded the Earth, [i.e. when I made the same, and laid the foundation of it. See above 26.7. and the annot. Implying; no where; this and what followeth are borrowed speeches taken from the manner and resemblance of setting up some great buildings.] make it known, if thou be prudent of understanding. [Heb. If thou knowest understanding, i.e. if thou art of good understanding, such an experienced and understanding man. Compare 1 Chron.12.32. 2 Chron.2.12. Isa 29:24.]"}],"5":[{"catchword":null,"tekst":"Who hath set her [viz. The Earths] measures, [i.e. their circuit, compass, or breadth and depth.] for thou knowest it: [God speaketh again in a ironical way to him, as above v.3. Oth. If thou know it.] or who hath drawn a ruling-line over her? [viz. That she might have her due proportion, shape and beauty. Comp.Psa.19.on v.5.]"}],"6":[{"catchword":null,"tekst":"Whereupon are her foundations suck, or who hath laid [Heb. Cast] her corner-stone? [Heb. The stone of their corner, i.e. that which knitteth and fasteneth she fabric together. Compare Psa 118:22. Mat 21:42.]"}],"7":[{"catchword":null,"tekst":"When the morning-stars sang joyfully together, [some understand by these the most bright and shining stars. Compare Psa 148:3. Others gather from the sequel, that it must be understood of the blessed Angels, of the children of God shouted, [understand the holy Angels. See above chap.1.6. and chap.2.1.]"}],"8":[{"catchword":null,"tekst":"Or (who) [this word is inserted here out of v.5. to which the construction relateth.] hath shut up the Sea with doors, [Heb. Covered the Sea, i.e. kept in, or impaled it, that it should not overflow its set bounds.] when it brake out, and came forth out of the womb, [i.e. put of, or upon the Ordinance and the Commandment of God in a moment, as the child is delivered into the world out of the mothers womb. Others understand by the mothers womb or body here, the abyss or deeps wherewith the face of the Earth was covered at the beginning, Gen 1:2.]"}],"9":[{"catchword":null,"tekst":"When I appointed the cloud for its garment, and the obscurity for its swathing-clothing. [God to shew his mighty power, compareth the vast sea to a young child, which must be clouds which cover it, the swathing-clothing are the obscurities, vapours, mists and shadows, which they seem involved with.]"}],"10":[{"catchword":null,"tekst":"When for it, [viz. For the Sea, to make it run into the deeps of the Earth] (with) my decree I brake the earth thorough, [i.e. made hollowness, concavities within it, whereby part of those Sea-waters did enter the Earth, from whence so many Rivers inland-waters have their sources. Oth. When I decreed my Ordinance over it, viz. Which is related in the sequel. Or thus, over it, viz. Which is related in the sequel. Or thus, should I break my decree then over it? I have set bolts and doors; and said, &c.] and did set a bolt and doors; [understand the downs and shores of the Sea, which keep the waters in, that they cannot transgress the bounds to overflow the Earth any more, Jer 5:22.]"}],"11":[{"catchword":null,"tekst":"And said [Of Gods saying. See Gen.1.on v.10.] Hitherto thou shalt come, and no farther: and here shall he, [viz. The bolt, spoken of n number.]"}],"22":[{"catchword":null,"tekst":"Art thou come to the Treasures of the snow? And hast thou seen the Treasuries of the hail? [God speaketh thus by comparison, to shew his great power, whereby he is able, whensoever it pleaseth him, to bring forth a great abundance of snow and hail, as if he had great Treasures of them laid up in store and locked up against such times, as he thinketh good to use and spend them.]"}],"23":[{"catchword":null,"tekst":"Which I withhold until a time distress: for the day of the battle and of War. [viz. For to execute then my just judgements by them. See examples hereof, Exo 9:18. Jos 10:11. 1 Samuel 7.10.]"}],"24":[{"catchword":null,"tekst":"Which is the way, [Understand by the way, all the reasons, means, accidents, courses, conditions, operations and final causes, of what doth happen in the air, and that not only in a general regard, but especially also and in particle] (where) the light is divided, [i.e. that lightening, fire, flashes, shooting meteors, or kindled vapours, etc. In the air do begin and cease, and vary in such places, hours, qualities, events, etc.] (and) the Eastwind scattereth it self upon the Earth? [under one sort of wind all the rest are understood: for how it, one sort of wind all the rest are understood: for how it, cometh to pass, that all of them do blow so differently, now this, now that, is fully known to none but God. Of the East-wind in particular. See Gen.41.on v.6. and Exod.10.on v.13. Compare Job 3.v.8.]"}],"25":[{"catchword":null,"tekst":"Who dealeth out a water-course [viz. Whereby the waters, falling down out of the air have their course upon the Earth, to moisten such or such a land or country.] for the powering rain; [or shower of rain. Heb. Overflowing.] and a way [Compare above 28.26.] for the lightening of the thunders. [Oth. For the rushing-flash. Heb. Lightening, or flash of voices.]"}],"26":[{"catchword":null,"tekst":"For to rain upon the Land, (where) no body is, [viz. To moisten the land, by any handy-labour of workmen.] (upon) the desert, wherein there is no man."}],"27":[{"catchword":null,"tekst":"For to satisfy the wast and the desolate, [Understand the Land that lieth exceeding wast, being dry and barren of it self, and besides made desolate and uninhabited, by wars and robberies. Compare above 30.3. and the annot.] and to make the sproutings of the grass-buds to grow."}],"28":[{"catchword":null,"tekst":"Hath the rain a Father? [implying; not he; but only I do bring him forth; and so in the sequel.] or who begetteth the drops of the dew."}],"29":[{"catchword":null,"tekst":"Out of whose belly cometh forth the ice? And who begetteth the hoary frost of heaven? [the Hebrew word given, heary frost, here, is likewise taken in this signification, Exo 16:14. Psal.147.16.]"}],"30":[{"catchword":null,"tekst":"As with a stone do the waters hide themselves, [viz. By means of the frost, which maketh that there seemeth to be no water, but meer stone, under which the unfrozen water lieth hid as it were] and the flat, [or, plain] of the abyss, [i.e. the superficies, or surface of the Sea, or other deep waters] is encompassed, [i.e. environed and held fast by the frost, as it were imprisoned, or in arrest; being so hemmed by the cold, that it cannot flow away.]"}],"31":[{"catchword":null,"tekst":"Canst thou bind the pleasantness of the seven stars, or this starry sign and constellation, shall not rise, and bring the pleasantness of the spring along with it. See of this starry sign above 9.9.] or loosen the strings of iron? [understand by these strings, the attractive powers, whereby orion in November bringeth on clouds, rains, cold and stormy weather: to loose them, is to hinder and withhold their operations and influences.]"}],"32":[{"catchword":null,"tekst":"Canst thou bring forth the Mazzaroth in their time, [what stars or constellation this may be, opinions vary much. Some understand thereby the stars about the south-pole, above chap.9.9. called inner Chambers, but here Mazzaroth, from Nazar, to sever or separate, as being very remote from Europe, and the place also where Job dwelled. Some on the contrary take them to be Northern stars, drawn into that opinion by the likeness of the Mezarim above chap.37.9. which signifieth, scattering, dissipating winds namely, which come out of the North. Others take them to be the Mazzaleth, i.e. the Planets, or the twelve Zodiak-signs, whereof see 2 Kings 23.5. There are some also which hold them to be the celestial sign, called the Cowns] and lead the way. [See of this sign above 9.on v.9.] with his children? [understand some lesser stars, placed round about the way, as the children about the Mother.]"}],"33":[{"catchword":null,"tekst":"Doest thou know the Ordinances of heaven; [i.e. the order which God keepeth with these heavenly lights and signs, and their courses, for to execute his pleasure by them.] or canst thou appoint the dominion [Heb. Government] of it upon Earth:"}],"34":[{"catchword":null,"tekst":"Canst thou raise up thy voice to the clouds, [viz. For to command them, how much water they shall power down, and when and where] that an abundance of water may cover thee?"}],"35":[{"catchword":null,"tekst":"Canst thou let forth the lightenings, that they pass away, and say unto thee, behold here are we, [i.e. ready to execute thy commands. See Gen.32.on v.1.]"}],"36":[{"catchword":null,"tekst":"Who hath set the wisdom in the inmost (parts)? [The Hebrew word is taken for the Reins, and by the Reines is understood the inmost, or most inward of mans spirit. Compare above chap.19.on v.27.] You have the Hebrew word likewise, Psa 51:8. and the annot. There.] or who hath given the understanding to the mind? [Oth. To the heart.]"}],"37":[{"catchword":null,"tekst":"Who can number the clouds with wisdom? [i.e. fully declare their motions, power, operations, and whole nature or constitution. The Hebrew verb, is used for numbering, Psa 22:18. Otherwise, who can make the heaven const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
