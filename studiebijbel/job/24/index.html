zij te pand.","4":"Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land.","5":"Zie, zij zijn woudezels in de woestijn; zij gaan uit tot hun werk, maken zich vroeg op om te roven; het vlakke veld is voedsel voor hem en voor de jongeren.","6":"Op het veld maaien zij zijn voer, en de wijngaard van de goddeloze lezen zij af.","7":"De naakten laten zij overnachten zonder kleding, die geen bedekking hebben tegen de koude.","8":"Van de stromen op de bergen worden zij nat, en zonder toevlucht omhelzen zij de rotsen.","9":"Zij rukken het weesje van de borst, en wat de arme toebehoort, nemen zij te pand.","10":"De naakte doen zij weggaan zonder kleed, en hongerig dragen zij *diens* garven.","11":"Tussen hun muren persen zij olie uit, treden de wijnpersen, en lijden dorst.","12":"Uit de stad zuchten de mensen, en de ziel van de verwonden schreeuwt uit; toch rekent God het niet aan als ongerijmd.","13":"Zij horen bij hen die zich verzetten tegen het licht; zij kennen Zijn wegen niet, en zij blijven niet op Zijn paden.","14":"Met het licht staat de moordenaar op, doodt de arme en de behoeftige; en 's nachts is hij als een dief.","15":"Ook houdt het oog van de overspeler de schemering in de gaten, en zegt: Geen oog zal mij zien; en hij bedekt zijn gezicht.","16":"In de duisternis breekt hij in de huizen in, die zij zich overdag hadden uitgekeken; zij kennen het licht niet.","17":"Want de morgenstond is voor hen allemaal de schaduw van de dood; want kent men hen, dan verkeren zij in de verschrikkingen van de schaduw van de dood.","18":"Hij is licht op het wateroppervlak; vervloekt is hun deel op de aarde; hij wendt zich niet naar de weg van de wijngaarden.","19":"De droogte alsook de hitte nemen de sneeuwwateren weg; zo *neemt* het graf hen weg die gezondigd hebben.","20":"De baarmoeder vergeet hem, het gewormte vindt hem zoet, aan hem wordt niet meer gedacht; en het onrecht wordt gebroken als een stuk hout.","21":"De onvruchtbare, die niet baart, doet hij kwaad, en aan de weduwe doet hij niets goeds.","22":"Ook trekt hij de machtigen mee door zijn kracht; staat hij op, dan is niemand zeker van zijn leven.","23":"Geeft *God* hem gerustheid, dan steunt hij daarop; toch zijn Zijn ogen op hun wegen.","24":"Zij zijn een korte tijd verheven, daarna is er niemand meer van hen; zij worden neergedrukt; net als alle anderen worden zij weggenomen; en net als de top van een aar worden zij afgesneden.","25":"Als het nu niet zo is, wie zal mij dan leugenachtig maken, en mijn woorden tot niets maken?"},"SV":{"1":"Waarom zouden van den Almachtige de tijden niet verborgen zijn, dewijl zij, die Hem kennen, Zijn dagen niet zien?","2":"Zij tasten de landpalen aan; de kudden roven zij, en weiden ze.","3":"Den ezel der wezen drijven zij weg; den os ener weduwe nemen zij te pand.","4":"Zij doen de nooddruftigen wijken van den weg; te zamen versteken zich de ellendigen des lands.","5":"Ziet, zij zijn woudezels in de woestijn; zij gaan uit tot hun werk, makende zich vroeg op ten roof; het vlakke veld is hem tot spijs, *en* den jongeren.","6":"Op het veld maaien zij zijn voeder, en den wijnberg des goddelozen lezen zij af.","7":"Den naakten laten zij vernachten zonder kleding, die geen deksel *heeft* tegen de koude.","8":"Van den stroom der bergen worden zij nat, en zonder toevlucht zijnde, omhelzen zij de steenrotsen.","9":"Zij rukken het weesje van de borst, en *dat* over den arme is, nemen zij te pand.","10":"Den naakte doen zij weggaan zonder kleed, en hongerig, *die* garven dragen.","11":"Tussen hun muren persen zij olie uit, treden de wijnpersen, en zijn dorstig.","12":"Uit de stad zuchten de lieden, en de ziel der verwonden schreeuwt uit; nochtans beschikt God niets ongerijmds.","13":"Zij zijn onder de wederstrevers des lichts; zij kennen Zijn wegen niet, en zij blijven niet op Zijn paden.","14":"Met het licht staat de moorder op, doodt den arme en den nooddruftige; en des nachts is hij als een dief.","15":"Ook neemt het oog des overspelers de schemering waar, zeggende: Geen oog zal mij zien; en hij legt een deksel op het aangezicht.","16":"In de duisternis doorgraaft hij de huizen, *die* zij zich des daags afgetekend hadden; zij kennen het licht niet.","17":"Want de morgenstond is hun te zamen de schaduw des doods; als men hen kent, zijn zij *in* de strikken van des doods schaduw.","18":"Hij is licht op het vlakke der wateren; vervloekt is hun deel op de aarde; hij wendt zich niet tot den weg der wijngaarden.","19":"De droogte mitsgaders de hitte nemen de sneeuwwateren weg; *alzo* het graf *dergenen*, *die* gezondigd hebben.","20":"De baarmoeder vergeet hem, het gewormte is hem zoet, zijns wordt niet meer gedacht; en het onrecht wordt gebroken als een hout.","21":"De onvruchtbare, *die* niet baart, teert hij af, en aan de weduwe doet hij niets goeds.","22":"Ook trekt hij de machtigen door zijn kracht; staat hij op, zo is men des levens niet zeker.","23":"Stelt hem *God* in gerustigheid, zo steunt hij daarop; nochtans zijn Zijn ogen op hun wegen.","24":"Zij zijn een weinig *tijds* verheven, daarna is er niemand van hen; zij worden nedergedrukt; gelijk alle *anderen* worden zij besloten; en gelijk de top ener aar worden zij afgesneden.","25":"Indien het nu zo niet is, wie zal mij leugenachtig maken, en mijn rede tot niet brengen?"},"KJV":{"1":"Why, seeing times are not hidden from the Almighty, do they that know him not see his days?","2":"*Some* remove the landmarks; they violently take away flocks, and feed","3":"They drive away the ass of the fatherless, they take the widow's ox for a pledge.","4":"They turn the needy out of the way: the poor of the earth hide themselves together.","5":"Behold, *as* wild asses in the desert, go they forth to their work; rising betimes for a prey: the wilderness *yieldeth* food for them *and* for *their* children.","6":"They reap *every one* his corn in the field: and they gather the vintage of the wicked.","7":"They cause the naked to lodge without clothing, that *they have* no covering in the cold.","8":"They are wet with the showers of the mountains, and embrace the rock for want of a shelter.","9":"They pluck the fatherless from the breast, and take a pledge of the poor.","10":"They cause *him* to go naked without clothing, and they take away the sheaf *from* the hungry;","11":"*Which* make oil within their walls, *and* tread *their* winepresses, and suffer thirst.","12":"Men groan from out of the city, and the soul of the wounded crieth out: yet God layeth not folly","13":"They are of those that rebel against the light; they know not the ways thereof, nor abide in the paths","14":"The murderer rising with the light killeth the poor and needy, and in the night is as a thief.","15":"The eye also of the adulterer waiteth for the twilight, saying, No eye shall see me: and disguiseth *his* face.","16":"In the dark they dig through houses, *which* they had marked for themselves in the daytime: they know not the light.","17":"For the morning *is* to them even as the shadow of death: if *one* know *them, they are in* the terrors of the shadow of death.","18":"He *is* swift as the waters; their portion is cursed in the earth: he beholdeth not the way of the vineyards.","19":"Drought and heat consume the snow waters: *so doth* the grave *those which* have sinned.","20":"The womb shall forget him; the worm shall feed sweetly on him; he shall be no more remembered; and wickedness shall be broken as a tree.","21":"He evil entreateth the barren *that* beareth not: and doeth not good to the widow.","22":"He draweth also the mighty with his power: he riseth up, and no *man* is sure of life.","23":"*Though* it be given him *to be* in safety, whereon he resteth; yet his eyes *are* upon their ways.","24":"They are exalted for a little while, but are gone and brought low; they are taken out of the way as all *other*, and cut off as the tops of the ears of corn.","25":"And if *it be* not *so* now, who will make me a liar, a g af; te weten van anderen."}],"7":[{"catchword":"naakten","tekst":"Te weten, dagloner, of dagwerker, dien zij loon schuldig zijn."}],"8":[{"catchword":"der bergen","tekst":"Dat is, die van de bergen afloopt."},{"catchword":"worden zij","tekst":"Te weten, de voorgemelde dagloners en arbeidslieden."},{"catchword":"zonder toevlucht","tekst":"Dat is, zonder vertrekplaats, waar zij in den tijd des regens en onweders zich zouden mogen bergen."},{"catchword":"omhelzen","tekst":"Dat is, om vrij te zijn van het ongemak der lucht, van koude, wind en vochtigheid, kruipen zij in de spelonken, die hier en daar in de steenrotsen zijn."}],"9":[{"catchword":"Zij rukken","tekst":"Te weten, de goddelozen."},{"catchword":"van de borst,","tekst":"Te weten, om de moeder tot hun slaafs werk voort te jagen; of om het weesken tot een slaaf te maken, en daarna zelf te gebruiken of daarvoor te verkopen."},{"catchword":"dat","tekst":"Dat is, zijn kleding of zijn deksel."}],"10":[{"catchword":"naakte","tekst":"Te weten, arbeider, of dagwerker, gelijk het blijkt uit het volgende. Vergelijk boven, vs.7."},{"catchword":"en hongerig,","tekst":"Anders, en zij zijn hongerig [die] garven of schoven dragen; te weten, de schoven der goddeloze tirannen."}],"11":[{"catchword":"hunne","tekst":"Te weten, der bozen."},{"catchword":"muren persen","tekst":"Dat is, woonplaatsen."},{"catchword":"zij olie uit,","tekst":"Te weten, de arme en nooddruftige werklieden, van wie zie boven, vs.5, 7, 10."}],"12":[{"catchword":"zuchten","tekst":"Het Hebreeuwse woord betekent eigenlijk het zuchten en kermen dergenen, die verdrukt zijn; zie Exo 2:24 , en Exo 6:4 ; Eze 30:24 ."},{"catchword":"ongerijmds","tekst":"Zie boven, Job 1:22 . De zin is: Hoewel God deze ongerechtigheden laat geschieden, zo doet Hij nochtans niets onbetamelijks en dat aan enige berisping onderworpen is."}],"13":[{"catchword":"lichts;","tekst":"Zowel van hetgeen aangeboren is, als van hetgeen gekregen wordt uit Gods Woord en de aanschouwing zijner we  Vergelijk Ecc 2:16 ."},{"catchword":"besloten;","tekst":"Te weten, in het graf."},{"catchword":"de top","tekst":"Hebreeuws, het hoofd."},{"catchword":"afgesneden","tekst":"Dat is, zeer haast, lichtelijk, en als zonder arbeid, en daarom ook zonder des goddelozen grote smart."}],"25":[{"catchword":"Indien","tekst":"Dat is, zo men meent, dat mijn zeggen niet waarachtig is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wherefore should the times not be hid by the Almighty, [viz. Before men; See Act 1:7. by the times he understands the punishments, which God hath appointed to send, or inflict upon the wicked at set and certain times.] because they that knew him [i.e. which i.e. which are the true believers and God-fearing persons.] do not see his days? [viz. Wherein God punisheth the wicked. Thus that day of the LORD, is taken for that day or time, wherein God executes his judgements. Isa 2:12. and 13.6. Jer 46:10. Joel 2.11. Compare above 20.28. Prov 6:34. and 11.4. where they are called, days of Gods wrath, vengeance and indignation. Some take it here in a general sense for the days of recompence over the good and the bad. The sense of the whole verse is, that if God indeed hath always since the beginning of the world punished the wicked in this life here, as Eliphaz had affirmed above 22.15,16. The same would have manifestly appeared; but it hath not appeared so. For it pleaseth God to hide the times of his punishing. And therefore Eliphaz his saving cannot stand.]"}],"2":[{"catchword":null,"tekst":"They [viz. The wicked, Job sheweth the reason, wherefore he had said, that the punishing times of the almighty were hidden, and the wicked not proceeded against till such a time, own onely to himself.] seize on the land-marks; [viz. Of their neighbour, violently removing them, or encroaching upon them, to enlarge their own inheritance. See Deut.19.v.14. and 27.17. Pro 22:28.] they rob the flock, and feed them. [openly namely, before all the world, either in their own Country, or else in that which they have taken or wrested from their neighbour, and that without any ones awe or punishment.]"}],"3":[{"catchword":null,"tekst":"The ass of the Orphan, they drive away, the ox of the widow they take in pawn. [which God had forbidden, Exo 22:26. Deu 24:6, 10.12,13,17.]"}],"4":[{"catchword":null,"tekst":"They make the needy turn out of the way; [viz. By their haughtiness, insolence and the violence they practise every where, which the poor and needy are afraid of.] the miserable [or poor] of the Land do hide themselves together."}],"5":[{"catchword":null,"tekst":"Behold, they are wild-asses in the desert; [i.e. they are like wild asses, who are very wild, unruly and fierce among the rest of the savage Beasts. Gen 16:12. and below 35.8. Jer 2:24. Hos 8:9.] They go forth to their work, getting themselves early up for prey.] the plain field [Oth. The wilderness] is meat [Heb. Bread] to him, [viz. To the wicked and oppressors] (and) to the younger. [i.e. to his children, family and servants which attend him at prey.]"}],"6":[{"catchword":null,"tekst":"Upon the field they now [viz. Those of the younger sort, or his younger sort, or his labourers and workmen.] his fodder: [the wicked namely, i.e. that whereon he feedeth.] and they gather the vineyard of the wicked, [who doth and they gather the vineyard of the wicked. [who doth not pay them their wages. Otherwise this verse may be read thus: Upon the field, viz. Which is none of their own; they now every one his field: and, or, yea they gather the vineyard of the wicked indeed as themselves, whom they for all that, do spare as little as the godly, or calleth that, the vineyard of the wicked, which the wicked hath bereaved and violently dispossessed his neighbour of. Oth. Thus, and the wicked gathereth the Vineyard, viz. In view of the right owner, or, the vineyard of another.]"}],"7":[{"catchword":null,"tekst":"The naked, [i.e. their poor labourer, or workman, to whom they owe his wages] they let pass the night without clothing (having) no cover against the cold."}],"8":[{"catchword":null,"tekst":"From the stream of the hills [i.e. the water which runneth down the hills.] they are made wet [this, viz. The foresaid poor workmen and labourers.] and being without refuge, [i.e. without any place of shelter, or retreat, where in time of rain and tempest they might shroud themselves.] they embrace the stony rocks. [viz. That they may be safe against the injuries of the air, of cold and wind and wet, they climb up the rocks and creep into some cleft, cave or other, that are here and there upon them.]"}],"9":[{"catchword":null,"tekst":"They pluck the little orphan from the breast, [They viz. The wicked, to force and drive away the poor mother, unto their slavish task and employment: or, to make the little Orphan a slave, to serve themselves afterward, or, to put them to sale into slavery.] and (that) which is upon the poor, [i.e. his clothes, or covering.] they take in pawn."}],"10":[{"catchword":null,"tekst":"The naked they cause to go away without clothing; [understand it of their workmen, or day-labourers, as doth appear by the sequel. Compare above v.7.] and hungry (them that) carry the sheaves. [Oth. And they are hungry (that) bear, or, carry the sheaves, viz. Of the wicked oppressors and merciless tyrants.]"}],"11":[{"catchword":null,"tekst":"Betwixt their walls [i.e. in the wickeds dwelling-places] do they [viz. The poor and needy work-folks, of whom. See above v.5.7,10.] press out oil; they tread the wine-press and are dry."}],"12":[{"catchword":null,"tekst":"Forth the city men do sigh [the Hebrew verb doth properly signify the signing and groaning of these that are oppressed. See Exo 2:24. and 6.4. Eze 30:24.] And the soul of the wounded cryeth out: nevertheless God disposeth no absurdity. [See above 1.on v.22. The meaning is, though. God permit it such things to be practised, yet he doth nothing unbefitting, or that were subject to any just censure or reprehension.]"}],"13":[{"catchword":null,"tekst":"They are among the oppressors of the light; [viz. As well the inbred, as that which is to be gotten out of the word of God, and the beholding of the works of his creation.] they know not his ways. [See Gen.18.on v.19.] and they abide not in his paths."}],"14":[{"catchword":null,"tekst":"The murderer riseth with the light, [viz. Of the day. See above 17.12. and the annot.] putteth to death the pour and the needy: and by night he is as a thief."}],"15":[{"catchword":null,"tekst":"Also the eye of the adulterer observeth the glimmering, [understand that of the evening, or the twilight, whereof See 2 Kings 7.on v.5.] Saying; [viz.by himself. i.e. thinking in his heart. See Gen.20.on v.11.] No eye shall see me: and he putteth a cover, I properly, a hiding] over his face. [i.e. he disguise hand masketh himself, that he may not be discovered.]"}],"16":[{"catchword":null,"tekst":"In the darkness he diggeth through the houses, [the murderer namely, spoken of verse 14.] (which) they [viz. The murderer and his associates] had marked them by day: [i.e. which (watching all opportunities to rob their neighbour goods) they had observed and designed to force open and break into by night. They do not know the light. [Not to know, is hear not to desire nor inquire after, or care for; but to hate, shun and flee away for fear of being discovered and apprehended: Compare Jer 8:7. Rom 3:17.]"}],"17":[{"catchword":null,"tekst":"For the morning is unto them together [i.e. to them all] the shadow of death: [understand like the shadow of death, which is most dreadful and terrible; yea like death it self. So also is the sequel. Compare above 3.on v.5. and 10. On v.21.] When one knoweth them, they are in the terrors of the shadow of death. [i.e. such terrors as are caused by the shadow of death.]"}],"18":[{"catchword":null,"tekst":"He [viz. The wicked man] is light, [i.e. quick, nimble, active] upon the plain [or flatness] of the waters; [the sense is, that he maketh all the speed he can to escape by sea in ships, if once he be discovered in his thievery; or else, that he is exercising robbery and piracy at Sea, or as some conceive, that they are as quick, fleet and expedite in their thievish practises, as a ship upon the waters.] Their portion, upon the earth, [understand the wicked portion, of whom he speaketh here kin he plural number, though in the precedent and subsequent part of this verse he had used the singular, it is a permutation of the number and so below v.23. chap.32.8. Compare above 21.on v.10.] is accursed: [The habitations or dwelling-places, which such high-ways thieves or pirates also have on land, are commonly very barren, or situated in desert, uncouth and uncultivated places. Such land is called accursed, Gen 3:17. Contrary wise that which is cultivated, husbanded fruitful is called blessed, Gen 27:27. or we may understand it generally, that they are cursed of God and all men, together with all they have] He doth not turn himself to the way of the vineyard. [understand the high-way or common-road, which leadeth along and through the inhabited and well husbanded Country.]"}],"19":[{"catchword":null,"tekst":"The drought together with the heat, do take away the Snow-waters? (so) the grave (those which) have sinned. [i.e. like as the Snow-waters, which are sharp and penetrating, being fallen upon a dry ground, are by the heat of the day easily sucked up and consumed, so many notorious sinners, when their dying day is come, are soon gone and easily departed, without any long and lingering diseases to torment them. Thus he describeth the cut ward ferocity, which the wicked enjoy in their very deaths, according to the Worlds account.]"}],"20":[{"catchword":null,"tekst":"The womb forgetteth them, [i.e. his own mother that had born him, viz. The wicked in her womb, and into the world, shall have him no more in remembrance, both in regard of the great sins, wherein he lived without ren orse; as also, because that therefore he shall remain unregarded of the godly.] The worms are sweet unto him [i.e. death it self, which breedeth the worms in dead bodies, is full of ease unto him, and like a sweet rest and sleep, as putting the body to no manner of pain, before the judgement-day to come. Compare above 21.33.] There is no remembrance more of him, [i.e. men let him alone where he is, without thinking more of him; so that his body enjoyeth peace and quiet in the grave, as well as others.] And the iniquity is broken like a wood. [i.e. the unrighteous and wicked man. So Psa 107:42. item. Pro 13:6. sin, for, sinner, Pro 14:1. folly, for, foolish, or fools. See likewise below chap.35.on v.13. The meaning is, that such as practise perverseness and evil, happen oft to die with as much ease, as a dry stick of wood is broken asunder, without any great and long pains or agony.]"}],"21":[{"catchword":null,"tekst":"He eateth up the barren (that) beareth not; [or he feedeth away, i.e. devoureth. In his sense the Hebrew word is used likewise, Psa 49:15. and 80.14. Jer 2:16. and 6.3. and 11.6. to eat up, or, feed away (depascere is taken here, for troubling, molesting, wronging, burdening, affecting or bruising, as the word is likewise rendered and read by others.] And to the widow he doth no good."}],"22":[{"catchword":null,"tekst":"Yea through his strength he draweth, [viz. Under his power, speaking of the wicked oppressor.] The might vigour: [i.e. such as are of abilities, either by authority, or riches, or friends or, force and strength of body. In brief, the wicked seizeth not only on mean, poor, abandoned and weak ones, but likewise on others that are able or considerable in any kind. Compare above 9.24.] When he riseth up, then one is sure of life. [Heb. One believeth not life. See the like passion, Deut.28.66. See the annot.there. The meaning is; He is no sooner risen in the morning, but he goeth on his mischievousness, that every one must stand in fear of being wronged or ruined by him. Oth. He exalteth, or raiseth up himself, viz. To fall upon the mighty.]"}],"23":[{"catchword":null,"tekst":"When God doth set him [the wicked namely] at rest, [i.e. in a prosperous condition of this life.] then he relieth the son: Oth. Construe thus, if (God) give him, what (serveth) for rest, whereon he relieth, &c.] His eyes notwithstanding [Gods eyes namely;] are upon their ways. [the wicked namely, for to punish them, either in this life, or in that to come, Understand by these ways, their purposes, words and actions.]"}],"24":[{"catchword":null,"tekst":"They are exalted for a little (time); then there is none of them; [Job confesseth that indeed the power and excellency of the wicked is not long lasting, in regard the life of manis but short here; but he declareth withal, that their death outwardly differeth not from the death of other men, yea that for the most part theirs is the more easy and without tedious lingering and painfulness. Compare Ecc 2:16.] They are pressed down, they are shut up, [viz. In the grave.] like unto the top [Heb. Head] of a corn-ear, [i.e. very suddenly, easily, without any labour as it were, and therefore also without any great painfulness unto the wicked themselves.]"}],"25":[{"catchword":null,"tekst":"Now is if it be not so, [i.e. if any conceive, that my saying is not true.] Who shall make me [or, convince me of] lying, and reduce my speech to nothing?]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
