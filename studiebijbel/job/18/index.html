verscheurt door uw toorn! Zal om uwentwil de aarde verlaten worden, en zal een rots weggenomen worden uit haar plaats?","5":"Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren.","6":"Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden.","7":"De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.","8":"Want met zijn voeten zal hij in het net geworpen worden, en hij zal wandelen over het wargaren.","9":"De strik zal hem bij de hielen vatten; de struikrover zal hem overweldigen.","10":"Zijn touw is in de aarde verborgen, en zijn val op het pad.","11":"De verschrikkingen zullen hem van alle kanten schrik aanjagen, en hem opjagen, hem op de voet volgend.","12":"Zijn kracht zal uitgehongerd zijn, en het verderf is gereed aan zijn zijde.","13":"De eerstgeborene van de dood zal de delen van zijn huid verteren, zijn lichaamsdelen zal hij verteren.","14":"Zijn vertrouwen zal uit zijn tent uitgerukt worden; dat zal hem doen treden tot de koning der verschrikkingen.","15":"Zij zal wonen in zijn tent, waar zij niet bij hoort; zijn woning zal met zwavel overstrooid worden.","16":"Van onderen zullen zijn wortels verdorren, en van boven zal zijn tak afgesneden worden.","17":"Zijn gedachtenis zal vergaan van de aarde, en hij zal geen naam hebben op de straten.","18":"Men zal hem stoten van het licht in de duisternis, en men zal hem uit de wereld verjagen.","19":"Hij zal geen zoon, noch nakomeling hebben onder zijn volk; en niemand zal in zijn woningen overblijven.","20":"Over zijn dag zullen de nakomelingen verbaasd zijn, en de ouden zullen door schrik bevangen worden.","21":"Zeker, zulke zijn de woningen van de verkeerde, en dit is de plaats van hem die God niet kent."},"SV":{"1":"Toen antwoordde Bildad, de Suhiet, en zeide:","2":"Hoe lang is het, dat gijlieden een einde van woorden zult maken? Merkt op, en daarna zullen wij spreken.","3":"Waarom worden wij geacht als beesten, en zijn onrein in ulieder ogen?","4":"O gij, die zijn ziel verscheurt door zijn toorn! Zal om uwentwil de aarde verlaten worden, en zal een rots versteld worden uit haar plaats?","5":"Ja, het licht der goddelozen zal uitgeblust worden, en de vonk zijns vuurs zal niet glinsteren.","6":"Het licht zal verduisteren in zijn tent, en zijn lamp zal over hem uitgeblust worden.","7":"De treden zijner macht zullen benauwd worden, en zijn raad zal hem nederwerpen.","8":"Want met zijn voeten zal hij in het net geworpen worden, en zal in het wargaren wandelen.","9":"De strik zal *hem* bij de verzenen vatten; de struikrover zal hem overweldigen.","10":"Zijn touw is in de aarde verborgen, en zijn val op het pad.","11":"De beroeringen zullen hem rondom verschrikken, en hem verstrooien op zijn voeten.","12":"Zijn macht zal hongerig wezen, en het verderf is bereid aan zijn zijde.","13":"De eerstgeborene des doods zal de grendelen zijner huid verteren, zijn grendelen zal hij verteren.","14":"Zijn vertrouwen zal uit zijn tent uitgerukt worden; zulks zal hem doen treden tot den koning der verschrikkingen.","15":"Zij zal wonen in zijn tent, waar zij de zijne niet is; zijn woning zal met zwavel overstrooid worden.","16":"Van onder zullen zijn wortelen verdorren, en van boven zal zijn tak afgesneden worden.","17":"Zijn gedachtenis zal vergaan van de aarde, en hij zal geen naam hebben op de straten.","18":"Men zal hem stoten van het licht in de duisternis, en men zal hem van de wereld verjagen.","19":"Hij zal geen zoon, noch neef hebben onder zijn volk; en niemand zal in zijn woningen overig zijn.","20":"Over zijn dag zullen de nakomelingen verbaasd zijn, en de ouden met schrik bevangen worden.","21":"Gewisselijk, zodanige zijn de woningen des verkeerden, en dit is de plaats *desgenen* *die* God niet kent."},"KJV":{"1":"Then answered Bildad the Shuhite, and said,","2":"How long *will it be ere* ye make an end of words? mark, and afterwards we will speak.","3":"Wherefore are we counted as beasts, *and* reputed vile in your sight?","4":"He teareth himself in his anger: shall the earth be forsaken for thee? and shall the rock be removed out of his place?","5":"Yea, the light of the wicked shall be put out, and the spark of his fire shall not shine.","6":"The light shall be dark in his tabernacle, and his candle shall be put out","7":"The steps of his strength shall be straitened, and his own counsel shall cast him down.","8":"For he is cast into a net by his own feet, and he walketh upon a snare.","9":"The gin shall take *him* by the heel, *and* the robber shall prevail","10":"The snare *is* laid for him in the ground, and a trap for him in the way.","11":"Terrors shall make him afraid on every side, and shall drive him to his feet.","12":"His strength shall be hungerbitten, and destruction *shall be* ready at his side.","13":"It shall devour the strength of his skin: *even* the firstborn of death shall devour his strength.","14":"His confidence shall be rooted out of his tabernacle, and it shall bring him to the king of terrors.","15":"It shall dwell in his tabernacle, because *it is* none of his: brimstone shall be scattered upon his habitation.","16":"His roots shall be dried up beneath, and above shall his branch be cut off.","17":"His remembrance shall perish from the earth, and he shall have no name in the street.","18":"He shall be driven from light into darkness, and chased out of the world.","19":"He shall neither have son nor nephew among his people, nor any remaining in his dwellings.","20":"They that come after *him* shall be astonied at his day, as they that went before were affrighted.","21":"Surely such *are* the dwellings of the wicked, and this *is* the place *of him that* knoweth not God."}},"tsk":{"1":[{"kopje":"Bildad","refs":["Job 2:11","Job 8:1","Job 25:1","Job 42:7-9"]}],"2":[{"kopje":"Hoe lang","refs":["Job 8:2","Job 11:2","Job 13:5","Job 13:6","Job 16:2","Job 16:3"]},{"kopje":"Let op","refs":["Job 3:5","Job 3:6","Job 3 n> and his <span class=\"wl wl-kjv\" data-code=\"H5216\">candle</span> shall be put out","7":"The <span class=\"wl wl-kjv\" data-code=\"H6806\">steps</span> of his <span class=\"wl wl-kjv\" data-code=\"H202\">strength</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3334\">straitened,</span> and his own <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> shall cast him down.","8":"For he is <span class=\"wl wl-kjv\" data-code=\"H7971\">cast</span> into a <span class=\"wl wl-kjv\" data-code=\"H7568\">net</span> by his own <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and he <span class=\"wl wl-kjv\" data-code=\"H1980\">walketh</span> upon a snare.","9":"The <span class=\"wl wl-kjv\" data-code=\"H6341\">gin</span> shall <span class=\"wl wl-kjv\" data-code=\"H270\">take</span> him by the <span class=\"wl wl-kjv\" data-code=\"H6119\">heel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6782\">robber</span> shall prevail","10":"The <span class=\"wl wl-kjv\" data-code=\"H2256\">snare</span> is <span class=\"wl wl-kjv\" data-code=\"H2934\">laid</span> for him in the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and a <span class=\"wl wl-kjv\" data-code=\"H4434\">trap</span> for him in the way.","11":"<span class=\"wl wl-kjv\" data-code=\"H1091\">Terrors</span> shall make him <span class=\"wl wl-kjv\" data-code=\"H1204\">afraid</span> on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6327\">drive</span> him to his feet.","12":"His <span class=\"wl wl-kjv\" data-code=\"H202\">strength</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7457\">hungerbitten,</span> and <span class=\"wl wl-kjv\" data-code=\"H343\">destruction</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3559\">ready</span> at his side.","13":"It shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H905\">strength</span> of his <span class=\"wl wl-kjv\" data-code=\"H5785\">skin:</span> even the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> his strength.","14":"His <span class=\"wl wl-kjv\" data-code=\"H4009\">confidence</span> shall be rooted <span class=\"wl wl-kjv\" data-code=\"H5423\">out</span> of his <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle,</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H6805\">bring</span> him to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of terrors.","15":"It shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in his <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle,</span> because it is <span class=\"wl wl-kjv\" data-code=\"H1097\">none</span> of his: <span class=\"wl wl-kjv\" data-code=\"H1614\">brimstone</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2219\">scattered</span> upon his habitation.","16":"His <span class=\"wl wl-kjv\" data-code=\"H8328\">roots</span> shall be dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up</span> beneath, and <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> shall his <span class=\"wl wl-kjv\" data-code=\"H7105\">branch</span> be cut off.","17":"His <span class=\"wl wl-kjv\" data-code=\"H2143\">remembrance</span> shall <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and he shall have no <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> in the <span class=\"wl wl-kjv\" data-code=\"H6440\">street.</span>","18":"He shall be <span class=\"wl wl-kjv\" data-code=\"H1920\">driven</span> from <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> into <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness,</span> and <span class=\"wl wl-kjv\" data-code=\"H5074\">chased</span> out of the world.","19":"He shall neither have <span class=\"wl wl-kjv\" data-code=\"H5209\">son</span> nor <span class=\"wl wl-kjv\" data-code=\"H5220\">nephew</span> among his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> nor any <span class=\"wl wl-kjv\" data-code=\"H8300\">remaining</span> in his dwellings.","20":"They that come <span class=\"wl wl-kjv\" data-code=\"H314\">after</span> him shall be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonied</span> at his <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> as they that went <span class=\"wl wl-kjv\" data-code=\"H6931\">before</span> were <span class=\"wl wl-kjv\" data-code=\"H270\">affrighted.</span>","21":"Surely such are the <span class=\"wl wl-kjv\" data-code=\"H4908\">dwellings</span> of the <span class=\"wl wl-kjv\" data-code=\"H5767\">wicked,</span> and this is the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of him that <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> not God."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Hoe lang","tekst":"Dat is, hoelang zal het nog zijn, eer gij een einde uwer redenen maakt?"},{"catchword":"gijlieden","tekst":"Bildad, naar veler gevoelen, spreekt Job toe in het getal van velen, opdat hij onder zijn persoon mede begrijpt enige omstanders, die hem toegedaan waren en hem in zijn verantwoording voorstonden. Anderen menen dat hij Job en zijn metgezellen Elifaz en Zofar tezamen toespreekt, dezelve allen van twee dingen berispende:&lt;i&gt;I.&lt;/i&gt; dat zij het te lang met hun disputeren maakten;&lt;i&gt;II.&lt;/i&gt; dat zij niet wel letten op elkanders redenen, eer zij die beantwoordden. Sommigen menen dat hij het alleen op zijn twee vrienden heeft geladen, hen berispende dat zij te veel woorden gebruiken ten Job niet grondiglijk genoeg wederlegden."},{"catchword":"een einde","tekst":"Hebreeuws, den woorden einden stellen zult?"},{"catchword":"Merkt op,","tekst":"Of, geeft acht; te weten op de ganse zaak. Zo wordt het Hebreeuwse woord ook genomen Ezr 8:15 ; Neh 13:7 ; Pro 7:7 . Anders, maakt [ons] verstandig."}],"3":[{"catchword":"wij geacht","tekst":"Te weten, ik en mijn twee metgezellen."},{"catchword":"als beesten,","tekst":"Dat is, als botten, plompen, onverstandigen. Hij schijnt te zien op hetgeen Job gezegd had boven, Job 12:7 , en Job 17:4 , Job 17:10 ."},{"catchword":"onrein","tekst":"Dat is, als overtuigd van onwetendheid en verkeerdheid. Hij schijnt te zien op hetgeen Job gezegd had boven, Job 17:4 , Job 17:10 ."},{"catchword":"in ulieder","tekst":"Dat is, in het oordeel van Job en die het met hem hielden: In iemands ogen te zijn, is in zijn oordeel gehouden te worden voor zulke, of zulke; alzo onder, Job 19:15 , en Job 32:1 ; Pro 3:7 ; Isa 5:21 , enz.; vergelijk Lev 13:5 , en de aantekening."}],"4":[{"catchword":"zijn ziel","tekst":"Hij spreekt van God in den derden persoon, dien hij daarna in den tweeden persoon toespreekt. Zie gelijke verandering van persoon, boven, Job 12:4 , en Job 16:7 , en Job 30:19-20 ; Oba 1:3 . Hij wil zeggen, dat Job door ongeduldigheid zichzelven verzwakte, verdierf en vernielde."},{"catchword":"verwoest","tekst":"De zin is, dat God, om Jobs wil, de orde niet zou veranderen, die Hij altijd in zijn regering en oordelen gehouden had, straffende de bozen en zegenende de vromen, hetwelk niet meer ophouden kon, dan dat de wereld verlaten en de rotsen vervoerd zouden worden."}],"5":[{"catchword":"Ja,","tekst":"Alsof hij zeide: Hoezeer dat gij ons tegenspreekt, het is nochtans alzo, dat de goddelozen gestraft worden; en vervolgens, dewijl gij gestraft wordt, zijnde van God uit uw gehele welvaren gruwelijk gesloten, dat zij goddeloos moet zijn."},{"catchword":"het licht","tekst":"Versta, den voorspoed dezes levens, bestaande in eer, macht, rijkdom, gezondheid, weelde en vreugde, die velen hier op aarde hebben. Het woord licht is voor allerlei welstand en vreugde genomen. Zie Est 8:16 ; onder, Job 22:28 , en Job 30:26 , en Job 38:15 ; Psa 97:11 ; Pro 13:9 ; Isa 59:9 , enz. Vergelijk hiermede boven de aantekening op Job 11:17 ."},{"catchword":"de vonk","tekst":"Dat is, het minste van zijn heil of voorspoed zal hij niet genieten. Het woord vuur betekent hier evenveel als het voorgaande woord licht, dat is, voorspoed en welstand. Vergelijk Gen 15:17 ."},{"catchword":"zijns vuurs","tekst":"Te weten, des goddelozen, of een ieder van hen."}],"6":[{"catchword":"Het licht","tekst":"Zie op vs.5."},{"catchword":"tent,","tekst":"Dat is, woning. Alzo in het volgende. Zie 2Ki 13:5 ."},{"catchword":"lamp","tekst":"Versta, even hetzelfde, dat in vs.5 over het woord licht gezegd is. Alzo Psa 18:29 ; Pro 13:9 , en Pro 20:20 ."}],"7":[{"catchword":"De treden","tekst":"Dat is, de sterke voorgang van zijn vermogen en tijdelijken welstand zal ingetoomd en verzwakt worden, dat hij niet zo wijd en breed zal kunnen uitspringen om zijn geweld door veel stoutmoedig bedrijf uit te breiden."},{"catchword":"zijn raad","tekst":"Dat is, door zijn eigen onverstand, aanslagen en voornemens zal hij tenonder gaan."}],"8":[{"catchword":"met zijn voeten","tekst":"Anders, door zijn voeten; dat is, door zijn eigen beleid zal hij geraken in het gevaar, hetwelk hem door Gods rechtvaardig oordeel zal toebereid wezen."},{"catchword":"het wargaren","tekst":"Dat is, hij zal geduriglijk in duizend gevaren wezen."}],"9":[{"catchword":"zal hem","tekst":"Anders, hij zal met de verzenen den strik vatten; dat is, door zijn eigen onvoorzichtigheid zal hij zelf zijn voet in den strik steken en verwarren."},{"catchword":"struikrover","tekst":"Zie boven, Job 5:5 ."}],"10":[{"catchword":"verborgen,","tekst":"Dat is, door Gods heimelijk en rechtvaardig oordeel bereid, om daarin gevangen te worden en te vergaan."},{"catchword":"zijn val","tekst":"Men meent, dat het woord betekent een instrument, hetwelk op den weg gesteld werd, om daarmede vogelen te vangen."}],"11":[{"catchword":"De beroeringen","tekst":"Te weten, der conscientie en andere uitwendige, die God pleegt te gebruiken om de goddelozen te pijnigen."},{"catchword":"verstrooien","tekst":"Dat is, hem brengen op de benen, hem jagende herwaarts en derwaarts door vele gedachten, die hem van binnen het hart doorsteken zullen. Zie Isa 57:20-21 ."}],"12":[{"catchword":"macht","tekst":"Versta, al hetgeen, waardoor hij enig aanzien en vermogen onder de mensen heeft."},{"catchword":"hongerig","tekst":"Dat is, zeer zwak worden, verkranken en afgaan. Hongerigen worden genaamd die in enig gebrek, ellende, of onvermogen zijn. Vergelijk 1Sa 2:5 ; Psa 107:9 , Psa 107:36 ; Isa 32:6 ; Luk 1:53 ."},{"catchword":"aan zijn zijde","tekst":"Dat is, omtrent en nabij hem."}],"13":[{"catchword":"eerstgeborene","tekst":"Dat is, een geweldige en schrikkelijke dood; want gelijk de eerstgeborene de overste was zijner broeders, en de meeste macht onder die had, alzo wordt de eerstgeborene des doods gezegd, die in geweld en vreeslijkheid andere doden tebovengaat. Alzo worden van Jesaja genaamd de eerstegeborene der armen die de armste waren, Isa 14:30 , of de duivel, die de macht des doods heeft; Heb 2:14 ."},{"catchword":"de grendelen","tekst":"Versta, de benen, waarmede de huid vastgemaakt en het gehele lichaam ondersteund wordt. Anders, lidmaten, of de takken; dat is, de zenuwen en aderen, welke als takken door het gehele lichaam uitgespreid zijn. Het Hebreeuwse woord heeft verscheidene betekenissen."}],"14":[{"catchword":"vertrouwen","tekst":"Dat is, al hetgeen waarop hij zich verlaat. Alzo wordt het woord vertrouwen genomen, boven, Job 8:14 ; onder, Job 31:24 ; Pro 25:19 ."},{"catchword":"uitgerukt","tekst":"Vergelijk boven, Job 8:13-15 ."},{"catchword":"zulks","tekst":"Of, gij zult hem doen treden, enz. als ene aanspraak tot God."},{"catchword":"den koning","tekst":"Zo wordt genaamd de dood, omdat hij de goddelozen ten hoogste verschrikt. Of, versta, de allermeeste en gruwelijkste verschrikking, gelijk in vs.13 door den eerstgeborene des doods te verstaan is een zeer schrikkelijke dood. Ook kan men hierbij verstaan den duivel, wiens regering vrees en slavernij medebrengt; Heb 2:15 ."}],"15":[{"catchword":"Zij zal wonen","tekst":"Te weten, de verschrikking, of elk ene der verschrikkingen."},{"catchword":"waar zij de zijne niet is","tekst":"Hebreeuws, zonder zijne te zijn; dat is, daar zij hem niet toebehoort, te weten, omdat zij niet gemaakt is met zijn eigen middelen, maar met het goed, dat hij anderen ontnomen had."},{"catchword":"zwavel","tekst":"Dit schijnt een dreigement te zijn van dorheid en onvruchtbaarheid van het land; Deu 29:23 ; Isa 34:9 . Het kan ook zien op de straf, die over Sodom en Gomorra gevallen was, Gen 19:24 , en om Job te meer te bezwaren, schijnt hij te wijzen op hetgeen zijn volk en schapen wedervaren was, verslonden zijnde met vuur uit den hemel; boven, Job 1:16 ."}],"16":[{"catchword":"Van onder","tekst":"Dat is, hij zal ten enemaal vergaan, gelijk een boom, wiens wortel verdort en wiens takken afgehouwen worden."},{"catchword":"tak","tekst":"Het Hebreeuwse woord is ook alzo genomen, boven, Job 14:9 ; onder, Job 29:19 , en Isa 27:10 ."}],"17":[{"catchword":"op de straten","tekst":"Hebreeuws, op het aangezicht der straat; dat is, onder de mensen in het openbaar en in de algemene vergaderingen zal hij niet voor eerlijk en vroom vermaard worden."}],"18":[{"catchword":"Men zal","tekst":"Hebreeuws, zij zullen hem verdrijven; dat is, hij zal verdreven worden, of men zal hem verdrijven. Zie boven, Job 4:19 ."},{"catchword":"licht","tekst":"Te weten, van dit leven, of uit alle waardigheid, voorspoed, rijkdom en welstand. Zie boven, vs.5."},{"catchword":"duisternis,","tekst":"Te weten, des doods en der hel, gelijk de volgende woorden schijnen mede te brengen. Zie een gelijk exempel in den rijken vrek, Luk 16:23 . Anders kan het woord duisternis hier genomen zijn voor tegenspoed en ellende. Zie Gen 15:12 ."}],"19":[{"catchword":"neef hebben","tekst":"Of, kindskind."}],"20":[{"catchword":"zijn dag","tekst":"Dat is, den dag zijns ondergangs van God gesteld om zijn rechtvaardig oordeel tegen hem uit te voeren. Alzo Eze 21:25 ; en alzo is door een menselijken dag te verstaan een menselijk oordeel, 1Co 4:3 . Vergelijk boven, Job 15:32 , en de aantekening."},{"catchword":"nakomelingen","tekst":"Dat is, die na hem leven zullen."},{"catchword":"de ouden","tekst":"Of, voorgaande; dat is, die voor de nakomelingen geweest waren, en leefden niet alleen als hij nog in zijn weelde was, maar ook daarna, als hij een schrikkelijk einde nam."},{"catchword":"met schrik","tekst":"Het Hebreeuwse woord betekent zulk een schrik, waardoor een mens de haren te berge staan. Alzo Eze 27:35 , en Eze 32:10 . De zin is uitgedrukt boven, Job 4:15 ."}],"21":[{"catchword":"de plaats","tekst":"Dat is, staat en conditie. Vergelijk boven, de aantekening Job 8:18 ."},{"catchword":"die","tekst":"God] Dat is, naar God niet vraagt om van zijn wezen, wil en werken een rechte wetenschap te hebben, ten einde dat hij hem behage en diene. Vergelijk Exo 5:2 ; Jdg 2:10 ; Psa 78:6 ; 2Th 1:8 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then answered Bildad the Suhite, and said:"}],"2":[{"catchword":null,"tekst":"How long is it, (ere) you will make an end of words? [i.e. how long will it be yet, ere ye make an end of your discourse? Hebr. Put ends to words? Bildad, as is conceived by many, doth speak to Job here in the plural number, comprehending together with him some of the standers by, that were of his mind and maintained his defence. Others are of opinion, that he addresseth his speech to Job and his own companions Eliphaz and Zophar together, checking them jointly of two things, 1. That they were too long in their disputes, 2.that they did not duely weigh one anothers arguments, before they answered the same. Others think, that he only taxeth his two friends here, for making too many words, and yet not redarguing Job with grounds sufficient.] Mark ye, [or, attend, give heed to, viz. The whole matter. So the Hebrew word is likewise taken, Ezra 8.15. Nehem.13.7. Pro 7:7. Oth. Make (us) to understand] and then shall we speak."}],"3":[{"catchword":null,"tekst":"Wherefore are we counted [viz. I my self, and my two companions] As beasts [i.e. as dull, blunt, silly men, without understanding. He seemeth to reflect upon what Job had said, above chap.12.7. and 17.3.9.] And are unclean [as convicted of ignorance and perverseness, he seemed to have a regard to what Job had said, above chap.17.v.4. and 10.] In your eyes? [i.e. in Jobs judgement and account, together with theirs that held with him. To be in a mans eyes, is, to be accounted, or held for such and such in his judgement. So below chap.19.15. and 32.1. Pro 3:7. Isa 5:21. &c. Compare Levit.13.5. and the Annot.]"}],"4":[{"catchword":null,"tekst":"O thou, that teareth his soul through his anger: [he speaketh of Job in the third person: whom presently after he addresseth himself unto in the second. See the like enter change of the person, above chap.12.4. and 16.7. and 30.19. Obad.3. His meaning is, that Job through impatiency, extreamly weakened, wronged and destroyed himself] Shall the Earth be forsaken for thy sake, and shall a Rock be moved out of his place, [the meaning is that God would surely not alter his order for Jobs sake, having always kept and maintained the same in his government and judgements, by punishing the wicked and blessing the godly, which could no more cease, then the world be forsaken and the rocks removed?]"}],"5":[{"catchword":null,"tekst":"Ye the light of the wicked shall be extinguished, [as if he said, for all thy gainsaying it holds true and sure enough, that the wicked are punished: and consequently, thou being now punished, yea most fearfully deprived and turned out of all thy welfare, that thou art a wicked man indeed. By the light of the wicked he understands their prosperity in this life, consisting in honour, power, wealth, health, joy and pleasure, which many of them do enjoy here on Earth. The word light is taken for all manner of prosperity and joy. See Est 8:16. & 22.28. & 30.26. & 38.15. Psal.97.11. Pro 13:9. Isa 59:9. etc. Compare here with above chap.11.on v.17.] And the spark of his fire shall not glister. [his, i.e. the wicked, or of every one of them. The sense is, he shall not enjoy fruition of the least of his weal or welfare. The word fire here doth signify the same thing, that light doth, i.e. outward success, prosperity and happiness. Compare Gen.15.on v.17.]"}],"6":[{"catchword":null,"tekst":"The light [See the precedent verse] Shall grow dark in his Tent [i.e. dwelling place, and so in the sequel, See 2 Kings 13.on v.5.] And his lamp shall be put over him [understand the same thing, that is said of the light in the former v. And so Psal.18.29. Pro 13:9. and 20.20.]"}],"7":[{"catchword":null,"tekst":"The steps of his might shall be straightened; [i.e. the strong and great success of his temporal power, and prosperity shall be curbed and weakened, that he shall not be able to mount so high or spread so far, as to enlarge and extend his power according to his unlimited and haughty presumption.] And his counsel shall throw him down. [i.e. he shall perish by his own devises, plots and practises.]"}],"8":[{"catchword":null,"tekst":"For with his feet he shall be cast into the net. [Oth. By his feet: i.e. he shall run and entangle himself by his own ways and wiles into or upon such dangers, as by the just judgement of God shall be prepared for him.] And shall walk in the reviled yarn. [i.e. he shall be in a thousand straights continually.]"}],"9":[{"catchword":null,"tekst":"The snare shall take him by the heels; [Oth. He shall apprehend the snare with his feet. i.e. by his own unadvisedness shall he put and enthral his foot into the Snare] The high-way robber shall subdue him. [See above chap.5.on v.5.]"}],"10":[{"catchword":null,"tekst":"His ginne is hid in the earth; [i.e. by Gods secret and righteous judgement so disposed that he must be taken by, and perish in it.] And his trap upon the path. [it is conceived that the Hebrew word rendered trap here doth signify a certain trap or engine which is set or spread by the way, to take birds or other creatures with.]"}],"11":[{"catchword":null,"tekst":"The troubles [viz. Of conscience within and other outward ones, which God maketh use of to plague the wicked withal] Shall affright him round about; and scatter him up and down through the multitude of his distracted thoughts, which shall pierce his heart through from within, See Isa 57:20,21.]"}],"12":[{"catchword":null,"tekst":"His might [understand hereby, all that, whereby he hath any power and authority among men] shall be hunger-bitten; [i.e. grow very faint and impotent, decay and come to nothing, Hungry or hunger-bitten, such are called, as are in any want, distress, or disability. Compare 1 Sam.2.5. Psal.107.9,36. Isa 32:6. Luk 1:53.] And destruction is ready at his side, [i.e. very near, or round about him.]"}],"13":[{"catchword":null,"tekst":"The first born of death [i.e. a fierce violent and fearful kind of death: of as the first-born was the chiefest among his brethren, and had most authority among them, so the first-born of death is called, that kind of death, which of all others is the most violent and terrible. So Isaiah calleth the first-born of the poor those that were the poorest of all, Isa 14:30. Or, by the first-born of death may be understood the Divel, having the power of death, Heb.2,14.] Shall devour the grates of his house; [understand the bones, whereby the skin is kept in plight and the whole frame of the body sitly sustained and supported. Oth. Members, or the branches i.e. the veins and sinews which are spread all over the body like twigs and branches, the Hebrew word hath various significants.] Its grates he shall devour."}],"14":[{"catchword":null,"tekst":"His confidence [i.e. whatsoever he relieth upon. So the word confidence is taken above chap.8.14. and 31.24. Pro 25:19.] Shall be plucked out of his tent; [Compare above 8.13,14,15 // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.className = 'vers'; rij.id = 'v' + n;

    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

    }).join('');
}
function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    return label + refChips(nd.refs) + kids;

    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
