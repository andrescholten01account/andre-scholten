om zou mijn geest niet verdrietig zijn?","5":"Kijk mij aan, en word verbaasd, en leg de hand op de mond.","6":"Ja, wanneer ik *daaraan* denk, word ik verschrikt, en huivering grijpt mijn lichaam aan.","7":"Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen?","8":"Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht.","9":"Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.","10":"Hun stier bespringt en mist niet; hun koe kalft en misdraagt niet.","11":"Hun jonge kinderen zenden zij uit als een kudde, en hun kinderen huppelen.","12":"Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit.","13":"In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.","14":"Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.","15":"Wat is de Almachtige, dat wij Hem zouden dienen? En wat baat zouden wij hebben, dat wij Hem zouden aanroepen?","16":"*Toch* zie, hun geluk is niet in hun eigen hand; de raad van de goddelozen is ver van mij.","17":"Hoe vaak gebeurt het, dat de lamp van de goddelozen wordt uitgeblust, en hun ondergang over hen komt; dat *God* *hun* smarten uitdeelt in Zijn toorn!","18":"Dat zij worden als stro voor de wind, en als kaf, dat de wervelwind wegsteelt;","19":"Dat God Zijn geweld weglegt voor Zijn kinderen, hem vergeldt, zodat hij het gewaarwordt;","20":"Dat zijn ogen zijn eigen ondergang zien, en hij drinkt van de grimmigheid van de Almachtige!","21":"Want wat behagen zou hij na zich aan zijn huis hebben, als het getal van zijn maanden afgesneden is?","22":"Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?","23":"De één sterft in de kracht van zijn volkomenheid, terwijl hij helemaal stil en gerust was;","24":"Zijn melkvaten waren vol melk, en het merg van zijn beenderen was bevochtigd.","25":"De ander daarentegen sterft met een bittere ziel, en hij heeft van het goede niet gegeten.","26":"Zij liggen samen neer in het stof, en het gewormte overdekt hen.","27":"Zie, ik ken uw gedachten, en de boze plannen, *waarmee* u tegen mij geweld doet.","28":"Want u zult zeggen: Waar is het huis van de vorst, en waar is de tent van de woningen der goddelozen?","29":"Hebt u niet gevraagd aan de voorbijgaande op de weg, en kent u hun tekenen niet?","30":"Dat de boze gespaard wordt op de dag van het verderf; *dat* *zij* op de dag van de verbolgenheden weggevoerd worden.","31":"Wie zal hem in het aangezicht zijn weg voorhouden? Als hij *iets* doet, wie zal het hem vergelden?","32":"Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.","33":"De kluiten van het dal zijn hem zoet, en hij trekt achter zich alle mensen aan; en van hen die vóór hem geweest zijn, is geen getal.","34":"Hoe troost u mij dan met ijdelheid, terwijl in uw antwoorden ontrouw overblijft?"},"SV":{"1":"Maar Job antwoordde en zeide:","2":"Hoort aandachtelijk mijn rede, en laat dit zijn uw vertroostingen.","3":"Verdraagt mij, en ik zal spreken; en nadat ik gesproken zal hebben, spot *dan*.","4":"Is ( mij aangaande) mijn klacht tot den mens? Doch of het zo ware, waarom zou mijn geest niet verdrietig zijn?","5":"Ziet mij aan, en wordt verbaasd, en legt de hand op den mond.","6":"Ja, wanneer ik *daaraan* gedenk, zo word ik beroerd, en mijn vlees heeft een gruwen gevat.","7":"Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen?","8":"Hun zaad is bestendig met hen voor hun aangezicht, en hun spruiten zijn voor hun ogen.","9":"Hun huizen hebben vrede zonder vreze, en de roede Gods is op hen niet.","10":"Zijn stier bespringt, en mist niet; zijn koe kalft, en misdraagt niet.","11":"Hun jonge kinderen zenden zij uit als een kudde, en hun kinderen huppelen.","12":"Zij heffen op met de trommel en de harp, en zij verblijden zich op het geluid des orgels.","13":"In het goede verslijten zij hun dagen; en in een ogenblik dalen zij in het graf.","14":"Nochtans zeggen zij tot God: Wijk van ons, want aan de kennis Uwer wegen hebben wij geen lust.","15":"Wat is de Almachtige, dat wij Hem zouden dienen? En wat baat zullen wij hebben, dat wij Hem aanlopen zouden?","16":"*Doch* ziet, hun goed is niet in hun hand; de raad der goddelozen is verre van mij.","17":"Hoe dikwijls geschiedt het, dat de lamp der goddelozen uitgeblust wordt, en hun verderf hun overkomt; dat *God* *hun* smarten uitdeelt in Zijn toorn!","18":"Dat zij gelijk stro worden voor den wind, en gelijk kaf, dat de wervelwind wegsteelt;","19":"Dat God Zijn geweld weglegt voor Zijn kinderen, hem vergeldt, dat hij het gewaar wordt;","20":"Dat zijn ogen zijn ondergang zien, en hij drinkt van de grimmigheid des Almachtigen!","21":"Want wat lust zou hij na zich aan zijn huis hebben, als het getal zijner maanden afgesneden is?","22":"Zal men God wetenschap leren, daar Hij de hogen richt?","23":"Deze sterft in de kracht zijner volkomenheid, daar hij gans stil en gerust was;","24":"Zijn melkvaten waren vol melk, en het merg zijner benen was bevochtigd.","25":"De ander daarentegen sterft met een bittere ziel, en hij heeft van het goede niet gegeten.","26":"Zij liggen te zamen neder in het stof, en het gewormte overdekt ze.","27":"Ziet, ik weet ulieder gedachten, en de boze verdichtselen, *waarmede* gij tegen mij geweld doet.","28":"Want gij zult zeggen: Waar is het huis van den prins, en waar is de tent van de woningen der goddelozen?","29":"Hebt gijlieden niet gevraagd de voorbijgaanden op den weg, en kent gij hun tekenen niet?","30":"Dat de boze onttrokken wordt ten dage des verderfs; *dat* *zij* ten dage der verbolgenheden ontvoerd worden.","31":"Wie zal hem in het aangezicht zijn weg vertonen? Als hij *wat* doet, wie zal hem vergelden?","32":"Eindelijk wordt hij naar de graven gebracht, en is gedurig in den aardhoop.","33":"De kluiten des dals zijn hem zoet, en hij trekt na zich alle mensen; en dergenen, die voor hem geweest zijn, is geen getal.","34":"Hoe vertroost gij mij dan met ijdelheid, dewijl *in* uw antwoorden overtreding overig is?"},"KJV":{"1":"But Job answered and said,","2":"Hear diligently my speech, and let this be your consolations.","3":"Suffer me that I may speak; and after that I have spoken, mock on.","4":"As for me, *is* my complaint to man? and if *it were so*, why should not my spirit be troubled?","5":"Mark me, and be astonished, and lay *your* hand upon *your* mouth.","6":"Even when I remember I am afraid, and trembling taketh hold on my flesh.","7":"Wherefore do the wicked live, become old, yea, are mighty in power?","8":"Their seed is established in their sight with them, and their offspring before their eyes.","9":"Their houses *are* safe from fear, neither *is* the rod of God","10":"Their bull gendereth, and faileth not; their cow calveth, and casteth not her calf.","11":"They send forth their little ones like a flock, and their children dance.","12":"They take the timbrel and harp, and rejoice at the sound of the organ.","13":"They spend their days in wealth, and in a moment go down to the grave.","14":"Therefore they say unto God, Depart from us; for we desire not the knowledge of thy ways.","15":"What *is* the Almighty, that we should serve him? and what profit should we have, if we pray","16":"Lo, their good *is* not in their hand: the counsel of the wicked is far","17":"How oft is the candle of the wicked put out! and *how oft* cometh their destruction upon them! *God* distributeth sorrows in his anger.","18":"They are as stubble before the wind, and as chaff that the storm carrieth away.","19":"God layeth up his iniquity for his children: he rewardeth him, and he shall know","20":"His eyes shall see his destruction, and he shall drink of the wrath of the Almighty.","21":"For what pleasure *hath* he in his house after him, when the number of his months is cut off in the midst?","22":"Shall *any* teach God knowledge? seeing he judgeth those that are high.","23":"One dieth in his full strength, being wholly at ease and quiet.","24":"His breasts are full of milk, and his bones are moistened with marrow.","25":"And another dieth in the bitterness of his soul, and never eateth with pleasure.","26":"They shall lie down alike in the dust, and the worms shall cover","27":"Behold, I know your thoughts, and the devices *which* ye wrongfully imagine","28":"For ye say, Where *is* the house of the prince? and where *are* the dwelling places of the wicked?","29":"Have ye not asked them that go by the way? and do ye not know their tokens,","30":"That the wicked is reserved to the day of destruction? they shall be brought forth to the day of wrath.","31":"Who shall declare his way to his face? and who shall repay him *what* he hath done?","32":"Yet shall he be brought to the grave, and shall remain in the tomb.","33":"The clods of the valley shall be sweet unto him, and every man shall draw after him, as *there are* innumerable before","34":"How then comfort ye me in vain, seeing in your answers there remaineth falsehood?"}},"tsk":{"2":[{"kopje":"Luister","refs":["Job 13:3","Job 13:4","Job 18:2","Job 33:1","Job 33:31-33","Job 34:2","Richt 9:7","Jes 55:2","Hebr 2:1"]},{"kopje":"laat dit","refs":["Job 15:11","Job 16:2"]}],"3":[{"kopje":"ik zal spreken","refs":["Job 13:13","Job 33:31-33"]},{"kopje":"spot dan","refs":["Job 12:4","Job 12:5","Job 13:9","Job 16:10","Job 16:20","Job 17:2"]}],"4":[{"kopje":"is mijn klacht","refs":["Job 7:11-21","Job 10:1","Job 10:2","1 Sam 1:16","Ps 22:2-4","Ps 77:4-10","Ps 102:2","Ps 142:3","Ps 142:4","Matt 26:38"]},{"kopje":"al was het zo","refs":["2 Kon 6:26","2 Kon 6:27","Ps 42:12"]},{"kopje":"verdrietig","refs":["Ex 6:8"]}],"5":[{"kopje":"word verbaasd","refs":["Job 2:12","Job 17:8","Job 19:20","Job 19:21"]},{"kopje":"leg de","refs":["Job 29:9","Job 39:37","Richt 18:19","Ps 39:10","Spr 30:32","Amos 5:13","Micha 7:16","Rom 11:33"]}],"6":[{"kopje":"wanneer ik daaraan denk","refs":["Ps 77:4","Ps 88:16","Ps 119:120","Klaagl 3:19","Klaa ose that are high.","23":"One <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> in his <span class=\"wl wl-kjv\" data-code=\"H8537\">full</span> <span class=\"wl wl-kjv\" data-code=\"H6106\">strength,</span> being wholly at <span class=\"wl wl-kjv\" data-code=\"H7946\">ease</span> and quiet.","24":"His <span class=\"wl wl-kjv\" data-code=\"H5845\">breasts</span> are <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H2461\">milk,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are <span class=\"wl wl-kjv\" data-code=\"H8248\">moistened</span> with marrow.","25":"And another <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> in the <span class=\"wl wl-kjv\" data-code=\"H4751\">bitterness</span> of his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> and never <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> with pleasure.","26":"They shall lie <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">alike</span> in the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7415\">worms</span> shall cover","27":"Behold, I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> your <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4209\">devices</span> which ye wrongfully imagine","28":"For ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Where is the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H5081\">prince?</span> and where are the <span class=\"wl wl-kjv\" data-code=\"H4908\">dwelling</span> <span class=\"wl wl-kjv\" data-code=\"H168\">places</span> of the wicked?","29":"Have ye not <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> them that <span class=\"wl wl-kjv\" data-code=\"H5674\">go</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way?</span> and do ye not <span class=\"wl wl-kjv\" data-code=\"H5234\">know</span> their tokens,","30":"That the <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked</span> is <span class=\"wl wl-kjv\" data-code=\"H2820\">reserved</span> to the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H343\">destruction?</span> they shall be brought <span class=\"wl wl-kjv\" data-code=\"H2986\">forth</span> to the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of wrath.","31":"Who shall <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> his <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to his <span class=\"wl wl-kjv\" data-code=\"H6440\">face?</span> and who shall <span class=\"wl wl-kjv\" data-code=\"H7999\">repay</span> him what he hath done?","32":"Yet shall he be <span class=\"wl wl-kjv\" data-code=\"H2986\">brought</span> to the <span class=\"wl wl-kjv\" data-code=\"H6913\">grave,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H8245\">remain</span> in the tomb.","33":"The <span class=\"wl wl-kjv\" data-code=\"H7263\">clods</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">valley</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4985\">sweet</span> unto him, and every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H4900\">draw</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, as there are <span class=\"wl wl-kjv\" data-code=\"H4557\">innumerable</span> before","34":"How then <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> ye me in <span class=\"wl wl-kjv\" data-code=\"H1892\">vain,</span> seeing in your <span class=\"wl wl-kjv\" data-code=\"H8666\">answers</span> there <span class=\"wl wl-kjv\" data-code=\"H7604\">remaineth</span> falsehood?"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Hoort","tekst":"Hebreeuws, horende hoort."},{"catchword":"dit zijn","tekst":"Te weten, dat gij stilzwijgt en mij met aandacht toehoort."},{"catchword":"uw vertroostingen","tekst":"Dat is, in de eerste plaats van de vertroostingen, die gij mij in dezen droeven staat behoordet te geven."}],"3":[{"catchword":"spot [dan","tekst":"] Namelijk, gij Zofar, die met uw verhaasting recht tevoren mijne rede afgebroken hebt; boven, Job 20:2 . Job houdt Zofars antwoord voor bespotting."}],"4":[{"catchword":"tot den mens?","tekst":"Hij wil zeggen: Neen, maar veel meer tot God, die alleen zijn conscientie zag en zijn onschuld verdedigen Kon. De mensen, gelijk zijn vrienden, deden hem anders niet dan kwellingen aan."},{"catchword":"of het zo ware,","tekst":"Te weten, dat mijn klacht tot den mens ware."},{"catchword":"waarom","tekst":"Dewijl de mensen tegen mij, die zo ellendig ben, zo onbeleefd zijn."},{"catchword":"verdrietig","tekst":"Of, benauwd zijn. Hebreeuws, bekort zijn. Alzo kortheid des geestes voor benauwdheid des geestes; Exo 6:8 . Elders, verdrietig zijn. Zie Jdg 16:16 ."}],"5":[{"catchword":"verbaasd,","tekst":"Te weten, door de aanmerking van mijn grote ellende."},{"catchword":"legt de hand","tekst":"Te weten, tot een teken van stilzwijgendheid, komende uit verschrikking, die mijn lijden u behoort te veroorzaken. Zie van deze manier van spreken Jdg 18:19 ; idem onder, Job 29:9 , en Job 39:37 ; Pro 30:32 ."}],"6":[{"catchword":"daaraan","tekst":"Te weten, dat ik dus veel lijden moet, die vroom ben, en velen zo welvaren, die goddeloos zijn; gelijk in het volgende gezegd wordt."}],"8":[{"catchword":"zaad","tekst":"Dat is, kinderen, nakomelingen. Zie Gen 9:9 , en Isa 21:15 , welke in het volgende worden genaamd spruiten."},{"catchword":"spruiten","tekst":"Zie boven, Job 5:25 ."}],"9":[{"catchword":"vrede","tekst":"Hebreeuws, hun huizen vrede; dat is, hebben vrede, of zijn in vrede. Zie gelijke manier van spreken, 2Sa 17:3 , en de aantekening. Vrede voor voorspoed en welstand; zie Gen 37:14 ."},{"catchword":"roede Gods","tekst":"Dat is, de straf en kastijding Gods; zie boven, Job 9:34 ."}],"10":[{"catchword":"Zijn stier","tekst":"Te weten, des goddelozen. Het is een verandering des getals; want van de goddelozen wordt het veelvoudig getal gebruikt in de drie voorgaande verzen, vs.7-9, gelijk ook in de volgende, vs.11-13, enz., maar hier wordt het eenvoudig getal genomen. Alzo Exo 34:15 , en boven, Job 14:12 , enz."}],"11":[{"catchword":"zij uit","tekst":"Te weten, de goddelozen."},{"catchword":"kudde,","tekst":"Te weten, van schapen of geiten. Zie van het Hebreeuwse woord Gen 12:16 . De zin is, dat zij veel kinderen hebben, die zich overal in den lande met vermaking der ouders uitbreiden."},{"catchword":"huppelen","tekst":"Namelijk, van uitwendige weelde en inwendige vreugde; gelijk het jonge vee gewoon is te doen in vette weiden, die alleszins wel voorzien en bewaard zijn."}],"12":[{"catchword":"heffen","tekst":"Te weten, de voeten, of de stem."}],"13":[{"catchword":"goede","tekst":"Te weten, des tijdelijken levens, als staat, aanzien, rijkdom, gemak en de goede welstand. Alzo onder, vs.25; Psa 104:28 ; Pro 11:10 ; Ecc 6:3 ; Isa 1:19 , enz."},{"catchword":"verslijten","tekst":"Of, verouden."},{"catchword":"in een ogenblik","tekst":"Dat is, haastelijk, zonder in langdurige en pijnlijke smarten te kwijnen."}],"14":[{"catchword":"zeggen zij","tekst":"Te weten, niet zozeer met den mond, omdat zij zich des schamen, als met het hart, hetwelk vol is van verachting des goddelijken naams. Vergelijk Psa 14:1 , en Psa 36:2 ; Mal 3:14-15 ."},{"catchword":"Uwer wegen","tekst":"Zie Gen 18:19 ."}],"15":[{"catchword":"dat wij Hem","tekst":"Te weten, om Hem aan te roepen, gelijk Jer 7:16 ."}],"16":[{"catchword":"hun goed","tekst":"Dat is, hun welvaren is in hun macht niet, maar alleen in den genadigen zegen des Allerhoogsten. Job spreekt hier in zijn persoon, en verfoeit de ijdelheid en de goddeloosheid der ongelovige en onvrome mensen, verklarende geen gemeenschap daarmede te willen hebben."},{"catchword":"raad","tekst":"Dat is, het gevoelen, voornemen en bedrijf; vergelijk Deu 32:28 ; boven, Job 10:3 , en Job 18:7 ; Psa 1:1 ."}],"17":[{"catchword":"Hoe dikwijls","tekst":"Hij wil zeggen: Niet zeer dikwijls; alzo onder, vs.20. Hij staat wel toe dat het somtijds gebeurt hetgeen Zofar gedreven had, boven, Job 20:5 , en Bildad, boven, Job 18:5 , maar loochent zulks dikwijls te geschieden, veelmin altijd. Alzo in het volgende."},{"catchword":"de lamp","tekst":"Dat is, zijn voorspoed en welvaren. Zie boven, Job 18:5 ."}],"18":[{"catchword":"gelijk stro","tekst":"Vergelijk onder, Job 27:21 ; Psa 1:4 , en Psa 35:5 ; Isa 17:13 , en Isa 29:5 ; Hos 13:3 ."}],"19":[{"catchword":"geweld","tekst":"Versta, des goddelozen geweld, dat is de straf, die hij door geweld en moedwil, aan anderen bedreven, verdiend heeft."},{"catchword":"weglegt,","tekst":"Dat is, verstelt en ophoudt, om die op zijn kinderen, die de voetstappen zijner goddeloosheid navolgen, daarna te brenge; Exo 20:5 . Hij ziet op hetgeen Zofar gezegd had, boven, Job 20:10 ."},{"catchword":"hem","tekst":"Dat is, den boze zelf in zijn eigen persoon."},{"catchword":"vergeldt,","tekst":"Het Hebreeuwse woord betekent niet alleen de vergelding der weldadigheid voor een goede daad, gelijk Rth 1:7 ; 1Sa 24:20 , onder, Job 41:2 , maar ook de vergelding der straf voor een kwade daad, gelijk hier, en onder, vs.31; Jdg 1:7 ; 2Sa 3:39 ; Jer 32:18 ."}],"20":[{"catchword":"hij drinkt","tekst":"Dat is, hij krijgt de straf der gramschap Gods. De manier van spreken is daarvan genomen, omdat Gods wraak bij een drank vergeleken wordt. Zie Psa 75:9 ."}],"21":[{"catchword":"wat lust","tekst":"Hij wil zeggen: Geen; overmits de mensen, dood zijnde, geen kennis hebben van hetgeen hier beneden geschiedt. Vergelijk boven, Job 14:21 . Job bejegent hiermede degene, die op het voorgaande hadden mogen zeggen: Zo de bozen in hun eigen persoon in dit leven niet gestraft worden, tenminste worden immers hun kinderen na hun dood geplaagd; waarop Job antwoordt dat zulks den doden niet deert, die daarvan niet weten."},{"catchword":"als het getal","tekst":"Dat is, als de gezette tijd zijns levens geëindigd is."}],"22":[{"catchword":"wetenschap leren,","tekst":"Te weten, waardoor Hij behoefde te verstaan hoe Hij de wereld wijselijk en rechtvaardiglijk zou kunnen regeren. Job wil hiermede voorkomen degenen, die hadden mogen vragen hoe de gerechtigheid Gods lijden kan, dat de goddelozen hier zo zachtkens behandeld worden. Hij antwoordt dat God niemands onderwijs behoeft, zijnde zijn wil de opperste regel van al wat recht en goed is, en daarom zijn regering zowel rechtvaardig als onbegrijpelijk. Vergelijk Gen 18:25 ; boven, Job 8:3 , en Job 34:12 ; Rom 3:5-6 , en Rom 11:33-34 ."},{"catchword":"hogen","tekst":"Versta, de engelen en die in de wereld verheven zijn."},{"catchword":"richt?","tekst":"Dat is, regeert, of oordeelt."}],"23":[{"catchword":"Deze sterft","tekst":"Hij verklaart hoe wonderbaarlijk God den mens regeert."},{"catchword":"in de kracht","tekst":"Dat is, in het beste en hoogste zijns tijdelijken voorspoeds."}],"24":[{"catchword":"melkvaten","tekst":"Versta hierdoor allerlei overvloed van tijdelijke middelen."},{"catchword":"merg","tekst":"Versta, de gezondheid des lichaams; gelijk door de dorrigheid van het gebeente de kwade gestaltenis des lichaams, onder, Job 30:30 ; Psa 102:4 ."}],"25":[{"catchword":"met een bittere","tekst":"Dat is, zijnde in grote droefheid des harten. Vergelijk de aantekening 2Ki 4:27 ."},{"catchword":"goede","tekst":"Te weten, dezes tijdelijken levens, gelijk boven, vs.13. Zie de aantekening."},{"catchword":"gegeten","tekst":"Dat is, gebruikt, of genoten. Alzo is eten dikwijls voor krijgen en genieten in de Heilige Schrift genomen, niet alleen in het goede, Pro 13:2 ; Isa 1:19 , en Isa 55:1-2 , maar ook in het kwade; Pro 1:31 ."}],"26":[{"catchword":"te zamen","tekst":"Dat is, de een moet zowel als de ander sterven en verrotten in de aarde. Vergelijk Ecc 9:2-3 ."}],"27":[{"catchword":"Ziet,","tekst":"Job spreekt zijn vrienden toe, om de gedachten, die zij van zijn kinderen mochten hebben, voor te komen."},{"catchword":"boze verdichtselen,","tekst":"Het Hebreeuwse woord betekent wel in het algemeen allerlei gedachte, gelijk boven, Job 17:11 , maar ook in het bijzonder een boze gedachte, gelijk hier en Pro 12:2 , en Pro 14:17 , en Pro 24:8 ; Isa 32:7 ; somtijds betekent het ook een kloek en voorzichtig bedenken, gelijk Pro 1:4 , en Pro 3:21 ."}],"28":[{"catchword":"zeggen","tekst":"Te weten, in uw harten."},{"catchword":"het huis","tekst":"Sommigen verstaan het huis van Jobs oudsten zoon, hetwelk, dewijl het geruïneerd was, zijnde door een onweder omgeworpen geweest, boven, Job 1:19 , zo schijnt het dat de vrienden van Job daaruit besluiten wilden, dat die zoon een goddeloos mens geweest was. Anderen verstaan het in het algemeen."},{"catchword":"goddelozen?","tekst":"Hij spreekt in het veelvoudig getal, ziende op de andere kinderen van Job en op de huisgenoten van Jobs oudsten zoon, die mede daaronder vergaan zijn; of menende de woningen van andere goddelozen, die ooit geweest waren, onder welke zijne vrienden, Jobs zoon, als een dien zij denzelven gelijk mochten oordelen, schenen bedektelijk te verstaan."}],"29":[{"catchword":"gevraagd","tekst":"Te weten, hoe het gaat met de vromen en onvromen in deze wereld, alsof hij zeide: Indien gij dat gedaan hadt, gij zoudt de waarheid vernomen hebben van hetgeen ik nu zeggen zal. Zie vs.30."},{"catchword":"de voorbijgaanden","tekst":"Dat is, de reizende lieden, die gemeenlijk veel zien en horen, en daardoor veel ervarenheid en wetenschap van alles krijgen."},{"catchword":"tekenen niet?","tekst":"Versta, de omstandigheden van personen, tijden en plaatsen, dienende tot verzekering van hetgeen zij verhalen."}],"30":[{"catchword":"onttrokken","tekst":"Te weten, opdat de algemene plagen over hem niet komen, maar dat hij daarvan meer dan anderen verschoond blijve."},{"catchword":"dat zij","tekst":"Te weten, de bozen. Verandering des getals. Zie boven, vs.10. De zin is in het voorgaande lid."},{"catchword":"verbolgenheden","tekst":"Versta de straffen, die door Gods toorn over de zonden der mensen komen. Toorn, of gramschap, wordt dikwijls genomen voor de straf, die daaruit voortkomen. Zie Exo 15:7 ; Num 16:46 ; Psa 78:49 , en Psa 85:4 ; Lam 4:11 , enz."}],"31":[{"catchword":"hem","tekst":"Te weten, den goddeloze."},{"catchword":"weg","tekst":"Dat is, de manier, zo hij zijn leven aanstelt, om hem daarover te onderwijzen en te berispen. Zie Gen 6:12 ."},{"catchword":"wat doet,","tekst":"Te weten, wat kwaads."},{"catchword":"wie zal hem vergelden?","tekst":"Dat is, wie straft hem daarover? Want God laat hem hier voor het merendeel vrij gaan, en de mensen vrezen zijn geweld."}],"32":[{"catchword":"de graven","tekst":"Versta, een der graven. Zie 2Ki 22:20 ; of tot de plaats der graven. De zin is dat hij nog een eerlijke begrafenis krijgt. Vergelijk Luk 16:22-23 ."},{"catchword":"is gedurig","tekst":"Dat is, hij blijft in het graf als in een gemakkelijke slaapplaats liggende."}],"33":[{"catchword":"De kluiten","tekst":"De zin is, dat het graf hem een plaats is als naar zijn wens, zijnde daar met vrede zonder zorg, en zonder kennis van het kwaad, dat na zijn dood zijn kinderen zou mogen overkomen. De profeet spreekt van het dode lichaam als van een levenden persoon."},{"catchword":"trekt na","tekst":"De zin is, dat hij hen al heeft na hem volgende; want een ieder is gesteld eenmaal te sterven. Hierom, ten aanzien van den lichamelijken dood, wedervaart den bozen anders niet dan dat in het algemeen allen moet overkomen."},{"catchword":"voor hem","tekst":"Hebreeuws, voor zijn aangezicht; dat is, eer hij stierf is het getal oneindig geweest dergenen, die gestorven waren."}],"34":[{"catchword":"gij mij dan","tekst":"Te weten, gij mijn vrienden."},{"catchword":"overtreding","tekst":"Dat is, dewijl zij vals zijn en van geen waarde, en vol van vergrijping tegen God en tegen mij, uw naaste."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But Job answered and said:"}],"2":[{"catchword":null,"tekst":"Hearken, attentively [Heb. Hearing hear ye, or, hearkening, hearken] unto my speechs, and let this [viz. And holding of your peace and listening heedfully unto me] be your comfortings. [i.e. in stead of the comforts, which ye ought to administer unto me in this my sad disconsolate condition.]"}],"3":[{"catchword":null,"tekst":"Bear with me, and I will speak; and after that I shall have spoken (then) mock, [viz. Thou Zophar, who by thy hastiness didst break off my discourse before above chap.20.2. Job doth hold Zophars answer but for a mockery.]"}],"4":[{"catchword":null,"tekst":"Is my complaint (concerning my self) unto man? [He will say, no: but unto God rather, who onely saw his conscience, and was able to defend his innocency, men, as his friends, did nothing, but trouble and molest him.] yet if it were so [viz. That my complaint were addressed unto man,] why should not my spirit be vexed? [seeing men are so unkind unto me, that am is such misery; or straightened, distressed. Heb. Shortened. So, shortness of the Spirit, for distress and anguish of the spirit. Exo 6:8. of being vexed, See Jud.16.on v.16.]"}],"5":[{"catchword":null,"tekst":"Look upon me, and he abashed: [through the consideration of my great miseries.] and lay thy hand upon thy mouth. [viz. In sign of being silenced, through the terror which my suffering ought to excite you into. See of this kind of speaking Jud.18.on v.19. item bel.29.9. & 39.37. Pro 30:32.]"}],"6":[{"catchword":null,"tekst":"Yea, when I think (thereon) [viz. That I must suffer so much, being godly, and many thrive and fare so well that are wicked; as is expressed in the sequel.] then am I troubled, and my flesh laid hold on horror."}],"7":[{"catchword":null,"tekst":"Wherefore do the wicked live, grow old, and become mighty in substance?"}],"8":[{"catchword":null,"tekst":"Their seed [i.e. children, posterity. See Gen.9.on v.9. & Lev.21.on v.15. which in the sequel are called sproutings.] is stedfast with them before their face, and their sproutings [see ab.ch.5.on v.25.] are before their eyes."}],"9":[{"catchword":null,"tekst":"Their houses have peace [Heb. Their houses peace, i.e. have peace, or are in peace. See the like expression 2 Samuel 17.3. and the annotation. Peace, for prosperity and welfare. See Gen.37.on v.14.] without fear: and the rod of God is not upon them. [understand God doth not punish nor chastile them. See above ch.9.on v.34.]"}],"10":[{"catchword":null,"tekst":"His bull [The wicked namely, here is a change of the number; for in the three former verses he used the plural, speaking of the wicked, as also in the following verses 11,12,13. &c. But here the singular is taken. So Exo 34:15. and above chap.14.12, &c.] leapeth and misseth not, his cow calveth, and miscarrieth not.]"}],"11":[{"catchword":null,"tekst":"Their young children they [viz. The wicked] send forth like a flock: [viz. Of sheep, or, goats. See of Hebrew word, Genesis 12.on v.16. The meaning is, that they have many children, which do spread themselves all over the land, to the great comfort and delight of their parents.] and their children are skipping. [for outward pleasure and inward joy, as we see young cattle is wont to do, when they are grazing in fat, full and secured pastures.]"}],"12":[{"catchword":null,"tekst":"They lift up [viz. Their feet, or their voices.] with the drum and with the harp; and they rejoice at the sound of the Organs."}],"13":[{"catchword":null,"tekst":"They spend [or make old] their days in weal; [viz. That of this temporal life, as their state, authority, riches, ease and prosperity. So below v.25. Psal104.28. Pro 11:10. Ecc 6:3. Isa 1:19. &c.] and in a moment [i.e. on a sudden, without any long and grievous pains to torment them] do they descend into the grave."}],"14":[{"catchword":null,"tekst":"Nevertheless they say to God, [viz. Not so much with the mouth (for shame to utter it) as with the heart which is full of the contempt of Gods name. Compare Psa 14:1. and 36.2. Mal 3:14,15.] Turn from us; for we have no delight in the knowledge of thy ways. [See Gen.18.on v.19.]"}],"15":[{"catchword":null,"tekst":"What is the Almighty, that we should serve him? [See Exo 5:2. Malach.3.14.] and what advantage shall we get, to have recourse to him? [viz. By calling upon him, as Jer 7:16.]"}],"16":[{"catchword":null,"tekst":"Yet behold their weal is not in their hand; [i.e. their welfare or prosperity is not in their own power, but onely in the gratious blessing of the most high] the Counsel of the wicked is far from me. [i.e. their intents purposes and practises. Compare Deut.32.28. and above chap.10.3. and 18.7. Psal.1.1. Job speaketh here in his own behalf, and detesteth the vanity and wickedness of the unbelieving and ungodly, declaring that he is far from desiring to have any Communion with them.]"}],"17":[{"catchword":null,"tekst":"How often doth it come to pass [He meaneth not very often] that the lamp of the wicked [i.e. his welfare and prosperity. See above ch.18.ver.5.] is put out and that their destruction cometh upon them? That (God) doth distributed pains (unto them) in his anger? [He granteth indeed, that it happeneth sometimes with the wicked, so as Zophar had instanced, above chap.20.v.5. but denieth, that it is the usual and frequent course, much less a constant one. So likewise in the sequel.]"}],"18":[{"catchword":null,"tekst":"That they become like straw before the wind; [Compare below chap.27.21. Psa 1:4. & 35.5. Isa 17:13. etc 29.5. Hos 13:3.] and like chaff which the whirl-wind stealeth away?"}],"19":[{"catchword":null,"tekst":"That God layeth up his power for his children; [understand the power of the wicked man, that is to say, the punishment, which he deserved by the abuse of his power upon others. Layeth up, i.e. transferreth or with-holdeth the same to bestow it afterwards upon his children, which follow the foot steps of his wickedness; Exo 20:5. He reflecteth upon that, which Zephar had said above chap.20.10.] requireth [the Hebrew word signifieth not onely the requital of kindness for a benefit received, as Ruth.2.12. 1 Sam.24.20. below 41.2. but also the requital of punishment for evil deeds, as here and below v.31. and Jud.1 7. 2 Sam.3.39. Jer 32:18.] him [i.e. the wicked himself in his own person.] that he take notice of it?"}],"20":[{"catchword":null,"tekst":"That his eyes do see his destruction, and he doth drink of the indignation of the Almighty? [i.e. receive the punishment of Gods indignation; the manner of speaking is taken from this that Gods vengeance is compared to a cup or draught. See Psalm 75.on verse 9.]"}],"21":[{"catchword":null,"tekst":"For what pleasure should he have after himself in his house [he will say, none sure, in regard that men being dead once, have no knowledge of what happeneth here beneath. Compare above, chap.14.21. Job meets with these here, which might have said upon the former instance; Although the wicked be not punished, during this life, in their own persons, their children at leastwise are sure to be plagued after their death; whereupon Job replieth that can be no grief to the dead, which have no knowledge of any thing.] When the number of his months is cut off. [i.e. when the appointed time of his life is spent and ended.]"}],"22":[{"catchword":null,"tekst":"Shall men teach God knowledge; [viz. Whereby he might be instructed and come to understand how to govern the world wisely and righteously. Job here preventeth those which might demand, how it could stand with Gods justice, that the wicked should be so gently dealt withal; He answereth, that God doth need no mans instruction, his will being they Supreme rule and square of whatsoever is just and good, and that therefore his Government is altogether as just and righteous, as it is incomprehensible. Compare Gen 18:25. above 8.3. and 34.12. Rom 3:5,6. & 11.33.34.] where ( ekst":"For ye will say, [viz. In your hearts] where is the house of the Prince? [some do understand the house of Jobs eldest son here, which being ruined and overthrown by the tempestuous wind, above 1.19. it should seem Jobs friends concluded thence, that son had been a wicked man. Others understand it in a general sense.] and where is the Tent of the habitations of the wicked? [in the plural number, as seeming to speak of the rest of his children, and of the family and household of his eldest son, which perished all together, or, meaning the dwellings or habitations of other wicked people which had been at any time before, among whom Jobs friends seemed coverly to glaunce at his Son, as one whom they judged to have been of the same condition.]"}],"29":[{"catchword":null,"tekst":"Have ye not enquired [viz. How it fareth with the godly and with the godly in this world; as if he said; if ye had done so, ye would have been informed of the truth which I shall tell you now. See the next v.] of the passengers upon the way? [i.e. of the travellers, who commonly see and hear much, and thereby attain to much experience and knowledge of all things.] and know ye not their marks? [understand the circumstances of persons, times and places, serving for confirmation of the things they relate.]"}],"30":[{"catchword":null,"tekst":"That the evil (one) is withdrawn from the day of destruction; [viz. So that the common plagues come not upon him, but he is spared and favoured more than others.] (that they) [the wicked namely, or evil men. A permutation of the number, as above verse 10l;. The sense is in the former-member.] are carried off in the day of indignations. [understand the Judgements and plagues which by the wrath of God do seized on men. Wrath and indignation are frequently taken for the punishment which thereby is inflicted. See Exo 15:7. Num 16:46. Psa 78:49. and 85.4. Lament.4.11, &c.]"}],"31":[{"catchword":null,"tekst":"Who shall shew him [viz. The wicked,] his way, [i.e. // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
