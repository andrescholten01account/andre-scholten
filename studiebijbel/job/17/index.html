ouse:</span> I have <span class=\"wl wl-kjv\" data-code=\"H7502\">made</span> my <span class=\"wl wl-kjv\" data-code=\"H3326\">bed</span> in the darkness.","14":"I have <span class=\"wl wl-kjv\" data-code=\"H7121\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H7845\">corruption,</span> Thou art my <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> to the <span class=\"wl wl-kjv\" data-code=\"H7415\">worm,</span> Thou art my <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and my sister.","15":"And where is <span class=\"wl wl-kjv\" data-code=\"H645\">now</span> my <span class=\"wl wl-kjv\" data-code=\"H8615\">hope?</span> as for my <span class=\"wl wl-kjv\" data-code=\"H8615\">hope,</span> who shall see","16":"They shall go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H905\">bars</span> of the <span class=\"wl wl-kjv\" data-code=\"H7585\">pit,</span> when our <span class=\"wl wl-kjv\" data-code=\"H5183\">rest</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> is in the dust."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"geest","tekst":"Versta hier, door het woord geest de levenskrachten des mensen. Zie 1Ki 10:5 ."},{"catchword":"verdorven,","tekst":"Dat is, vergaan, verdaan en uitgeteerd. Anders, verzwakt, of wordt afgetrokken; te weten van het lichaam."},{"catchword":"mijn dagen","tekst":"Dat is, de dagen mijns levens zijn bijna ten einde gebracht. Hij vergelijkt zijn leven bij een licht, dat allengskens uitgaat."},{"catchword":"zijn voor mij","tekst":"Dat is, zij zijn gelijk als bereid voor mij, zodat er niets overig schijnt te wezen, dan dat ik sterf, zo gans is mijn leven gesmolten en uitgeteerd. Vergelijk Psa 88:4-6 ."}],"2":[{"catchword":"bespotters","tekst":"Versta, niet eigenlijk van zijn lijden, maar van zijn woorden; vergelijk onder, Job 21:3 . Anders, bespottingen; te weten, waarmede ik overhaald word."},{"catchword":"overnacht","tekst":"Dat is, zijn mijn gedachten niet zo bekommerd met de redenen, waarmede zij mij verbitteren, dat ik daarover mijn ogen des nachts openhoud en mijn slaap verlies? Hij geeft reden waarom de krachten zijns levens allengskens verdwenen."},{"catchword":"hunlieder","tekst":"Te weten, zijner vrienden, die hem bedroefden met hun verkeerd oordeel en bittere aanspraken."}],"3":[{"catchword":"Zet toch bij,","tekst":"Te weten, borgtocht of pand, Job keert zich tot God, wensende dat hij over het geschil, dat hij met zijn vrienden had, met God zou mogen pleiten, om zijn recht alzo voor Hem te verdedigen. Vergelijk boven, Job 16:21 ."},{"catchword":"stel mij","tekst":"Te weten, die van uwentwege beloven zal, dat Gij in het recht met mij zult treden, en vasthouden aan hetgeen billijk zal bevonden worden."},{"catchword":"in mijn hand","tekst":"Te weten, van den borg, tot verzekering van hetgeen hij voor u beloven zal. Dit was een manier van doen, gebruikelijk onder degenen, die in hun samenhandelingen elkander ter trouw wat beloven wilden. Zie Pro 6:1 , en Pro 11:15 , en Pro 17:18 , en Pro 22:26 ."}],"4":[{"catchword":"hun hart","tekst":"Anders: het verstand hebt gij voor hun hart verborgen. Hij spreekt van zijn vrienden, die hem onverstandiglijk troostten. Het hart van het verstand te versteken, of te verbergen, is zoveel als te maken dat het hart des mensen de ware wijsheid niet begrijpt."},{"catchword":"verhogen","tekst":"Te weten, om hun in dit geschil de overhand over mij te laten hebben, en nog veel min om mijn rechters te wezen, maar zult veel meer wederstaan en straffen."}],"5":[{"catchword":"Die","tekst":"Job schijnt hiermede voor te komen dat zijn vrienden hem hadden mogen tegenwerpen, aldus: Het schijnt dat gij ons versmaadt, omdat wij u bestraffen; wilt gij dan dat wij u pluimstrijken? Job antwoordt dat hij dat niet wil, omdat God een vijand is der vleiers; of hij dreigt hier zijn vrienden, omdat zij het recht Gods voorspraken, meer door aanzien van Gods persoon dan door een verstandig begrip van het recht der zaak, boven, Job 13:7 , ja ook omdat zij hem schenen te vleien, als zij hem wilden vertroosten met tijdelijken zegen zo hij zich kwam te bekeren; zie boven, Job 5:20-21 , enz., en Job 8:5 , enz. en Job 11:15-16 , enz."},{"catchword":"kinderen","tekst":"Dat is, niet alleen hij, maar ook zijn nakomelingen die door een rechtvaardig oordeel van God verlaten en gestraft worden."}],"6":[{"catchword":"Hij heeft","tekst":"Namelijk, God."},{"catchword":"tot","tekst":"Dat is, een straatmare, die van mij overal loopt, uit oorzaak van het verdriet en den smaad waarin ik lig."},{"catchword":"trommelslag","tekst":"Dat is, een algemeen tijdverdrijf en stof van schimp en spotterij."}],"7":[{"catchword":"mijn oog","tekst":"Hij wil zeggen dat de krachten zijner zinnen met de sterkte zijns lichaams en de gedaante van zijn aangezicht vergaan en verstorven waren. Vergelijk Psa 6:8 ."},{"catchword":"door verdriet","tekst":"Dat is, door de heftige beroering en ontstelling mijns gemoeds."},{"catchword":"ledematen","tekst":"Anders, gedichtselen."}],"8":[{"catchword":"hierover","tekst":"Te weten, omdat ik, vroom zijnde, nochtans zo vreeslijk gestraft word van God en snodelijk bespot van de mensen."},{"catchword":"huichelaar","tekst":"Zie boven, Job 8:13 ."},{"catchword":"opmaken;","tekst":"Te weten, om den huichelaar zijn kwaad gevoelen te wederstaan. Want hoewel de vromen zich ontstellen over den welstand der goddelozen en den tegenspoed der godvrezenden, nochtans laten zij niet de huichelaars te wederspreken, die daaruit valse besluiten maken om Gods voorzienigheid te loochenen en de godzaligheid te verachten."}],"9":[{"catchword":"zal zijn weg","tekst":"Dat is, van zijn vroomheid niet afwijken om den tegenspoed, die hem, of andere vromen, wedervaart. Aldus toont Job dat hij met zijn redenen de vreze Gods niet verminderde, of wegnam, gelijk Elifaz hem verweten had; boven, Job 15:4 ."},{"catchword":"die rein","tekst":"Dat is, die met de uiterlijke daad tegen de wet Gods niet misdoet. Zie Gen 20:5 . Hij maakt gewag van de uitwendige reinheid, als een bewijs en teken zijnde van de inwendige, waarvan zij niet mag afgescheiden wezen."},{"catchword":"zal in","tekst":"Hebreeuws, zal sterkte toedoen; dat is, in kracht of sterkte toenemen, groeiende meer en meer in het geloof, in de hoop, en hierdoor gewapend zijnde tegen allerlei kruis, verdriet en verachting der mensen."}],"10":[{"catchword":"gij allen,","tekst":"Hebreeuws, zijlieden allen. Alzo 1Ki 22:28 ; Mic 1:2 , enz. Het is een verandering der personen. Hij spreekt zijn vrienden toe, welken hij vermaant dat zij zich bekeren zouden van hun verkeerd gevoelen en kwaadspreken."},{"catchword":"komt nu;","tekst":"Te weten, om naar mijn woorden te luisteren, die u ware en vaste lering zullen voorhouden."}],"11":[{"catchword":"mijn gedachten,","tekst":"Te weten, die ik had van uit dit lijden weder te mogen opkomen en in mijn vorigen staat hersteld te worden."},{"catchword":"de bezittingen","tekst":"Dat is, welke gedachten mijn hart bezat als iemand zijn erve, waarin hij zich vermaakt."}],"12":[{"catchword":"zij","tekst":"Versta, zijn vrienden, die maakten dat hij des nachts niet kon rusten door het overleggen van hun redenen. Of versta, zijn voorgemelde gedachten van welke in vs.11 gesproken is. Vergelijk boven, Job 7:3-4 ."},{"catchword":"het licht","tekst":"Versta, het licht des daags, veroorzaakt door den opgang der zon. Alzo onder, Job 24:14 . Hierom wordt onder, Job 25:3 , en Job 31:26 , het woord licht voor de zon genomen. Zie daar de aantekening."},{"catchword":"is nabij","tekst":"Dat is, kort en haast vergaande."},{"catchword":"vanwege","tekst":"Dat is, uit oorzaak der ellende, die mij overkomen is. Zie Gen 15:12 . De zin is, dat de dag met der haast hem verdween, zonder vermaak of gemak daarin te hebben, en dat door het groot lijden, hetwelk hem van alle kanten benauwde."}],"13":[{"catchword":"Zo ik wacht,","tekst":"Te weten, op de verandering, waardoor ik voor dezen mijn ellendigen stand een zeer gelukzaligen hier beneden krijgen zou; gelijk gijlieden mij wijsmaken wilt. Hij ziet op hetgeen zij hem beloofd hadden van den uiterlijken welstand, dien hij in dit leven genieten zou. Zie boven, Job 8:5 , en Job 11:15-17 ."},{"catchword":"het graf","tekst":"Alsof hij zeide: Hoe zou ik hier op aarde nog hopen, gelukkig te zullen wezen; ik verwacht toch hier anders niet dan den dood, en vervolgens het graf voor mijn woning, enz. Vergelijk boven, vs.1."},{"catchword":"in de duisternis","tekst":"Dat is, in het graf; hetwelk ook een land der duisternis genaamd wordt, boven, Job 10:21 ."}],"14":[{"catchword":"Tot de groeve","tekst":"Dat is, ik zal in het graf en bij het gewormte in het kort wonen; gelijk de kinderen bij hun vader en moeder en andere maagschap plegen te wonen."}],"15":[{"catchword":"Waar","tekst":"Alsof hij zeide: Nergens. Alzo in het volgende: wie zal mijn verwachting aanschouwen? Niemand; het zijn vergeefse woorden, waarmede gij mij ophoudt."},{"catchword":"verwachting wezen?","tekst":"Dat is, de gelukzaligheid, die ik hier, naar ulieder zeggen, zou te verwachten hebben."}],"16":[{"catchword":"Zij zullen","tekst":"Te weten, de verwachting en het aanschouwen derzelve; of hij gebruikt het getal van vele om daaronder te begrijpen allerlei hoop en verwachting, die dit tegenwoordige leven aangaat."},{"catchword":"handbomen","tekst":"Dat is, met de baar, waarmede het dode lichaam ter aarde gedragen wordt. Anders, in het graf. Anders, tot de grendelen des grafs; dat is, in de macht en geweld des grafs."},{"catchword":"als er rust","tekst":"Of, aangezien [mijn] rust tezamen in het stof wezen zal; te weten, in het kort, of haastelijk; dat is, aangezien ik in het kort in het graf zal varen, en ik geen rust dan daar hebben zal."},{"catchword":"te zamen","tekst":"Te weten, met andere overleden mensen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"My Spirit [Understand here by the word Spirit the living powers and faculties of man. See 1 Kings 10.on v.5.] is wasted, [i.e. consumed, spent, and perished. Oth. Weakened, or pulled off, viz: from the body] my days are extinguished [i.e. the days of my life are brought neer to an end. He compareth his life to a light of a lamp or candle, that wasteth by degrees to nothing.] the graves are before me, [i.e. they are ready as it were, for me; so that there seemeth nothing to remain, but my dying, my life being thus melted away and utterly consumed. Compare Psa 88:4,5,6.]"}],"2":[{"catchword":null,"tekst":"Are not mockers by me, [understand, not properly mockers of his sufferings, but of his words and sayings, Compare below 21.3. Other. Mockings, namely whereby they taunt and abuse me.] and doth (not) mine eye lodge (all) night in their bitterness? [i.e. are not my thoughts, so troubled with the discourses wherewith they made my life bitter unto me, that they keep mine eyes open all the night, and make me loose my sleep? He sheweth the reason, why the powers and faculties of his life, did wear away and decay thus by degrees, viz. Because of his friends grieving him with their perverse judgement, and bitter invectives.]"}],"3":[{"catchword":null,"tekst":"Set down I pray, [viz. A pledge, or assurance. Job turneth himself to God, wishing that he might plead with God about that controversy, which he had with his friends, that so he might defend the right of his cause before himself. Compare above 16.21.] put me (in) a surety with thee: [viz. Who shall promise in thy behalf, that thou wilt enter into plea with me, and firmly stand to what shall be found right and equitable.] who shall he be? That my hand be struck into. [viz. By the Surety, in assurance of what he shall promise in thy behalf. This was an usual custom among such as in their dealings together, mutually pledge and engaged faith troth one to another. See Pro.6.1. & 11.15. 7 17.18.& 22.26.]"}],"4":[{"catchword":null,"tekst":"For thou haste hid their heart from prudent understanding: [Oth. Thou hast hid the understanding before their heart. He speaketh of his friends, which comforteth him with out understanding very indiscreetly. To cover, or hide the heart from the understanding is as much as to cause, that the heart shall not comprehend true wisdom.] therefore thou shalt not exalt them. [viz. To give them the upperhand of me in this quarrel, land much less yet, that they should be my Judges, but shalt rather oppose and punish them.]"}],"5":[{"catchword":null,"tekst":"He that telleth (ought) to friends with soothing, [Job, it seemeth, would prevent here, what his friends might object to him, saying, It appeareth that thou doest therefore contemn us, because we reprove thee; wilt thou then that we sooth and flatter thee? Job answereth, he doth desire no such thing, God being an enemy to flatters: or he threateneth his friends here; because they took upon them to maintain Gods cause, more for the respect to Gods person, then by a judicious apprehending of the matter it self. Above chap.13.7. and also because they seemed to flatter him (Job himself) by premising him temporal blessings if he did but repent. See above 5.20.21, &c. And 8.5, &c. And 11.15, 16, &c.] even his childrens eyes shall fail. [i.e. not onely himself, but his posterity also shall be forsaken and punished, by the just Judgement of God.]"}],"6":[{"catchword":null,"tekst":"But he [viz. God] hath set me for a By-word to the Nations: [i.e. a common tale and story, which is in every mans mouth, by reason of the trouble and reproach that lies upon me] so that I am drum-beating before (everyone) face. [i.e. a vulgar and obvious pastime every where, an object and matter of gazing, contempt and mockery.]"}],"7":[{"catchword":null,"tekst":"Therefore mine eye is made him [he will say, that the powers and faculties of his senses, together with the strength of his body, and the countenance of his face was much spent and mortified. Compare Psa 6:8.] through vexation. [i.e. by reason of the excessively trouble and distemper of my mind.] and all my members [Others imaginations] are like a shadow."}],"8":[{"catchword":null,"tekst":"The upright shall be abashed over this: [viz. That I, being godly, am nevertheless so fearfully punished of God, and so vilely contemned of men.] and the innocent shall rise up against the hypocrite. [See abov.chap.8.on v.13. Namely to resist and oppose him in his evil conceit. For, howbeit that the godly are amazed sometimes at the prosperity of the wicked, and the adversity of those that fear God; yet they forbear not to contradict and refute the hypocrites, which draw such false conclusions from thence, for the denying of Gods Providence, and the despising of all true Godliness.]"}],"9":[{"catchword":null,"tekst":"And the righteous shall keep his way: [i.e. not recede or slide back from godly practise, for any adversity, that befalleth himself or other godly people. Thus Job sheweth, that he did not lessen or diminish, much less take away the fear of God by his arguments as Eliphaz had upbraided him, above chap.15.4.] and he that is pure of hands, [i.e. he that doth not trespass against the Law of God by outward practise. See Gen.20.on verse 5. He maketh mention of the outward cleanness, the same being a proof and sign of the inward, from which it is inseparable.] shall increase in strength. [Heb. Shall add strength, i.e. increase and proceed in strength, growing daily more and more in faith and hope, and being armed and animated thereby against all manner of Crosses, Troubles, and contempt of men.]"}],"10":[{"catchword":null,"tekst":"But yet all of you, [Heb. They all, so likewise 1 Kings 22.28. Micha 1.2, &c. It is a permutation or change of the persons. He turneth his speech to his friends, whom he exhorteth to repent them of their perverse Judgement, and evil speaking.] turn again and come now. [viz. To harken untop my words, which shall hold forth true and solid doctrine to you.] for I find none wise among you."}],"11":[{"catchword":null,"tekst":"My days are passed by, my thoughts, [which I had of coming forth again out this misery, and being restored to my former condition] the possessions of my hearts, [i.e. which thoughts or cogitations my heart had in possession, and held them as dear and delightful as a man would do his inheritance.] are plucked up."}],"12":[{"catchword":null,"tekst":"The night they change into the day, [Understand his friends, who were the cause that he could take no rest by night, through the ruminating and examining of their arguings. Or, we may understand his foresaid thoughts, spoken of in the former verse. Compare above 7.verse 3. And 4.] the light [understand the light of the day, caused by the word light is taken for the Sun, below 25.3. and 31.26. See the annotation there.] is neer (the going down) [i.e. short, and almost spent.] by reason of the darkness. [i.e. by reason of the misery, that is come upon me. See Genesis 15.on verse 12. The sense is, that the day did hastily wear away with him, without having any ease, or refreshing in it; and that by reason of the great sufferings, which from all sides distressed and vexed him.]"}],"13":[{"catchword":null,"tekst":"If I wait, [viz. For a change of this my sad condition into a happy one here beneath yet; as ye would fain make me believe and hope for. He reflecteth upon that, which they had promised unto him, of the outward prosperity which he might enjoy yet in this life. See ab.ch.8.5. & 11.15,16,17.] the grave shall be my house: [as if he said; how shall I hope for an happiness here? I can expect nothing but death, and consequently my habitation in the grave, comp.ab.v.1.] I shall spread my bed in the darkness. [i.e. in the grave, which is likewise called a land of darkness, above ch.10.21.]"}],"14":[{"catchword":null,"tekst":"To the ditch I call, thou art my Father; to the worms, thou art my brother, and my Sister. [i.e. I shall shortly take up my abode in the grave, with and among the worms; even as children dwell with their father, mother and other kindred."}],"15":[{"catchword":null,"tekst":"Where then should my expectation be? [as if he said: sure no where, and so in the sequel, Who shall see, i.e. no man, no body shall, it is all but vain and idle talk, what ye do entertain, and feed me withal: by his expectation he meaneth the happiness which, according to their saying, he might yet expect and look for here] Yea mine expectation, who shall behold it."}],"16":[{"catchword":null,"tekst":"They shall descend [viz. Both the expecting and the beholding thereof: or, he useth the plural number here, thereby to comprise all manner of hope and expectation, concerning this life.] With the hand-bars of the grave, [i.e. with the Bear, wherewith the dead body, or corps is carried to the grave. Oth. Into the grave. Oth. To the grates of the grave. i.e. into the power and hold of the grave. [When there shall be rest together [viz. With other men] In the dust. [or, in regard (my) rest (all) together shall be in the dust, viz. Very shortly or, suddenly: that is to say, Seeing I shall go down into the grave; and enjoy no rest, but there.]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
// vanuit een rechtsklik-vertaalmenu (elders) kan de link ?vert=SV meegeven om

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
