 Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.","5":"Balkt ook de woudezel bij het jonge gras? Loeit de os bij zijn voeder?","6":"Wordt ook het onsmakelijke gegeten zonder zout? Is er smaak in het wit van de dooier?","7":"Mijn ziel weigert *uw woorden* aan te roeren; die zijn als mijn laffe voedsel.","8":"Och, of mijn begeerte kwam, en dat God mijn verwachting gaf;","9":"En dat het God beliefde, dat Hij mij verbrijzelde, Zijn hand losliet, en een einde met mij maakte!","10":"Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, *zo* Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.","11":"Wat is mijn kracht, dat ik hopen zou? Of welk is mijn einde, dat ik mijn leven verlengen zou?","12":"Is mijn kracht stenen kracht? Is mijn vlees staal?","13":"Is dan mijn hulp niet in mij, en is de wijsheid uit mij verdreven?","14":"Aan hem die versmolten is, zou van zijn vriend weldadigheid gebeuren; of hij zou de vreze van de Almachtige verlaten.","15":"Mijn broeders hebben trouweloos gehandeld als een beek; als de storting der beken gaan zij door;","16":"Die verdonkerd zijn van het ijs, *en* waarin de sneeuw zich verbergt.","17":"Ten tijde als zij van hitte vervlieten, worden zij uitgedelgd; als zij warm worden, verdwijnen zij uit haar plaats.","18":"De gangen van haar weg wenden zich ter zijde af; zij lopen op in het woeste, en vergaan.","19":"De reizigers van Thema zien ze, de wandelaars van Scheba wachten op haar.","20":"Zij worden beschaamd, omdat elkeen vertrouwde; als zij daartoe komen, zo worden zij schaamrood.","21":"Voorwaar, *zo* bent u *mij* nu niets geworden; u hebt de ontzetting gezien, en u hebt gevreesd.","22":"Heb ik gezegd: Brengt mij, en geeft geschenken voor mij van uw vermogen?","23":"Of bevrijdt mij van de hand van de verdrukker, en verlost mij van de hand van de tirannen?","24":"Leert mij, en ik zal zwijgen, en geeft mij te verstaan, waarin g der beken gaan zij door;","16":"Die verdonkerd zijn van het ijs, *en* in dewelke de sneeuw zich verbergt.","17":"Ten tijde, als zij van hitte vervlieten, worden zij uitgedelgd; als zij warm worden, verdwijnen zij uit haar plaats.","18":"De gangen haars wegs wenden zich ter zijde af; zij lopen op in het woeste, en vergaan.","19":"De reizigers van Thema zien ze, de wandelaars van Scheba wachten op haar.","20":"Zij worden beschaamd, omdat elkeen vertrouwde; als zij daartoe komen, zo worden zij schaamrood.","21":"Voorwaar, *alzo* zijt gijlieden *mij* nu niets geworden; gij hebt gezien de ontzetting, en gij hebt gevreesd.","22":"Heb ik gezegd: Brengt mij, en geeft geschenken voor mij van uw vermogen?","23":"Of bevrijdt mij van de hand des verdrukkers, en verlost mij van de hand der tirannen?","24":"Leert mij, en ik zal zwijgen, en geeft mij te verstaan, waarin ik gedwaald heb.","25":"O, hoe krachtig zijn de rechte redenen! Maar wat bestraft het bestraffen, *dat* van ulieden is?","26":"Zult gij, om te bestraffen, woorden bedenken, en zullen de redenen des mismoedigen voor wind zijn?","27":"Ook werpt gij u op een wees; en gij graaft tegen uw vriend.","28":"Maar nu, belieft het u, wendt u tot mij, en het zal voor ulieder aangezicht zijn, of ik liege.","29":"Keert toch weder, laat er geen onrecht wezen, ja, keert weder; nog zal mijn gerechtigheid daarin zijn.","30":"Zou onrecht op mijn tong wezen? Zou mijn gehemelte niet de ellenden te verstaan geven?"},"KJV":{"1":"But Job answered and said,","2":"Oh that my grief were throughly weighed, and my calamity laid in the balances together!","3":"For now it would be heavier than the sand of the sea: therefore my words are swallowed up.","4":"For the arrows of the Almighty *are* within me, the poison whereof drinketh up my spirit: the terrors of God do set themselves in array","5":"Doth the wild ass bray when he hath grass? or loweth the ox over his fodder?","6":"Can that which is unsavoury be eaten without salt? or is there *any* v\" data-code=\"H5307\">overwhelm</span> the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H3738\">dig</span> a pit for your friend.","28":"Now therefore be <span class=\"wl wl-kjv\" data-code=\"H2974\">content,</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">look</span> upon me; for it is <span class=\"wl wl-kjv\" data-code=\"H6440\">evident</span> unto you if I lie.","29":"<span class=\"wl wl-kjv\" data-code=\"H7725\">Return,</span> I pray you, let it not be <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity;</span> yea, return <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> my righteousness","30":"Is <span class=\"wl wl-kjv\" data-code=\"H3426\">there</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity</span> in my <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue?</span> cannot my <span class=\"wl wl-kjv\" data-code=\"H2441\">taste</span> <span class=\"wl wl-kjv\" data-code=\"H995\">discern</span> perverse things?"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"verdriet","tekst":"Of, mijn ontsteltenis, beroering en ongeduld veroorzaakt door mijn lijden."},{"catchword":"recht gewogen wierd,","tekst":"Of, nauw, scherpelijk. Hebreeuws, wegende gewogen worde; te weten, met iets dat zeer zwaar is, als het zand aan den oever der zee, waarvan in vs.3 gesproken wordt."},{"catchword":"ellende","tekst":"Of, pijn, torment, katijvigheid. Alzo onder, vs.30, en Job 30:13 ; Pro 19:13 ."},{"catchword":"ophief","tekst":"Hebreeuws, zij hieven op, of haalden op; dat is, dat men ophieve of ophaalde. Zie boven, Job 4:19 ."}],"3":[{"catchword":"nu zou het","tekst":"Te weten, mijn jammer en lijden."},{"catchword":"worden mijn","tekst":"Dat is, door de grootheid mijns lijdens kan ik mijn woorden niet ten volle noch naar behoren voortbrengen, om mijn ellendigen staat uit te drukken."}],"4":[{"catchword":"pijlen","tekst":"Versta, de kwalen en ellenden, die hem van God overkwamen en zeer geweldig waren. Die noemt hij pijlen, omdat zij hem haastelijk en buiten verwachting hadden getroffen, en scherp zijnde, zijn hart zeer diep hadden doorwond. Zie Deu 32:23 ; Psa 38:3 , en Psa 45:6 , en Psa 91:5 ."},{"catchword":"vurig","tekst":"Eenige volken plachten hun pijlen met vergif te bestrijken, hetwelk door het gehele lichaam, dat geschoten was, zich uitspruitende en indringende, zeer haastelijk al de krachten des levens verteerde. Daarom zijn door deze vergiftige pijlen te verstaan zulke plagen, die een zeker en snel verderf aanbrengen."},{"catchword":"de verschrikkingen Gods","tekst":"Dat is, geweldige en gruwzame plagen, waarmede mij God verschrikt. Alzo onder, Job 9:34 ; Psa 88:17 . Zie Gen 35:5 ."},{"catchword":"rusten zich","tekst":"Het Hebreeuwse woord is zoveel als zich in krijgsordening tegen iemand stellen, in welken zin het ook genomen wordt, Jer 50:9 . Het wordt van Petrus zeer wel uitgedrukt met het Griekse woord antitassesthia, 1Pe 5:5 ."}],"5":[{"catchword":"Ruchelt","tekst":"De zin is, zo ik geen oorzaak had om te klagen, en uw woorden, o Elifaz, mij een goed voedsel ter vertroosting waren, ik zou mijn klachten niet meer laten horen dan de woudezel zijn geschreeuw, en de os zijn loeien, als zij goed voeder voor zich hebben."}],"6":[{"catchword":"onsmakelijke","tekst":"Job vergelijk Elifaz' rede bij smakeloze spijs en bij het wit van een ei; verklarende alzo dat hij in zijn woorden geen smaak vond."},{"catchword":"zonder zout?","tekst":"Of, dat zonder zout is."},{"catchword":"dooiers?","tekst":"Dat is, dat om den dojer is."}],"7":[{"catchword":"roeren;","tekst":"Te weten, als een spijs om die te nuttigen. Hij blijft in de voorgaande gelijkenis, verklarende dat hij gans geen lust had tot hun woorden, om zich daarmede te vertroosten, maar dat hij daarvan een afkeer had als van een laffe, onaangename en walgelijke spijs. Anders, [wat] mijn ziel weigerde aan te roeren, dat is als mijn laffe spijs. De zin is, dat de zerigheid en de zweren, die hij door deze zijn bezoeking in anderen niet zou hebben willen aantasten, nu als zijn spijs waren, doch een onaangename spijs."},{"catchword":"laffe spijze","tekst":"Hebreeuws, als de ziekten, krankheden; [dat is, lafheden] mijns broods."}],"8":[{"catchword":"Och,","tekst":"Hebreeuws, wie zal geven? Een manier van wensen bij de Hebreën zeer gebruikelijk. Zie van dezelve ook onder, Job 11:5 , en Job 13:5 , en Job 14:13 , en Job 19:23 , en Job 23:3 , enz.; idem Exo 16:3 , Num 11:29 , en de aantekening."},{"catchword":"mijn verwachting","tekst":"Dat is, dat ik verwacht, te weten, den dood; gelijk in vs.9 verklaard wordt. Vergelijk boven, de aantekening Job 5:6 ."}],"9":[{"catchword":"hand","tekst":"Welke nu schijnt gebonden te wezen, dewijl hij dezelve niet gebruikt om mij te doden. Van de hand Gods vergelijk dat onder is, Job 13:21 ."},{"catchword":"einde","tekst":"Zo wordt het Hebreeuwse woord genomen, Isa 10:12 ; Lam 2:17 ; Zec 4:9 . Of, mij afsnede, of afhieuwe."}],"10":[{"catchword":"mij verkwikken","tekst":"Anders, terwijl, of hoewel ik brand van droefheid, en [God] niet spaart, of verschoont."},{"catchword":"Hij niet spaarde","tekst":"Dat is, indien God met mij een einde maakte en mij uit deze ellendige wereld wegnam."},{"catchword":"want ik heb","tekst":"Dat is, want ik heb het woord Gods en de heilige leer vrijmoediglijk beleden en met mijn ganse leven nagevolgd, zulks dat ik niet twijfelen zou van den lichamelijken dood over te gaan in het eeuwige leven."},{"catchword":"Heiligen","tekst":"Te weten, van God, wiens naam heilig, of die de Heilige is, Isa 57:15 ; want Hij alleen is volkomen heilig, ja de heiligheid zelve. Zie Lev 19:2 ."}],"11":[{"catchword":"dat ik hopen zou?","tekst":"Dat is, dat ik op enige uitkomst zou mogen hopen; alsof hij zeide: Mijn kracht is te klein om deze droevige ellende lang te kunnen dragen en wederom tot gezondheid te geraken, en ofschoon ik dit nog hopen kon, nochtans is het einde mijns levens zo ver niet, dat ik zou kunnen begeren veel langer te leven. Daarom bid ik u, o God, dat Gij mij uit de wereld wegneemt en van deze ellende verlost."},{"catchword":"leven verlengen zou?","tekst":"Hebreeuws, ziel. Zie Gen 19:17 , of begeerte. Zie Psa 27:12 . De zin is: Dat ik zou begeren mijn leven te verlengen. Vergelijk onder, Job 7:1 ."}],"13":[{"catchword":"hulp","tekst":"Dat is, mijn verantwoording, waardoor ik mij zou mogen helpen en verdedigen tegen het verkeerd oordeel, dat tegen mij gestreken wordt."},{"catchword":"wijsheid","tekst":"Of, deugdzaamheid, onnozelheid, vroomheid. Zie van de betekenis des Hebreeuwsen woords, boven, Job 5:12 . Anders, is het niet zo, dat mijn hulp niet in mij is? en het wezen of de kracht uit mij verdreven? verstaande dat Job hier vervolgt de kracht van zijn ellende, nietigheid en krachteloosheid."}],"14":[{"catchword":"versmolten is,","tekst":"Dat is, vergaan en uitgeteerd door tegenspoed en droefheid. De zin is, dat het recht der vriendschap vereist dat men zijn vriend, die verarmd, verdrukt en vernederd is, hulp zal bewijzen, en dat hij, die dat nalaat, de vreze Gods heeft verlaten. Anders hangen deze woorden aan vs.13 aldus: Is niet mijne verdediging bij mij? enz. tegen [hem] wiens weldadigheid gesmolten is aan zijn vriend, en [die] de vreze des Almachtigen heeft verlaten. Hij berispt Elifaz van onbeleefdheid, ontrouw en wreedheid tegen zijn vriend bewezen."},{"catchword":"zou van zijn vriend","tekst":"Dat is, behoorde. Anders, [zou] zijn vriend weldadigheid [bewijzen]."}],"15":[{"catchword":"broeders","tekst":"Namelijk, Elifaz, Bildad en Zofar."},{"catchword":"als een beek;","tekst":"Hij neemt een gelijkenis van de beken, welke in den winter, als zij vol zijn en bevriezen, het water, dat zij van den regen en sneeuw hebben, schijnen bij zich te willen houden, om dat in den zomer uit te geven, als zij nodiger zijn, en dan nochtans, door de grote hitte uitdrogende, de hoop er mensen bedriegen. Bij deze wateren vergelijkt Job zijn drie vrienden, omdat hij aan hen, toen hij hen niet grotelijks van doen had, vriendschap gevonden heeft, en scheen dezelve op andere tijden te mogen verwachten, maar daarna in de hitte van zijn tegenspoed weinig troost en hulp van hen heeft verkregen."}],"16":[{"catchword":"verdonkerd","tekst":"Of, bedekt; te weten, als met een rouwkleed overtrokken."}],"17":[{"catchword":"als zij warm","tekst":"De zin is, als zij door de hitte en de droogte des tijds ophouden te vloeien."},{"catchword":"verdwijnen zij","tekst":"Hebreeuws, worden uitgeblust."}],"18":[{"catchword":"haars wegs","tekst":"Dat is, van haar waterloop, of kanaal."},{"catchword":"lopen","tekst":"Anders, zij klimmen op tot niet en vergaan; wordende tot dampen, en alzo vernietigd."}],"19":[{"catchword":"reizigers","tekst":"Hebreeuws, paden. Versta door dezen de scharen en hopen der lieden, reizende op de gemene wegen en straatbanen. Vergelijk Gen 37:25 ; Jdg 5:6 ; idem onder, Job 31:32 ; Isa 21:13 . In de volle manier van spreken worden zij genaamd, die over weg gaan; Isa 33:8 ."},{"catchword":"Thema","tekst":"Zo wordt Arabië genoemd, omdat het bewoond was van de nakomelingen van Thema, den zoon van Ismaël, Gen 25:15 , die te onderscheiden is van Theman, een zoon van Ezau, naar welken Elifaz vernoemd wordt, Job 2:11 ."},{"catchword":"zien ze,","tekst":"Te weten, die stromen en beken, meenden, daarin water tot lafenis en verversing te vinden, maar werden bedrogen. Zien is hier iets met grote begeerte verlangen, gelijk Psa 34:6 , en Psa 92:12 ."},{"catchword":"wandelaars","tekst":"Hebreeuws, de wegen, of gangen. Vergelijk de voorgaande aantekening op het woord reizigers."},{"catchword":"Scheba","tekst":"Zie boven, Job 1:15 ."}],"20":[{"catchword":"elkeen","tekst":"Te weten, van de voormelde reizigers en wandelaars."},{"catchword":"vertrouwde;","tekst":"Te weten, op die stromen en beken, menende daarin water te vinden."},{"catchword":"daartoe","tekst":"Dat is, tot die beken."}],"21":[{"catchword":"alzo","tekst":"Dat is, gelijk die loze en uitgedroogde waterbeken den reizenden en vermoeiden lieden geen nut toebrengen, alzo doet gij mij ook niet. Het is de toepassing der voorgestelde gelijkenis."},{"catchword":"ontzetting,","tekst":"Te weten, die mij door dit lijden overkomen is."},{"catchword":"gij hebt gevreesd","tekst":"Te weten, de oordelen Gods tegen de goddelozen, valselijk gevoelende dat gij daarvan een exempel aan mij zaagt. Of, gij hebt gevreesd; te weten, dat ik u lastig zou zijn, gelijk in vs.22."}],"22":[{"catchword":"Brengt mij,","tekst":"Hij wil zeggen dat hij niet van zijn vrienden heeft begeerd, dat zij enige moeite of onkosten doen zouden om hem uit zijn lijden te helpen, hoewel den vrienden toestaat zich in zulk geval vanzelf naar hun vermogen te kwijten: overzulks dat zij te meer moesten genegen zijn om hem met enige vertroosting, die zonder kosten en grote moeite geschieden kon, bij te staan; zodat, dewijl zij niets deden, maar wel door de verkeerdheid huns oordeels het tegendeel, zij niet waren te ontschuldigen."}],"25":[{"catchword":"rechte redenen","tekst":"Hebreeuws, de woorden der richtigheid, of rechtzinnigheid; dat is, die oprecht en waar zijn. Vergelijk onder, Job 33:3 ; Ecc 12:10 ."},{"catchword":"wat bestraft","tekst":"Dat is, wat kracht heeft uw berisping om te berispen? Hij wil zeggen, gene."}],"26":[{"catchword":"Zult gij,","tekst":"Dat is, zult gij woorden opzoeken en verzinnen, opdat gij moogt bestraffen? Anders, zult gij om te bestraffen op woorden achtgeven? Dat is, wilt gij in het berispen van iemand, die zeer verdrukt en bedroefd is, zo nauw achtgeven op al zijn woorden, en zult gij zijn redenen van verantwoording voor niets achten? Anders, denkt gij woorden te bestraffen; en [houdt gij] voor wind de redenen des mismoedigen? Dat is, zijt gij vanzins blote woorden te achterhalen en te beknabbelen, en niet acht te geven op de zaak zelve, die ik tot mijn verantwoording voortbreng? Anders, denkt gij dat de woorden bestraffing zijn?"},{"catchword":"des mismoedigen","tekst":"Dat is, wiens moed en hoop, zoveel dit leven aangaat, door de zwaarheid des lijdens zeer neergestort is. Hij meent zichzelven."},{"catchword":"wind zijn?","tekst":"Dat is, voor een nietige en onwaardige zaak. Voor zodanige dingen, mitsgaders, die zeer ongestadig zijn en haast vergaande, is het woord wind genomen, onder, Job 7:7 , en Job 15:2 , en Job 16:3 ; Pro 11:29 ; Ecc 5:15 ; Hos 12:2 ; Eph 4:14 ."}],"27":[{"catchword":"wees;","tekst":"Zo noemt Job zichzelven omdat hij van aller mensen hulp verlaten was. Van zulke wezen mag men enigszins verstaan hetgeen de kerk Gods klaagt, Lam 5:3 ."},{"catchword":"graaft","tekst":"Te weten, een put, of kuil, waarin gij hem vangt. De manier van spreken vindt men vol Psa 57:7 ; Jer 18:20 , enz. Job beklaagt zich dat zijn vrienden hem door listige redenen zochten te verstrikken en te bezwaren. Doch dewijl het Hebreeuwse woord ook somtijds betekent maaltijd bereiden of houden, gelijk onder, Job 40:25 , en 2Ki 6:23 , zo wordt deze plaats van anderen overgezet: Gijlieden houdt maaltijd over uw vriend; dat is, gij zijt verblijd over zijn lijden. Graven zou hier ook kunnen genomen worden voor enig kwaad berokkenen of bedenken, gelijk Pro 16:27 ."}],"28":[{"catchword":"wendt u tot mij,","tekst":"Dat is, geeft acht op mijn redenen, en wilt dezelve naarstiglijk overwegen."},{"catchword":"het zal","tekst":"Dat is, het zal voor u openbaar zijn, en gijzelven zult daarvan getuigen en rechters mogen wezen. Anders, en [beziet] of ik voor u zal liegen."}],"29":[{"catchword":"Keert toch weder,","tekst":"Te weten, van uw onbillijke handeling tegen mij, en van de wrede twisting, waarmede gij tegen mij uitvaart."},{"catchword":"onrecht wezen,","tekst":"Te weten, bij u, mits zo kwalijk van mij te oordelen en tot mij onvriendelijk te spreken."},{"catchword":"daarin","tekst":"Te weten, indien gij afstand doet van zo verkeerdelijk te oordelen en beter achtgeeft op de redenen mijner verantwoording."},{"catchword":"zijn","tekst":"Dat is, blijken; te weten, indien gij afstand doet."}],"30":[{"catchword":"gehemelte","tekst":"Of, raak; dat is mond. Zou die niet de verkeerden kunnen oordelen en verklaren? Anderen verstaan door het gehemelte den zin en het verstand des mensen, waardoor het waarachtige van het valse en het goede van het kwade onderscheiden wordt, gelijk door het gehemelte des monds het zoete van het zure onderscheiden wordt."},{"catchword":"ellenden","tekst":"Dat is, de kwalen, pijnen en kwellingen, die mij zijn overkomen; gelijk boven, vs.2. Anders, verkeerdheden verstaan; dat is, zou mijn verstand niet kunnen oordelen wat verkeerd is of niet?"}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But Job answered and said:"}],"2":[{"catchword":null,"tekst":"Ah, that my vexation, [or , my distemper, trouble, and impatience, caused by my suffering] were rightly weighed, [or narrowly, accurately. Heb. Weighing weighed, viz. With something that is very weighty and heavy; so as is the sand on the sand on the Sea-shore, whereof spoken in the next verse.] and one (would) lift up that one would, or did lift up . See above chap. 4. On v. 19.] my misery [or, pain, torment, wretchedness. So below v. 30. And ch. 30. V. 13. Prov. 19. 13.] together in a balance."}],"3":[{"catchword":null,"tekst":"For it should [viz. My wo and suffering] be heavier now then the sand of the Seas: therefore my words are swallowed up [i.e. I am not able by reason of the greatness of my sufferings, to utter my words to the full, for the expressing of my miserable condition.]"}],"4":[{"catchword":null,"tekst":"For the Arrows of the Almighty are in me [understand the pains and anguishes, which came upon him from God, and were very violent. Those he calleth Arrows, forasmuch as they had seized on him very suddenly, when they were least expected, and were so sharp that they had pierced his heart quite thorough. See Deut 32. On v. 23. Psalm 38. V. 3. & 91. V. 5.] whose fiery venom drinketh up my spirit: [some nations used to dip their darts in venom; which spreading abroad, and piercing through, most suddenly consumed all the powers and vigour of life: Therefore by these arrows, we are to understand, such plagues as bring a very sure and sudden destruction with them.] the terrors of God [i.e. most violent and fearful plagues, whereby God doth terrify me. So below chap. 9. 24. Psal. 88. 17. See Gen. 35. On v. 5.] prepare themselves against me [the Hebrew word implyeth as much, as to set in battle-aray against one, in which sense it is likewise taken Jer. 5. 9. It is very well expressed of Peter, by the Greek word, antitassesthai, 1 Pet. 5. 5.]"}],"5":[{"catchword":null,"tekst":"Brayeth the wild-ass also by the young grass, loweth the Ox by his fodder! [the meaning is, If I had no cause to complain, and thy words, O Eliphaz, were a food of comfort unto me, I should no more cause my complaints to be heard, then the Wild-ass doth his braying, and the ox his lowing, when they have good fodder before them.]"}],"6":[{"catchword":null,"tekst":"Is also the unsavoury (meat) eaten [Job compareth Eliphaz his discourse to unsavoury meat, and the white of an egg; declaring thereby, that he found no relish in his words] without salt? [or, that is without salt] is there (a) taste in the white of the yolk? [i.e. which is about the yolk.]"}],"7":[{"catchword":null,"tekst":"My soul refuseth to touch (thy words): [viz. To feed on the same. He continueth the former similitude, declaring that the had no liking at all to such words, for to comfort himself by them; but that he loathed the same as unsavoury and loathsome meat. Oth. (that which) my soul refuseth to touch, is like to my unsavoury meat. The sense is, that the soreness, and the biles, which before his visitation he should have been loath to touch, they were now become as his meat, though of a most loathsome relish.] they are as my unsavoury food [Heb. As the diseases, sicknesses, (i.e. loathings) of my bread.]"}],"8":[{"catchword":null,"tekst":"Ah, that my desire came; [Heb. Who shall give? A kind of wishing very usual with the Hebrews; See likewise of the same, below chap. 11. 5. Et 13. 5. Et 14. 13. Et 19. 23. Et 23. 3. & c. Ite. Exod. 16. 3. Num. 11. 29. And the annot.] and that God gave mine expectation. [i.e. that which I do expect, death namely, as is declared in the next verse. Comp. Ab. Ch. 5. The annot. On v. 16.]"}],"9":[{"catchword":null,"tekst":"And that it pleased God, to crush me; to let loose his hand, [which seemeth now to be tied up, because he doth not make use of its to put me to death. Of the hand of God, compare that which is said below ch. 13. On v. 21.] and made an end with me. [So the Hebrew word is taken, Isa. 10. V. 12. Lam. 2. 17. Zach. 4. 9. Or did cut or hew me off.]"}],"10":[{"catchword":null,"tekst":"That should be my comfort yet, and should chear me in the Wo, (if) he spared not [i.e. if God made an utter end with me, and took me away out of this wretch-World, Other. Read thus; the while, or, howbeit I burn of heaviness, and (God) spareth not (or) favoureth not.] for I have not kept hidden the sayings of the Holy (one) [i.e. I have freely professed the word of God, and followed it all my life long: So that I should not doubt by my bodily death to pass over into the everlasting life. By the Holy (one) he manneth God, whose Name is Holy, or, who is the Holy one, Isa. 57. 15. For he alone is perfectly holy, yea, the Holiness itself, See Levit. 19. On v. 2.]"}],"11":[{"catchword":null,"tekst":"What is my power, that I should hope? Or which is my end that I should prolong my life? [i.e. that I should hope for any issue of this wretchedness, as if he should say. My power is too weak, to bear up long under this sad Misery, and to recover my former health again: and though I might hope for it; yet the end of my life is not so far off now, that I should desire to live much longer. Therefore I pray thee O God, that thou wouldest take me away out of this world, and so deliver me from the wretchedness. For the word Life, the Hebrew hath Soul. See Gen. 19. On v. 17. Or desire. See Psal. 27. On v. 12. He meaning is; that I should desire to prolong my life. Compare below ch. 7. On v. 1.]"}],"12":[{"catchword":null,"tekst":"Is my power (a) stony power? Is my flesh steel?"}],"13":[{"catchword":null,"tekst":"Is not my help then in me? [my help, i.e. my plea, or defence; whereby I may be able to help and defend my self, against the peverse Judgement, that is passed against me.] and is the wisdom expelled out of me? [or, the virtuousness, innocence, honesty. See of the signification of the Hebrew word, ab. Ch. 5. On v. 12. Oth. Is not so, that my help is not in me? Conceiving that Job here prosecutes the complaint of his misery, vileness and disability.]"}],"14":[{"catchword":null,"tekst":"On him that is melted (i.e. perished, and consumed, through adversity and grief of heart. The meaning is, that the right of friendship requireth, one should help and assist his friend: that is improverished, oppressed and brought low; and that he which neglecteth the same, hath forsaken the fear of God. Others make these words to cohere with the former verse in this manner, Is not my defence by me? & c. Against (him) whose kindness to his friend is melted, and (that) hath forsaken the fear of the Almighty. He taxeth Eliphaz of discretion, unfaithfulness, and cruelty towards his Friend.] kindness should be done by his friend: [i.e. ought to be done or showed. Oth. (should show) kindness to his friend.] or, he should forsake the fear of the Almighty."}],"15":[{"catchword":null,"tekst":"My brethren have dealt unfaithfully with me [he meaneth Eliphaz, Bildad and Zophar] as a brook: as the torrent of brooks do they pass away: [He taketh the comparison here of such brooks, as being full and frozen up in Winter, seem to promise, by their close keeping of the plenty of water, which they gathered from the rain and snow, that they intend to impart it forth again in Summer; when it shall be more useful and needful, and yet afterwards by reason of great droughts coming between, deceive men&acirc;&euro;&trade;s hopes and expectations. Unto such waters Job compareth his three Friends here; forasmuch as there had appeared some friendship in them while he stood not in much need thereof; whence he expected the more comfort against a time of need; but afterwards in the heat of his adversity, was able to get but little help and comfort from them.]"}],"16":[{"catchword":null,"tekst":"Which are darkened of the i.e., [or, covered, as it were with a mourning garment] (and) in the which the Snow doth hide itself."}],"17":[{"catchword":null,"tekst":"At the time when they dissolve [diffluent] from heat, they are destroyed: when they grow warm [the meaning is; When by the heat and drought of the season they cease to run.] they fade [Heb. Are extinguished] out of their place."}],"18":[{"catchword":null,"tekst":"The goings of their way [i.e. of their watercourse or channel] turn themselves aside: they run up into the wilderness and perish [otherwise: they rise up, or, ascend to nothing, and perish: turning into vapours, till they vanish altogether.]"}],"19":[{"catchword":null,"tekst":"The wayfaring (men) [Heb. The paths; understand hereby the companies and troops of passengers travelling along upon the roads or highways. Compare Gen. 37. 25. Judg. 5. 6. Item below ch. 31. On v. 32. Isa. 21. 13. In the full phrase they are called, those that pass over the way, Isa. 32. 8.] of Tema [thus Arabia is called, because inhabited by the postery of Tema the son of Ismael, Gen. 25. 14, 15. Who is to be distinguished from Teman a Son of Esau, of whom Eliphaz had his denomination ab. Ch. 2. 11.] See them: [those torrents and brooks namely, thinking to find water in them for to refresh themselves, but finding themselves deceived. To see, implieth here, greatly to desire, or long for a thing, as Psal. 34. 6. & 92. 12.] the walkers [Heb. The ways, or on goings, i.e. travellers. Compare th (function bouwHfdnav() {

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');

    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

  }

  }

    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];

    if (engels && engels.length) {

    if (!refs || !refs.length) return '';

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
