ht met U.","4":"Wie kan een reine geven uit een onreine? Niemand.","5":"Omdat zijn dagen bepaald zijn, het aantal van zijn maanden bij U bekend is, en U zijn grenzen gesteld hebt, die hij niet zal overschrijden;","6":"Wend U van hem af, zodat hij rust heeft, totdat hij als een dagloner een welgevallen heeft aan zijn dag.","7":"Want voor een boom is er, als hij wordt omgehakt, nog verwachting dat hij opnieuw zal uitlopen, en dat zijn scheut niet zal ophouden.","8":"Al wordt zijn wortel in de aarde oud, en sterft zijn stam weg in het stof;","9":"Toch zal hij door de geur van het water opnieuw uitspruiten, en een tak maken, zoals een jonge plant.","10":"Maar een man sterft als hij is verzwakt, en de mens geeft de geest, waar is hij dan?","11":"Het water verdwijnt uit een meer, en een rivier droogt uit en verdort;","12":"Zo ligt de mens neer, en staat niet meer op; totdat de hemelen er niet meer zijn, zullen zij niet ontwaken, noch uit hun slaap opgewekt worden.","13":"Och, wilde U mij toch in het graf verbergen, mij verstoppen, totdat Uw toorn zich afkeerde; dat U mij een vaste tijd stelde, en aan mij zou denken!","14":"Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.","15":"Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.","16":"Maar nu telt U mijn stappen; U let *toch wel* op vanwege mijn zonden?","17":"Mijn overtreding is in een bundeltje verzegeld, en U pakt mijn ongerechtigheid opeen.","18":"En voorwaar, een berg die valt vergaat, en een rots wordt van zijn plaats gehaald;","19":"Het water vermaalt de stenen, het stof van de aarde overspoelt het gewas dat er zelf uit voortkomt; zo verderft U de verwachting van de mens.","20":"U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg.","21":"Zijn kinderen komen tot eer, en hij weet het niet; of zij worden klein, en hij merkt het niet aan hen.","22":"Maar zijn vlees, dat nog aan hem is, heeft smart; en zijn ziel, die nog in hem is, heeft rouw."},"SV":{"1":"De mens, van een vrouw geboren, is kort van dagen, en zat van onrust.","2":"Hij komt voort als een bloem, en wordt afgesneden; ook vlucht hij als een schaduw, en bestaat niet.","3":"Nog doet Gij Uw ogen over zulk een open; en Gij betrekt mij in het gericht met U.","4":"Wie zal een reine geven uit den onreine? Niet een.","5":"Dewijl zijn dagen bestemd zijn, het getal zijner maanden bij U is, *en* Gij zijn bepalingen gemaakt hebt, die hij niet overgaan zal;","6":"Wend U van hem af, dat hij rust hebbe, totdat hij als een dagloner aan zijn dag een welgevallen hebbe.","7":"Want voor een boom, als hij afgehouwen wordt, is er verwachting, dat hij zich nog zal veranderen, en zijn scheut niet zal ophouden.","8":"Indien zijn wortel in de aarde veroudert, en zijn stam in het stof versterft;","9":"Hij zal van den reuk der wateren *weder* uitspruiten, en zal een tak maken, gelijk een plant.","10":"Maar een man sterft, als hij verzwakt is, en de mens geeft den geest, waar is hij dan?","11":"De wateren verlopen uit een meer, en een rivier droogt uit en verdort;","12":"Alzo ligt de mens neder, en staat niet op; totdat de hemelen niet meer zijn, zullen zij niet opwaken, noch uit hun slaap opgewekt worden.","13":"Och, of Gij mij in het graf verstaakt, mij verborgt, totdat Uw toorn zich afkeerde; dat Gij mij een bepaling steldet, en mijner gedachtig waart!","14":"Als een man gestorven is, zal hij weder leven? Ik zou al de dagen mijns strijds hopen, totdat mijn verandering komen zou.","15":"Dat Gij zoudt roepen, en ik U zou antwoorden, dat Gij tot het werk Uwer handen zoudt begerig zijn.","16":"Maar nu telt Gij mijn treden; Gij bewaart *mij* niet om mijner zonden wil.","17":"Mijn overtreding is in een bundeltje verzegeld, en Gij pakt mijn ongerechtigheid opeen.","18":"En voorwaar, een berg vallende vergaat, en een rots wordt versteld uit haar plaats;","19":"De wateren vermalen de stenen, het stof der aarde overstelpt het gewas, dat van zelf daaruit voortkomt; alzo verderft Gij de verwachting des mensen.","20":"Gij overweldigt hem in eeuwigheid, en hij gaat heen; veranderende zijn gelaat, zo zendt Gij hem weg.","21":"Zijn kinderen komen tot eer, en hij weet het niet; of zij worden klein, en hij let niet op hen.","22":"Maar zijn vlees, *nog* aan hem zijnde, heeft smart; en zijn ziel, in hem zijnde, heeft rouw."},"KJV":{"1":"Man *that is* born of a woman *is* of few days, and full of trouble.","2":"He cometh forth like a flower, and is cut down: he fleeth also as a shadow, and continueth","3":"And dost thou open thine eyes upon such an one, and bringest me into judgment","4":"Who can bring a clean *thing* out of an unclean? not one.","5":"Seeing his days *are* determined, the number of his months *are* with thee, thou hast appointed his bounds that he cannot pass;","6":"Turn from him, that he may rest, till he shall accomplish, as an hireling, his day.","7":"For there is hope of a tree, if it be cut down, that it will sprout again, and that the tender branch thereof will not cease.","8":"Though the root thereof wax old in the earth, and the stock thereof die in the ground;","9":"*Yet* through the scent of water it will bud, and bring forth boughs like a plant.","10":"But man dieth, and wasteth away: yea, man giveth up the ghost,","11":"*As* the waters fail from the sea, and the flood decayeth and drieth up:","12":"So man lieth down, and riseth not: till the heavens *be* no more, they shall not awake, nor be raised out of their sleep.","13":"O that thou wouldest hide me in the grave, that thou wouldest keep me secret, until thy wrath be past, that thou wouldest appoint me a set time, and remember","14":"If a man die, shall he live *again*? all the days of my appointed time will I wait, till my change come.","15":"Thou shalt call, and I will answer thee: thou wilt have a desire to the work of thine hands.","16":"For now thou numberest my steps: dost thou not watch over my sin?","17":"My transgression *is* sealed up in a bag, and thou sewest up mine iniquity.","18":"And surely the mountain falling cometh to nought, and the rock is removed out of his place.","19":"The waters wear the stones: thou washest away the things which grow *out* of the dust of the earth; and thou destroyest the hope of man.","20":"Thou prevailest for ever against him, and he passeth: thou changest his countenance, and sendest him away.","21":"His sons come to honour, and he knoweth *it* not; and they are brought low, but he perceiveth","22":"But his flesh upon him shall have pain, and his soul within him shall mourn."}},"tsk":{"1":[{"kopje":"geboren","refs":["Job 15:14","Job 25:4","Ps 51:7","Matt 11:11"]},{"kopje":"kort","refs":["Job 7:1","Job 7:6","Job 9:25","Gen 47:9","Ps 39:6"]},{"kopje":"vol","refs":["Job 5:7","Pred 2:17","Pred 2:23"]}],"2":[{"kopje":"als","refs":["Ps 90:5-9","Ps 92:8","Ps 92:13","Ps 103:15","Ps 103:16","Jes 40:6-8","Jak 1:10","Jak 1:11","Jak 4:14","1 Petr 1:24"]},{"kopje":"vlucht","refs":["Job 8:9","Job 9:25","Job 9:26","1 Kron 29:15","Ps 102:12","Ps 144:4","Pred 8:13"]}],"3":[{"kopje":"Toch houdt U","refs":["Job 7:17","Job 7:18","Job 13:25","Ps 144:3"]},{"kopje":"betrekt mij","refs":["Job 9:19","Job 9:20","Job 9:32","Job 13:27","Ps 143:2","Rom 3:19"]}],"4":[{"kopje":"Wie kan geven","refs":["Job 15:14","Job 25:4-6","Gen 5:3","Ps 51:7","Ps 90:5","Joh 3:6","Rom 5:12","Rom 8:8","Rom 8:9","Ef 2:3"]},{"kopje":"een reine","refs":["Luk 1:35"]}],"5":[{"kopje":"zijn dagen","refs":["Job 14:14","Job 7:1","Job 12:10","Ps 39:5","Dan 5:26","Dan 5:30","Dan 9:24","Dan 11:36","Luk 12:20","Hand 17:26","Hebr 9:27"]},{"kopje":"het aantal","refs":["Job 21:21"]},{"kopje":"U hebt","refs":["Job 23:13","Job 23:14","Ps 104:9","Ps 104:29","Dan 4:35","Openb 1:18","Openb 3:7"]}],"6":[{"kopje":"Wend U","refs":["Job 7:16","Job 7:19","Job 10:20","Ps 39:14"]},{"kopje":"als een dagloner","refs":["Job 7:1","Job 7:2","Matt 20:1-8"]}],"7":[{"kopje":"zal uitlopen", an> like a plant.","10":"But <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth,</span> and wasteth <span class=\"wl wl-kjv\" data-code=\"H2522\">away:</span> yea, <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> giveth up the ghost,","11":"As the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H235\">fail</span> from the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5104\">flood</span> <span class=\"wl wl-kjv\" data-code=\"H2717\">decayeth</span> and drieth up:","12":"So <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> lieth <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H6965\">riseth</span> not: till the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> be no <span class=\"wl wl-kjv\" data-code=\"H1115\">more,</span> they shall not <span class=\"wl wl-kjv\" data-code=\"H6974\">awake,</span> nor be raised <span class=\"wl wl-kjv\" data-code=\"H5782\">out</span> of their sleep.","13":"O <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> thou wouldest <span class=\"wl wl-kjv\" data-code=\"H6845\">hide</span> me in the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave,</span> that thou wouldest keep me <span class=\"wl wl-kjv\" data-code=\"H5641\">secret,</span> until thy <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> be <span class=\"wl wl-kjv\" data-code=\"H7725\">past,</span> that thou wouldest <span class=\"wl wl-kjv\" data-code=\"H7896\">appoint</span> me a set <span class=\"wl wl-kjv\" data-code=\"H2706\">time,</span> and remember","14":"If a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> shall he <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> again? all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of my appointed <span class=\"wl wl-kjv\" data-code=\"H6635\">time</span> will I <span class=\"wl wl-kjv\" data-code=\"H3176\">wait,</span> till my <span class=\"wl wl-kjv\" data-code=\"H2487\">change</span> come.","15":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H7121\">call,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> thee: thou wilt have a <span class=\"wl wl-kjv\" data-code=\"H3700\">desire</span> to the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of thine hands.","16":"For now thou <span class=\"wl wl-kjv\" data-code=\"H5608\">numberest</span> my <span class=\"wl wl-kjv\" data-code=\"H6806\">steps:</span> dost thou not <span class=\"wl wl-kjv\" data-code=\"H8104\">watch</span> over my sin?","17":"My <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression</span> is sealed <span class=\"wl wl-kjv\" data-code=\"H2856\">up</span> in a <span class=\"wl wl-kjv\" data-code=\"H6872\">bag,</span> and thou sewest <span class=\"wl wl-kjv\" data-code=\"H2950\">up</span> mine iniquity.","18":"And <span class=\"wl wl-kjv\" data-code=\"H199\">surely</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">falling</span> cometh to <span class=\"wl wl-kjv\" data-code=\"H5034\">nought,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> is <span class=\"wl wl-kjv\" data-code=\"H6275\">removed</span> out of his place.","19":"The <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H7833\">wear</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stones:</span> thou washest <span class=\"wl wl-kjv\" data-code=\"H7857\">away</span> the things which <span class=\"wl wl-kjv\" data-code=\"H5599\">grow</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and thou <span class=\"wl wl-kjv\" data-code=\"H6\">destroyest</span> the <span class=\"wl wl-kjv\" data-code=\"H8615\">hope</span> of man.","20":"Thou <span class=\"wl wl-kjv\" data-code=\"H8630\">prevailest</span> for <span class=\"wl wl-kjv\" data-code=\"H5331\">ever</span> against him, and he <span class=\"wl wl-kjv\" data-code=\"H1980\">passeth:</span> thou <span class=\"wl wl-kjv\" data-code=\"H8138\">changest</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance,</span> and sendest him away.","21":"His <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> come to <span class=\"wl wl-kjv\" data-code=\"H3513\">honour,</span> and he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> it not; and they are brought <span class=\"wl wl-kjv\" data-code=\"H6819\">low,</span> but he perceiveth","22":"But his <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> upon him shall have <span class=\"wl wl-kjv\" data-code=\"H3510\">pain,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> within him shall mourn."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"kort van dagen,","tekst":"Dat is, heeft een kort leven. Alzo is langheid van dagen een lang leven. Zie Pro 3:2 , en de aantekening."},{"catchword":"onrust","tekst":"Hebreeuws, beroering; dat is, vol van beroering, woeling, verdriet en kwelling, die hem doorgaans overkomen vanwege de ellenden dezes levens; vergelijk Ecc 2:23 . Zie gelijke manier van spreken boven, Job 7:4 , en de aantekening."}],"3":[{"catchword":"over zulk een","tekst":"Te weten, die zo ellendig is. Want de mens schijnt in zichzelven te onwaardig en te verachtelijk te zijn, dat God, in zulke hoge majesteit zijnde, zich zozeer met hem zou willen bemoeien, veelmin zodanig geweld tegen hem aanleggen, om hem met zijn straffen zodanig te overvallen."},{"catchword":"betrekt","tekst":"Hebreeuws, brengt mij, of doet mij komen."}],"4":[{"catchword":"Niet een","tekst":"Dat is, niemand kan een mens bekomen, die zuiver en zonder zonde, naar den algemenen loop der natuur, uit een zondigen mens geboren is. Zo bekent hij dat hij mede onrein en zondig was, wensende dat God hem niet minder dan andere boetvaardige zondaren, genadig wilde wezen en hem niet meer dan anderen straffen."}],"5":[{"catchword":"zijn dagen","tekst":"Dat is, de tijd zijns levens. Alzo Gen 5:4-5 , en Gen 11:32 , enz. Vergelijk boven, vs.1, en de aantekening. In denzelfden zin worden straks zijn maanden genoemd. Alzo noemt hij onder, Job 29:2 , den voorgaanden tijd zijns levens, vorige maanden."},{"catchword":"bepalingen","tekst":"Te weten, van den voortgang en het einde zijns levens."}],"6":[{"catchword":"van hem af,","tekst":"Te weten, van hem dus te straffen."},{"catchword":"rust hebbe,","tekst":"Of, ophoude; te weten, van treuren, om zijner grote smarten wil. Anders, totdat hij ophoudt; te weten, van leven, gelijk het Hebreeuwse woord zo genomen wordt, Deu 15:11 ."},{"catchword":"als een","tekst":"Hij vergelijkt zich bij een arbeider, die voor een dag of zekeren bestemden tijd gehuurd is; overmits de mensen hier voor een tijd, die van God verordend is, gesteld zijn om den arbeid hunner beroeping met den dood af te doen."},{"catchword":"zijn dag","tekst":"Te weten, den dag zijns stervens, gelijk onder, Job 15:32 . Dat is, totdat hij dezes levens zat zijnde, wensen zou te sterven en in de eeuwige rust te wezen; gelijk een huurling, die moede gearbeid is, met een zonderling welgevallen het loon des arbeids en de rust des nachts begeert. Anders, zijn dag afdoe; dat is, zijn leven eindige. Alzo zou hij den tijd zijns levens noemen een dag, gelijk boven, vs.1, 5, dagen; en dat uit oorzaak van de kortheid van hetzelve; in welken zin de mensen ook van de Grieken genaamd worden hemerioi; dat is, dagelijkse. Anders kan het woord dag hier ook genomen worden voor een dagwerk, of het werk van zekeren bestemden tijd; of van het einde van den dag, des dagloners, wanneer hij komt tot rust van zijn arbeid, en zijn loon ontvangt."}],"7":[{"catchword":"Want","tekst":"De zin is dat een boom, afgehouwen zijnde, nog uitspruiten mag; maar dat een mens, door vele plagen nedergeveld en gedood zijnde, niet weder tot het gebruik en de genieting dezes levens kan geraken; vervolgens dat het ten dezen aanzien met den mens ellendiger dan met de bomen gesteld is. Hetwelk hij verhaalt om God tot barmhartigheid te bewegen, opdat Hij hem in dit leven nog enige rust zou laten. Vergelijk dit met boven, Job 7:7-8 , enz."},{"catchword":"voor een boom,","tekst":"Of, een boom heeft verwachting; dat is, hoop, enz. Den bomen en anderen planten worden gemoedsbewegingen, zinnen, verstand en spraak oneigenlijk en bij gelijkenis toegeschreven, gelijk ook den creaturen, die zelfs het groeiende leven in zich niet hebben, als afgrond, zee, stenen, aarde, enz., om de materie kracht, klaarheid en luister toe te brengen, en den lezer tot meerdere aandachtigheid op te scherpen. Zie Jdg 9:8 , en de aantekening. Idem, hier in vs.9, alwaar den boom reuk toegeschreven wordt. Zie ook onder, Job 28:14 , Job 28:22 , en Job 31:38 ."},{"catchword":"veranderen,","tekst":"Dat is, vernieuwen."}],"9":[{"catchword":"Hij zal","tekst":"Te weten, door vochtigheid die hij uit de aarde zuigt, verkwikt en in den groei gekomen zijnde."},{"catchword":"een plant","tekst":"Dat is, niet min of meer, dan alsof hij de wortel van een jongen stam ware."}],"10":[{"catchword":"als hij verzwakt","tekst":"Anders, en wordt uitgeroeid, of gedempt. Of, maar als een man sterft, hij wordt uitgeroeid. Het Hebreeuwse woord wordt aldus genomen Exo 17:13 ."},{"catchword":"waar is hij dan?","tekst":"Te weten, in dit aardse leven te vinden, alsof hij zeide: Het is hier uit met hem, en daar is geen ommezien voor hem in dit leven. Zie boven, Job 7:8-9 ."}],"11":[{"catchword":"De wateren","tekst":"De zin is: Gelijk de wateren, die van hun plaats in een andere afgelaten worden, niet wederkeren tot de voorgaande, alzo de ziel des mensen, als zij uit het lichaam gescheiden is, keert daarin niet wederom, te weten om hier op de aarde wederom te leven. Anders: Verlopen de wateren uit de zee; en droogt een rivier uit en verdort zij? vs.12. Maar de mens ligt, enz."}],"12":[{"catchword":"ligt de mens","tekst":"Dat is, sterft; want de dood wordt hier vergeleken bij het nederliggen om te slapen; zie hiervan Deu 31:16 ."},{"catchword":"en staat niet op;","tekst":"Te weten, om in dit aardse en vergankelijke leven weder te komen."},{"catchword":"totdat","tekst":"Dat is, totdat de hemelen met een sterk gedruis zullen voorbij gaan, 2Pe 3:10 , en de eerste hemel en de eerste aarde vergaan, Rev 21:1 ; want de opstanding uit de doden zal dan eerst geschieden."}],"13":[{"catchword":"Och,","tekst":"Hebreeuws, wie zal geven dat gij, enz. Zie boven, Job 6:8 ."},{"catchword":"Gij mij","tekst":"Hij spreekt God toe, veroorzaakt zijnde door het overgroot en diep gevoel zijns lijdens."},{"catchword":"in het graf","tekst":"Dat is, maakte dat ik voor een tijdlang dood en begraven ware, opdat hier intussen uw toorn, die nu gans zeer tegen mij ontstoken is, voorbijgaan mocht, en daarna uit het graf weder opstaan, om hier tot uw eer en der mensen onderwijzing nog voor een tijd in rust te leven."},{"catchword":"een bepaling","tekst":"Dat is, een bestemden tijd, welken ik in het graf zou moeten blijven."},{"catchword":"gedachtig waart","tekst":"Te weten, om door de opwekking mijns lichaams een nieuwe weldaad aan mij te bewijzen. Hoe God de gedachtenis toegeschreven wordt, zie Gen 8:1 ."}],"14":[{"catchword":"Als een man","tekst":"Job voegt deze tegenstelling hier in, om te tonen dat hij zulke opwekking tot een aards en vergankelijk leven niet geloofde of verwachtte; want deze manier van ondervragen loochent sterkelijk. Zie Gen 18:17 ."},{"catchword":"Ik zou","tekst":"Te weten, indien het zo ware dat een mens weder levend kon worden."},{"catchword":"al de dagen","tekst":"Versta, den gansen tijd in welken het Gode believen zal mij in dit leven op aarde aldus te bezoeken."},{"catchword":"strijds","tekst":"Zie van dit woord boven, Job 7:1 , en vergelijk boven, vs.5, en de aantekening op het woord bepalingen."},{"catchword":"hopen,","tekst":"Te weten, zo Gij mij maar voor een zekeren tijd in het graf verbergdet, om mij daarna weder daaruit te trekken tot een vreedzame genieting van dit aardse leven."},{"catchword":"verandering","tekst":"Dat is, mijn wederopstanding tot een nieuw aards leven."}],"15":[{"catchword":"roepen,","tekst":"Te weten, om mij uit het graf, waarin ik tot den dag mijner verandering zou gelegen hebben, weder op te wekken."},{"catchword":"antwoorden,","tekst":"Dat is, uw roepende stem gehoorzamen, mits uit het graf te komen."},{"catchword":"het werk","tekst":"Zo noemt hij zichzelven. Zie boven, Job 10:8 ; Psa 119:73 ."},{"catchword":"begerig zijn","tekst":"Dat is, Gij zoudt dat genadiglijk ontvangen en daarom weldadigheid bewijzen."}],"16":[{"catchword":"Maar nu","tekst":"Alsof hij zeide: Ik wenste vergeefs voor een tijd in het graf te rusten, overmits Gij voorgenomen hebt mij om mijn zonden, die Gij zeer nauw waarneemt, zeer zwaarlijk in dit leven te straffen. Vergelijk onder, Job 33:11 ."},{"catchword":"telt Gij","tekst":"De treden, of de gangen des mensen te tellen, heet niet alleen die te aanschouwen, maar ook waar te nemen en acht daarop te geven, om die, òf te bezorgen en te zegenen, Psa 56:9 , òf te straffen, gelijk hier. Zie onder, Job 31:4 ."},{"catchword":"treden;","tekst":"Dat is, al het voornemen, doen en laten mijns levens, hoe klein het ook zij. Alzo onder, Job 31:4 , en Job 34:21 ; Pro 16:9 ; Jer 10:23 ."},{"catchword":"Gij bewaart","tekst":"Dat is, Gij draagt geen zorg voor mijn welstand, maar zoekt mij te verdrukkenen te verdoen, tot zulk een einde al mijn zonden U voorstellende. Anders, houdt Gij niet wacht over mijn zonde? Dat is, hebt Gij niet grote achting op mijn zonde, om mij daarover te straffen? Of, Gij verschoont niet van mijn zonde."}],"17":[{"catchword":"verzegeld,","tekst":"Dat is, vast tezamen bijeengesloten en als met een zegel bewaard, opdat zij U uit de gedachtenis niet vergaan zou. Zegelen voor besluiten, opsluiten, toesluiten; Deu 32:34 ; Job 37:7 ."},{"catchword":"Gij pakt","tekst":"Dat is, Gij vlecht en voegt bij mijn voorgaande misdaden ook de tegenwoordige, om mijn zaak nog te bezwaren en mij nog harder te straffen."}],"18":[{"catchword":"vallende","tekst":"Hetwelk geschieden kan door aardbeving, wind, watervloed, of anderszins. De zin is: Gelijk een berg, nederstortende, teniet wordt, en een rots van haar plaats wijkt, en het water de stenen uitholt, en het stof der aarde, dat vanzelf daaruit voortkomt, overstelpt, hetwelk God doet; alzo is het hem nog veel lichter den welstand des mensen, die nog veel zwakker is dan de voorgemelde schepselen, om te keren en te vernietigen."}],"19":[{"catchword":"gewas,","tekst":"Zie van het Hebreeuwse woord 2Ki 19:29 ; Isa 37:30 ."}],"20":[{"catchword":"gaat heen;","tekst":"Dat is, verscheidt van hier door den dood."},{"catchword":"gelaat,","tekst":"Dat is, het wezen des lichaams, de kloekheid zijns geestes, den staat zijns levens, de heerlijkheid van zijn huis, de grootheid zijner middelen, de vermaardheid zijns naams, enz."}],"21":[{"catchword":"komen","tekst":"Te weten, door groten voorspoed, overvloedigen rijkdom, hogen staat, enz."},{"catchword":"hij weet het niet;","tekst":"Te weten, omdat hij uit de wereld gescheiden is, zulks dat zijner kinderen welvaren hem niet vermaakt."},{"catchword":"klein,","tekst":"Te weten, door tegenspoed, armoede, lagen staat, enz."},{"catchword":"let niet op hen","tekst":"Of, hij verneemt niet naar hen, of hij slaat hen niet gade; dat is, dood zijnde, is hij over hen niet bekommerd. Vergelijk Ecc 9:5 ."}],"22":[{"catchword":"Maar zijn vlees,","tekst":"De zin is, dat de mens alleen de ellende van dit leven en het kwalijkvaren van zijn huisgezin gevoelt, terwijl hij hier nog op aarde is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Man born of a woman is short of days, [i.e. hath but a short life. So likewise length of days, implieth a long life. See Pro 3:2. and the annotation.] and full [satur] of disquietness [Hebr. Of trouble, or commotion, i.e. full of trouble, toil and turmoil, distemper, and vexation, which ever and anon do seize upon him by reason of the many miseries of this life. Compare Ecc 2:23. See the like kind of speaking above 7.4. and the annot.]"}],"2":[{"catchword":null,"tekst":"He cometh forth like a flower, and is cut down; also he fleeth like a shadow, and abideth not."}],"3":[{"catchword":null,"tekst":"Yet doest thou open thine eyes over such a one: [viz. That is so wretched; for man in himself seemeth to be too unworthy and contemptible, that God, being of Such an infinite Majesty, should take thoughts or pains about, much less employ such might and force against him, so grievously to fall upon him with his punishments.] and thou drawest me into Judgement with thee. [Hebrew, bringeth me, or makest me to come, etc.]"}],"4":[{"catchword":null,"tekst":"Who shall give a clean one out of the unclean? Not one. [i.e. none is able to find out a man that is clean and without sin, being born of sinful man, according to the common course of nature. So he confesseth that himself likewise was unclean and sinful, desiring that God would be no less gracious to him, than to other penitent sinners, and punish him no more than others.]"}],"5":[{"catchword":null,"tekst":"Because his days are appointed, [i.e. the time of above verse 1. And the annotation. In the same sense his months are to be understood in the words immediately following. Thus below chap.29.2. he calleth the time past of his life, former months] the number of his months is with thee; and thou hast made his limitations, [viz. Of the whole progress and end of his life.] which he shall not pass over."}],"6":[{"catchword":null,"tekst":"Turn thy self off from him [to wit, from punishing and afflicting him in this manner.] that he may have rest: [or cease, viz. From grieving, by reason of the great pains he endureth. Oth. Until he do cease, viz.to live, as the Hebrew word is taken, Deut.15.11.] till like an hireling, [he compareth himself to a Labourer, that is hired for a day, or set time, in regard that men are appointed here, every one for so much time as God hath set him, to ply the work of their calling until they die] he take pleasure at his day. [viz. At his dying day, as below cvhap.15.32. i.e. till being satisfied of this life, he shall be glad and long to die, and to be translated into the eternal rest; like an hired labourer, that is wearied and even spent with his work, doth solace himself, and taketh pleasure in the hire of his labour, and longeth for the rest of the night. Oth. Put off his day; i.e. end his life: as if he did call his whole life time but a day, as above v.2. and 5. Days, and that in regard of its shortness; in which sense also the Greeks do call men Hemerioi, i.e. daily diurnal. Otherwise the word day can likewise be taken here for a days-work, or the work of a set time, or of the end of the hireling, or day labourer his day, when he cometh to rest from his labour, and to receive his wages.]"}],"7":[{"catchword":null,"tekst":"For, for a tree, when he is cut down there is expectation, that he shall yet change himself; [i.e. renew himself. The meaning is, That a tree, being cut down may come to sprout yet, and grow up again; but that a man, being felled down by many plagues, and put to death once, is not able to recover again the use and enjoinment of this life; and consequently, that in this regard man is in a worse and more wretched condition, than the very trees; which he doth alledge to move God to compassion, that he would vouchsafe him to enjoy some rest and refreshing yet in this life. Comp. This with above chap.7. verse 7,8, &c. Or A tree hath expectation, i.e. hope, &c. Unto trees there is ascribed sense and passions, understanding and speech; but improperly and onely by comparison; as it is also to those creatures, that have not so much as the vegetable life, as the abyss, the Sea Stones, the earth, &c. To add the more perspicuity and luster to the matter treated of, and the better to rouse up the reader to due attention. See Jud 9:8. and the annot. Item here below v.9. where the sense of smelling is attributed to the tree. See also below 23.14,22. & 31.38.] and his sprouting shall not cease."}],"8":[{"catchword":null,"tekst":"If his root wax old in the earth, and his trunk die in the dust;"}],"9":[{"catchword":null,"tekst":"He will sprout forth (again) from the smell of the waters: [viz. By means of moisture, which he attracteth out of the earth, whereby he is revived and comes to growth again.] and shall yield a branch like a plant. [i.e. not otherwise then if it were the root of a young stem."}],"10":[{"catchword":null,"tekst":"But a man [vir] dieth when he is weakened; [Other, and is destroyed, or quelled, subdued. Or when a man dieth, he is destroyed. Thus the Hebrew word is taken, Exo 17:13.] and man [homo] giveth (up) the ghost; where is he then? [viz. To be found in this earthly life: as if he said: it is done with him; there is no looking for him more in this life. See above ch.7.10.]"}],"11":[{"catchword":null,"tekst":"The waters run away [difflunt] out of a Sea, and a River dryeth up and with withered away. [The meaning is; like as waters, being let out from one place into another, do not return again to the former; so the soul of man being departed once out of the body, doth not return again into the same, viz. To live again here on earth. Other. Do the waters run away out of the Sea? And doth a river dry up and wither? V.12. but man lyeth down, etc.]"}],"12":[{"catchword":null,"tekst":"So a man lyeth down [i.e. dyeth: for death is here compared to the lying down to sleep. See hereof Deuter.31.on ver.16.] and riseth not up: [viz. To return into this earthly and transitory life,] They shall not awake, nor be raised out of their sleep, until the heavens be no more, [i.e. until the heavens shall pass away with a great stir, 2Pe 3:10. and the first heaven, and first earth perish, Rev 21:1. the resurrection from the dead being not to come to pass till then.]"}],"13":[{"catchword":null,"tekst":"O that [Hebr. Who shall give that, &c. See above chap.6.on v.8.] thou [he speaketh unto God here, urged to it by the excessive and deep sense of his suffering.] wouldst hide me in the grave; [i.e. cause me for a time to be dead and buried, that thy wrath, which is so fiercely kindled against me, might pass by in the mean while, and I then rise up again out of the grave, to live yet for a while in rest and quiet here, to thy glory, and the instruction of men.] (and) keep me close, until thine anger turn it self away: that thou wouldst set me a limitation [i.e. a set time, how long I should remain in the grave.] and be mindful of me! [viz. By the raising up of my body again, to shew a new mercy unto me. How remembrance is ascribed to God, see Gen.8.on v.1.]"}],"14":[{"catchword":null,"tekst":"When a man is dead, shall he live again? [Job doth bring in this opposition here, for to shew, that indeed he neither believed, nor expected any such raising from the grave, to an earthly and transitory life: for this kind of asking, doth infer a strong denial. See Genesis 18.on verse 17.] I should [if it were so, that a man might be made alive again thus.] hope, [viz. If thou shouldst hide me but for a certain time in the grave, to draw me afterwards forth again out of it, to the quiet and peaceable enjoying of this Earthly life.] all the days of my combat. [understand all the time that it shall please God thus to visit me here on earth. Of the word Combat, see above chap.7. verse 1. And compare above verse 5. And the annotation on the word Limitation.] until my change should come. [i.e. my rising again to a new earthly or temporal life.]"}],"15":[{"catchword":null,"tekst":"That thou shouldst call [viz. To rouse and raise me up again out of the grave, wherein // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',

  const MAX_CW = 60;

    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;

    if (b.modus === 'genummerd') {

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }

      }).join('');

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
